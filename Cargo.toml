[workspace]
members = [
	"crates-host/domain",
	"crates-host/host-target-tests",
	"crates-host/adapters",
	# {%- if protocol == "canopen" %}
	"crates-host/canopen",
	# {%- endif %}
	"crates-host/ports",
	# {%- if protocol == "protobuf" %}
	"crates-host/proto",
	# {%- endif %}
	"crates-host/xtask",
]
resolver = "3"

[workspace.package]
version      = "0.1.0"
edition      = "2024"
license      = "MIT"
# MSRV — столько требуют крейты rust-lib. Тулчейн в шаблоне не запинен
# (rust-toolchain.toml нет намеренно), и это поле — единственное, что даёт
# внятное "requires rustc 1.96" вместо случайной ошибки компиляции где-то в
# зависимостях.
rust-version = "1.96"

[workspace.lints.rust]
# Ни одного `unsafe` в host-крейтах (`domain`, `ports`, `adapters`,
# `xtask`) нет и быть не должно: это обычный Rust, а
# единственное, что могло бы его потребовать, — макросы, и появление unsafe
# в макросе чужого крейта должно быть видно сразу. В `crates-cross` тот же
# линт стоит как `warn`: там unsafe есть и оправдан (прыжок в образ, запись
# во флеш, блок линкерных символов), и каждое из этих
# мест перечислено `#[expect(unsafe_code)]` с объяснением — `deny` упал бы
# именно на них.
unsafe_code = "deny"
# Публичные типы печатаются в логах и в сообщениях `expect`: без `Debug` их
# нечем показать.
missing_debug_implementations = "warn"
# Тело `unsafe fn` не получает unsafe автоматически: каждая небезопасная
# операция внутри оборачивается в явный блок со своим `// SAFETY:`.
unsafe_op_in_unsafe_fn        = "warn"

[workspace.lints.clippy]
all                     = { level = "warn", priority = -1 }
unwrap_used             = "deny"
let_underscore_must_use = "deny"
dbg_macro               = "deny"
todo                    = "warn"
unimplemented           = "warn"
large_stack_arrays      = "warn"
# Каждый `unsafe`-блок обязан объяснять, почему он корректен. Ловит ровно то,
# что иначе ловить нечем: unsafe без комментария выглядит как обычная строка.
# Таких мест в шаблоне четыре, все в `crates-cross` и все подписаны, а
# `executor.poll()` в `app/src/main.rs` этому линту и обязан — до него он шёл
# без `// SAFETY:` вовсе.
undocumented_unsafe_blocks = "warn"
# `pedantic`: приведения без `as`, `# Errors`/`# Panics` в doc, `#[must_use]`.
# Приоритет -1, иначе группа конфликтует с отдельными линтами (clippy
# `lint_groups_priority`). `warn` вместе с `-D warnings` в `cargo xtask lint`
# даёт ошибку сборки, поэтому исключения пишутся точечно:
# `#[expect(lint, reason = "…")]`, а не `#[allow]`.
pedantic = { level = "warn", priority = -1 }
# Подавление без причины и мёртвое подавление — тоже долг: `reason` обязателен,
# а `#[expect]` сам падает, когда подавлять уже нечего.
allow_attributes_without_reason = "warn"
# Подмодули — `foo.rs` + `foo/`, а не `foo/mod.rs`.
mod_module_files        = "warn"
# `map_err(|_| …)` теряет причину отказа.
map_err_ignore          = "warn"

[workspace.dependencies]
# Крейты самого проекта: порты/адаптеры domain объявлены здесь, чтобы версия
# и путь были в одном месте, как у внешних зависимостей.
ports        = { path = "crates-host/ports" }
adapters     = { path = "crates-host/adapters" }
# {%- if protocol == "protobuf" %}
# Схема protobuf — крейт протокола, выбранного при генерации.
proto        = { path = "crates-host/proto" }
# {%- endif %}
# {%- if protocol == "canopen" %}
# Словарь CANopen — крейт протокола, выбранного при генерации.
canopen      = { path = "crates-host/canopen" }
# {%- endif %}
defmt-or-log = { version = "0.2.3" }
log          = { version = "0.4.34" }
defmt        = { version = "1.1.1" }
# no_std: у thiserror `default-features` включают "std", а domain и cross
# собираются без него (рабочий пример — `thiserror::Error` на
# `ports::DownloadError` и `ports::UpdateError`).
thiserror    = { version = "2.0.20", default-features = false }
# Только для dev-зависимостей `domain` и `adapters`: исполнитель async-тестов
# (`#[tokio::test]`) над фейками портов и флеша. Без `default-features` — из
# всего tokio нужны ровно однопоточный рантайм (`rt`) и атрибут (`macros`);
# сеть, файлы и время сюда не приезжают. В прошивку не уезжает:
# dev-зависимости path-зависимости cargo не собирает.
tokio        = { version = "1.53.1", default-features = false, features = ["rt", "macros"] }
# Задачи графа живут в `domain` (`domain::heartbeat`), а граф, который их спавнит, —
# в `crates-cross/app`. Контекст, который фрагмент эмитит в `domain` (`ctx:`),
# снимает с задачи знание о графе, но не о типах, которыми граф с ней
# разговаривает: `Heartbeat`, `TaskExit` и хэндлы каналов приходят отсюда. Фичи не объявлены намеренно —
# `defmt`/`metadata-name` просит `crates-cross/Cargo.toml`, и в прошивке они
# складываются с этой строкой; хостовой сборке domain они не нужны.
supervisor   = { git = "https://github.com/Sergycb/rust-lib.git" }
# Время в проекте одно — `embassy_time::Duration`: тем же типом граф задаёт
# свои таймауты, а `core::time::Duration` стоил бы вызова `__aeabi_uldivmod`
# на каждой конверсии. Версия та же, что в `crates-cross/Cargo.toml`, — иначе
# в прошивке оказалось бы две несовместимые копии крейта.
embassy-time = { version = "0.5.1" }
# Каждая задача графа — автомат `#[fsm::typestate]` на своём контексте
# (`ctx:` фрагмента): таблица переходов проверяется компилятором. Тот же
# репозиторий, что у `supervisor`.
fsm          = { git = "https://github.com/Sergycb/rust-lib.git" }
# Тип счётчика тиков сна в `domain::cpu_load::SleepTicks`. Не
# `core::sync::atomic::AtomicU64`: на Cortex-M0/M0+ его нет вовсе. Про то, чем
# там эмулируется CAS, — `docs/conventions.md` и
# `[target.thumbv6m-none-eabi]` в `crates-cross/.cargo/config.toml`.
portable-atomic = { version = "1.15.0" }
# Только для dev-зависимостей `domain`: хостовый тестовый бинарник линкует
# `supervisor`, а тот — `embassy-executor`, у которого без платформенной фичи
# нет `__pender` (и нет драйвера времени у `embassy-time`). В прошивку эти
# фичи не уезжают: dev-зависимости пути-зависимости не собираются вовсе.
embassy-executor = { version = "0.10.0" }
critical-section = { version = "1.2.0" }
# Адаптеры OTA и настроек generic по флешу и потому живут в корневом workspace:
# здесь те же версии, что в crates-cross/Cargo.toml (иначе в прошивке оказалось
# бы две копии крейта). `embassy-boot` — без `-stm32`: сам он от чипа не зависит,
# а `from_linkerfile` зовёт только `bsp`.
embassy-boot           = { version = "0.7.0" }
# Мьютекс флеша адаптеров. Версия та же, что в `crates-cross/Cargo.toml` и у `supervisor`, — иначе в
# прошивке оказалось бы две несовместимые копии крейта.
embassy-sync           = { version = "0.8.0" }
embedded-storage       = { version = "0.3.1" }
embedded-storage-async = { version = "0.4.1" }
sequential-storage     = { version = "8.0.1", default-features = false }
# {%- if protocol == "modbus" or protocol == "protobuf" %}
# Транспорт протоколов `domain` (`domain::modbus`): поток байтов, который уже
# реализуют `BufferedUart` из `embassy-stm32`, USB CDC и сокет `embassy-net`.
# Версия та же, что у `embassy-stm32` 0.6, — иначе в прошивке были бы две копии
# трейта, и UART его бы не реализовывал.
embedded-io-async      = { version = "0.7.0" }
# {%- endif %}
# {%- if protocol == "modbus" %}
# Разбор PDU Modbus: запросы на стороне slave (и ответы на стороне master, если он выбран).
# Выбран из десятка кандидатов прогоном одних и тех же проверок по спецификации
# и фаззингом — обоснование в `//!` модуля `domain::modbus`. `-types` — его словарь
# (`ExceptionCode`, `Address`); тянет `zerocopy` (MIT/Apache/BSD).
rusty-modbus-codec     = { version = "0.1.1", default-features = false }
rusty-modbus-types     = { version = "0.1.1", default-features = false }
# {%- endif %}
# {%- if protocol == "protobuf" %}
# Кадрирование потока (`adapters::cobs`): COBS — синхронизация по 0x00 после
# мусора или обрыва. Потоковый декодер берётся отсюда, своё — только транспорт
# и CRC. Тот же крейт стоит под `postcard` и `ergot`. Без `std` (он в default).
cobs                   = { version = "0.5.1", default-features = false }
# {%- endif %}
# {%- if protocol == "modbus" or protocol == "protobuf" %}
# CRC кадров: CRC-16/IBM-SDLC (X.25, FCS у HDLC/PPP) в `adapters::cobs`,
# CRC-16/MODBUS в `domain::modbus` — одна реализация вместо своих.
crc                    = { version = "3.4.0" }
# {%- endif %}
# {%- if protocol == "protobuf" %}
# Protobuf (`crates-host/proto` — схема и сгенерированные типы, `domain` —
# узел HOST): без alloc, повторяющиеся поля и строки — в контейнерах
# `heapless` 0.9, той же версии, что у остального дерева.
micropb                = { version = "0.6.0", default-features = false, features = [
	"encode",
	"decode",
	"container-heapless-0-9",
] }
heapless               = { version = "0.9.3" }
# Генерация кода из `.proto` в `build.rs` крейта `proto`. Схему разбирает
# `protox` — компилятор protobuf на чистом Rust, — и `micropb-gen` строит код
# из готового описания (`compile_fdset_file`): системный `protoc` не нужен ни
# разработчику, ни в CI.
micropb-gen            = { version = "0.6.0" }
protox                 = { version = "0.9.1" }
# {%- endif %}
# {%- if interface == "tcp" or interface == "udp" %}
# Сетевой стек под интерфейсами tcp/udp (`adapters::net`, узел `domain::net`):
# версия, парная к `embassy-stm32` 0.6 (те же `embassy-net-driver` 0.2,
# `embassy-sync`, `embassy-time`, `embedded-io-async`). `smoltcp` под ним —
# 0BSD, разрешение в `deny.toml`. DHCP и статический адрес — оба: что из них,
# решает `bsp::net`.
embassy-net            = { version = "0.9.1", features = [
	"tcp",
	"udp",
	"proto-ipv4",
	"medium-ethernet",
	"dhcpv4",
] }
# {%- endif %}
# {%- if interface == "usb" %}
# USB-устройство под интерфейсом usb (`adapters::usb`, узел `domain::usb`):
# версия, парная к `embassy-stm32` 0.6 (те же `embassy-usb-driver` 0.2,
# `embassy-sync`, `heapless`). Без default-фич: `usbd-hid` шаблону не нужен.
embassy-usb            = { version = "0.6.0", default-features = false }
# {%- endif %}
# {%- if protocol == "canopen" %}
# CANopen: стек узла (`zencan-node`) и генерация словаря объектов из TOML-описания
# устройства (`zencan-build`, в `build.rs` крейта `canopen`). MPL-2.0 —
# исключение в `deny.toml`. Без `std`/`log` в default — их выбирают крейты.
zencan-node            = { version = "0.0.5", default-features = false }
zencan-build           = { version = "0.0.5" }
# Кадр CAN в порту `ports::CanBus`: трейт `Frame`, который реализует кадр
# `embassy-stm32` — та же версия 0.4.
embedded-can           = { version = "0.4.1" }
# {%- endif %}
# Проверка подписи образа — под фичей `domain/signed`. Из двух реализаций,
# которые понимает embassy-boot, взята меньшая: `ed25519-dalek` тянет
# `curve25519-dalek` с `sha2`, salty самодостаточен и написан под
# микроконтроллеры. `slow-motion` — портируемая tweetnacl-реализация вместо
# ассемблерной `haase` (инструкция UMAAL, только Cortex-M4/M33): работает на
# любом ядре ценой скорости — ~100 млн тактов на проверку, меньше секунды, и
# случается это один раз перед перезагрузкой.
salty                  = { version = "0.3.0", default-features = false, features = ["slow-motion"] }
# Property-based testing: `domain::ota::download::receive` проверяется на любом
# разбиении образа на куски и любой ширине слова, а не на нескольких
# выбранных руками. Только `[dev-dependencies]` `domain`.
proptest               = { version = "1.0.0" }
# Snapshot tests: точный вид строк отчёта `cargo xtask build` фиксируется
# целиком, а не набором `contains`. Только `[dev-dependencies]` `xtask`.
insta                  = { version = "1.34.0", default-features = false }
