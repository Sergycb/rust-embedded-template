[workspace]
members = [
	"crates-host/domain",
	"crates-host/host-target-tests",
	"crates-host/domain/adapters",
	"crates-host/domain/ports",
	"crates-host/xtask",
]
resolver = "3"

[workspace.package]
version      = "0.1.0"
edition      = "2024"
license      = "MIT"
# MSRV — столько требуют крейты rust-lib. Тулчейн в шаблоне не запинен
# (rust-toolchain.toml нет намеренно), и это поле — единственное, что даёт
# внятное "requires rustc 1.96" вместо случайной ошибки компиляции где-то в
# зависимостях.
rust-version = "1.96"

[workspace.lints.clippy]
all                     = { level = "warn", priority = -1 }
unwrap_used             = "deny"
let_underscore_must_use = "deny"
dbg_macro               = "deny"
todo                    = "warn"
unimplemented           = "warn"
large_stack_arrays      = "warn"

[workspace.lints.rust]
# `cargo kani` определяет cfg(kani) само; вне kani-компилятора rustc его не
# знает (см. crates-host/domain/src/kani_proofs.rs, CI-job `kani`).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.dependencies]
# Крейты самого проекта: порты/адаптеры domain объявлены здесь, чтобы версия
# и путь были в одном месте, как у внешних зависимостей.
ports        = { path = "crates-host/domain/ports" }
adapters     = { path = "crates-host/domain/adapters" }
defmt-or-log = { version = "0.2.3" }
log          = { version = "0.4.34" }
defmt        = { version = "1.1.1" }
# no_std: у thiserror `default-features` включают "std", а domain и cross
# собираются без него (см. рабочий пример — thiserror::Error на
# `download::Error<E>` и `bsp::ota::UpdateError`).
thiserror    = { version = "2.0.20", default-features = false }
test-log     = { version = "0.2.21" }
# Задачи графа живут в `domain` (`domain::app`), а граф, который их спавнит, —
# в `crates-cross/app`. Проекция аргументов (`task: path(ctx.field)`) снимает с
# задачи знание о графе, но не о типах, которыми граф с ней разговаривает:
# `Heartbeat` и `TaskExit` приходят отсюда. Фичи не объявлены намеренно —
# `defmt`/`metadata-name` просит `crates-cross/Cargo.toml`, и в прошивке они
# складываются с этой строкой; хостовой сборке domain они не нужны.
supervisor   = { git = "https://github.com/Sergycb/rust-lib.git" }
# Время в проекте одно — `embassy_time::Duration`: тем же типом граф задаёт
# свои таймауты, а `core::time::Duration` стоил бы вызова `__aeabi_uldivmod`
# на каждой конверсии. Версия та же, что в `crates-cross/Cargo.toml`, — иначе
# в прошивке оказалось бы две несовместимые копии крейта.
embassy-time = { version = "0.5.1" }
# Только для dev-зависимостей `domain`: хостовый тестовый бинарник линкует
# `supervisor`, а тот — `embassy-executor`, у которого без платформенной фичи
# нет `__pender` (и нет драйвера времени у `embassy-time`). В прошивку эти
# фичи не уезжают: dev-зависимости пути-зависимости не собираются вовсе.
embassy-executor = { version = "0.10.0" }
critical-section = { version = "1.2.0" }
# Адаптеры OTA и настроек generic по флешу и потому живут в корневом workspace:
# здесь те же версии, что в crates-cross/Cargo.toml (иначе в прошивке оказалось
# бы две копии крейта). `embassy-boot` — без `-stm32`: сам он от чипа не зависит,
# а `from_linkerfile_blocking` зовёт только `bsp`.
embassy-boot           = { version = "0.7.0" }
embassy-sync           = { version = "0.8.0" }
embedded-storage       = { version = "0.3.1" }
embedded-storage-async = { version = "0.4.1" }
sequential-storage     = { version = "8.0.1", default-features = false }
# Проверка подписи образа — под фичей `adapters/signed`. Из двух реализаций,
# которые понимает embassy-boot, взята меньшая: `ed25519-dalek` тянет
# `curve25519-dalek` с `sha2`, salty самодостаточен и написан под
# микроконтроллеры. `slow-motion` — портируемая tweetnacl-реализация вместо
# ассемблерной `haase` (инструкция UMAAL, только Cortex-M4/M33): работает на
# любом ядре ценой скорости — ~100 млн тактов на проверку, меньше секунды, и
# случается это один раз перед перезагрузкой.
salty                  = { version = "0.3.0", default-features = false, features = ["slow-motion"] }
