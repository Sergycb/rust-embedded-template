[workspace]
members = [
	"domain",
	"host-target-tests",
	"domain/adapters",
	"domain/ports",
	"xtask",
]
resolver = "3"

[workspace.lints.clippy]
all                     = { level = "warn", priority = -1 }
unwrap_used             = "deny"
let_underscore_must_use = "deny"
dbg_macro               = "deny"
todo                    = "warn"
unimplemented           = "warn"
large_stack_arrays      = "warn"

[workspace.lints.rust]
# `cargo kani` определяет cfg(kani) само; вне kani-компилятора rustc его не
# знает (см. domain/src/kani_proofs.rs, CI-job `kani`).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.dependencies]
thiserror           = { version = "2.0.18", default-features = false }
fixed               = { version = "1.31.0" }
portable-atomic     = { version = "1.13.1" }
type-state-builder  = { version = "0.5.1" }
mitsein             = { version = "0.9.0", default-features = false, features = ["heapless"] }
futures-concurrency = { version = "7.7.1", default-features = false }
aselect             = { version = "0.4.0", default-features = false }
  # wg (AsyncWaitGroup) сюда не включён: его async-реализация жёстко требует
  # alloc (Arc-based clone), no_std/no-alloc варианта нет ни у wg, ни у
  # исследованных альтернатив (waitgroup, awaitgroup, async-wg, mea,
  # compact-waitgroup — все тоже на Arc).
sync_wrapper          = { version = "1.0.2" }
  # intrusive-collections убран: `AtomicLink` (singly/xor_linked_list)
  # реализован через голый core::sync::atomic::*::compare_exchange без
  # эмуляции — на Cortex-M0/M0+ (ARMv6-M, нет аппаратного CAS) это не
  # компилируется вообще, независимо от того, какую структуру из крейта
  # реально использует код (весь модуль собирается безусловно, фичей не
  # спрятан). Обнаружено сборкой cross под STM32G071RB. Крейт был подключён
  # только ради примера (domain/examples/intrusive_collections_wait_list.rs,
  # удалён вместе с этой записью), в реальном коде domain не использовался —
  # менять было нечего на замену.
miniconf              = { version = "0.21.0", default-features = false, features = [
	"derive",
	"json-core",
] }
zerocopy             = { version = "0.8.52" }
itertools            = { version = "0.15.0", default-features = false }
cfg-if               = { version = "1.0.4" }
document-features    = { version = "0.2.12" }
derive_more          = { version = "2.1.1", default-features = false }
static_cell          = { version = "2.1.1" }
array-macro          = { version = "2.1.8" }
heapless             = { version = "0.9.3" }
bon                  = { version = "3.9.3", default-features = false }
embassy-futures      = { version = "0.1.2" }
embassy-embedded-hal = { version = "0.6.0", features = ["time"] }
embassy-sync         = { version = "0.8.0" }
embassy-time         = { version = "0.5.1" }
embassy-boot         = { version = "0.7.0" }
defmt-or-log         = { version = "0.2.3" }
log                  = { version = "0.4.33" }
defmt                = { version = "1.1.0" }
critical-section     = { version = "1.2.0" }
embedded-hal-mock    = { version = "0.11.1", features = ["embedded-hal-async"] }
mockall              = { version = "0.15.0" }
proptest             = { version = "1.11.0" }
rstest               = { version = "0.26.1" }
tokio                = { version = "1.52.3", features = ["rt", "macros", "time"] }
futures              = { version = "0.3.32", default-features = false }
test-log             = { version = "0.2.21" }

# Крейты из личной библиотеки (github.com/Sergycb/rust-lib), заменившие
# сторонние аналоги, которые раньше стояли здесь. Не предлагать старые
# обратно — дело не только в дублировании, у каждого был конкретный изъян:
#
# * `fsm` (+ `fsm-async`) вместо `statig` и `hsmc`. Два сторонних крейта
#   покрывали два режима одного и того же (автомат-компонент и автомат-
#   задача); здесь это один core (`fsm::Runtime`) и async-обёртка над ним
#   (`fsm_async::AsyncTimedRuntime`), с общей иерархией/таймаутами. Сверх
#   того, `hsmc` требовал у domain зеркальной фичи `"embassy"` — без неё
#   `statechart!` молча генерировал sync-вариант без `run()` — и тянул
#   heapless 0.8 рядом с 0.9 workspace'а.
# * `sync-request` вместо `embedded-rpc` — тот же межзадачный
#   request/response, но с generation-tagged отменой (см. `RpcService`).
# * `typestate` вместо одноимённого крейта 0.9.0-rc2. Тот не объявлял
#   `#![no_std]` ни при какой конфигурации фич и падал с E0463 на
#   `thumbv7em-none-eabihf` — годился только в `[dev-dependencies]`. Этот
#   `no_std` по-настоящему, поэтому объявлен обычной зависимостью.
#
# Крейты `supervisor` и `watchdog` из той же библиотеки — не здесь, а в
# `cross/Cargo.toml`: первый спавнит `#[embassy_executor::task]`, второй
# драйвит аппаратный IWDG.
fsm          = { git = "https://github.com/Sergycb/rust-lib.git" }
fsm-async    = { git = "https://github.com/Sergycb/rust-lib.git" }
sync-request = { git = "https://github.com/Sergycb/rust-lib.git" }
typestate    = { git = "https://github.com/Sergycb/rust-lib.git" }
