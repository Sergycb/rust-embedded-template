# Послабления для тестов: `unwrap_used`/`dbg_macro` объявлены `deny` в обоих
# `[workspace.lints.clippy]`, потому что в прошивке любой `unwrap` — это
# потенциальная паника в поле. В тесте паника и есть способ сообщить о провале,
# а `.unwrap()` — обычная идиома, которой написан примерно весь Rust.
#
# Файла в корне не было, и асимметрия ловилась не сразу: `crates-cross` тесты
# писать разрешал, а корневой workspace — нет, так что первый же host-тест с
# `.unwrap()` ронял `cargo xtask lint` с требованием переписать его на
# `.expect(..)`.
#
# Важная оговорка про область действия: послабление распространяется на тела
# `#[test]`-функций и модулей `#[cfg(test)]`, но НЕ на обычные вспомогательные
# функции в `tests/*.rs`. В хелпере (`fn read_persist(..)` рядом с тестом)
# `.unwrap()` по-прежнему запрещён — и это скорее к лучшему: `.expect("что
# именно ожидали")` в помощнике объясняет провал, который иначе покажет только
# номер строки. Так и написан `crates-host/host-target-tests/tests/test.rs`.
#
# Копия в `crates-cross/clippy.toml` нужна и удалению не подлежит, хотя выглядит
# дублированием: clippy не поднимается выше корня СВОЕГО workspace, а их здесь
# два. Проверено удалением — `unwrap_used` в `crates-cross/target-tests` тут же
# начинает срабатывать снова. Меняете послабления — меняйте оба файла.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-dbg-in-tests = true
