[package]
name = "app"
version = "0.1.0"
edition = "2024"

[features]
debug = ["defmt"]
release = ["log", "dep:panic-abort"]
defmt = [
	"dep:defmt",
	"dep:defmt-rtt",
	"dep:panic-probe",
	"panic-probe/print-defmt",
	"embassy-stm32/defmt",
	"embassy-executor/defmt",
	"embassy-time/defmt",
	"embassy-time/defmt-timestamp-uptime-ms",
	"embassy-sync/defmt",
	"bsp/defmt",
]
log = [
	"dep:log",
	"embassy-stm32/log",
	"embassy-executor/log",
	"embassy-time/log",
	"embassy-sync/log",
	"bsp/log",
]

[[bin]]
name = "app"
harness = false

[dependencies]
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
embassy-stm32 = { workspace = true }
embassy-executor = { workspace = true }
embassy-time = { workspace = true }
defmt = { workspace = true, optional = true }
defmt-rtt = { workspace = true, optional = true }
defmt-or-log = { workspace = true }
log = { workspace = true, optional = true }
panic-probe = { workspace = true, optional = true }
panic-abort = { workspace = true, optional = true }
embassy-sync = { workspace = true }
bsp = { workspace = true }
