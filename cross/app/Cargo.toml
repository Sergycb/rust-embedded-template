[package]
name = "app"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "app"
harness = false

[dependencies]
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
embassy-executor = { workspace = true, features = ["defmt"] }
defmt = { workspace = true }
defmt-rtt = { workspace = true }
panic-probe = { workspace = true, features = ["print-defmt"] }
bsp = { workspace = true }
domain = { workspace = true, features = ["defmt"] }
shadow-rs = { workspace = true }
# Не используются напрямую в main.rs — держатся здесь реальной (не только
# объявленной в workspace) зависимостью, чтобы версия была проверена
# настоящей сборкой на ARM, как и остальные библиотеки в этом файле.
# Паттерн использования — doc-комментарий в task_orchestration.rs.
supervisor = { workspace = true }
watchdog = { workspace = true }

[build-dependencies]
shadow-rs = { workspace = true, features = ["build", "no_std"] }
