[package]
name = "app"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
debug = ["defmt"]
release = ["log", "dep:panic-halt"]
defmt = [
	"dep:defmt",
	"dep:defmt-rtt",
	"dep:panic-probe",
	"panic-probe/print-defmt",
	"defmt-or-log/defmt",
	"embassy-executor/defmt",
	"bsp/defmt",
	"domain/defmt",
]
log = [
	"dep:log",
	"defmt-or-log/log",
	"embassy-executor/log",
	"bsp/log",
	"domain/log",
]

[[bin]]
name = "app"
harness = false

[dependencies]
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
embassy-executor = { workspace = true }
defmt-or-log = { workspace = true }
defmt = { workspace = true, optional = true }
log = { workspace = true, optional = true }
defmt-rtt = { workspace = true, optional = true }
panic-probe = { workspace = true, optional = true }
panic-halt = { workspace = true, optional = true }
bsp = { workspace = true }
domain = { workspace = true }
shadow-rs = { workspace = true }
embassy-supervisor = { workspace = true }
embassy-task-watchdog = { workspace = true }
ector = { workspace = true }

[build-dependencies]
shadow-rs = { workspace = true, features = ["build", "no_std"] }
