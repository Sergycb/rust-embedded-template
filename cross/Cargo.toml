[workspace]
members = ["app", "boot", "bsp", "target-tests"]
resolver = "3"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
let_underscore_must_use = "deny"
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"
large_stack_arrays = "warn"

[workspace.dependencies]
cortex-m = { version = "0.7.7", features = [
	"critical-section-single-core",
	"inline-asm",
	"linker-plugin-lto",
] }
cortex-m-rt = { version = "0.7.5" }
defmt = { version = "1.1.0" }
defmt-or-log = { version = "0.2.3" }
defmt-rtt = { version = "1.2.0" }
log = { version = "0.4.33" }
panic-probe = { version = "1.0.0" }
# panic-abort не обновлялся с 2019 года и требует nightly-фичу
# `#![feature(core_intrinsics)]` — не собирается на stable. panic-halt —
# актуальная, стабильная замена с тем же поведением (halt вместо unwind).
panic-halt = { version = "1.0.0" }
embassy-stm32 = { version = "0.6.0", features = [
	"time-driver-any",
	"{{chip_feature}}",
] }
embassy-executor = { version = "0.10.0", features = [
	"platform-cortex-m",
	"executor-thread",
] }
embassy-boot-stm32 = { version = "0.8.0" }
embassy-sync = { version = "0.8.0" }
embedded-test = { version = "0.7.1", default-features = false, features = [
	"embassy-010",
	"semihosting",
] }
panic-persist = { version = "0.3.0" }
bsp = { path = "./bsp" }
boot = { path = "./boot" }
app = { path = "./app" }
domain ={ path = "../domain"}
target-tests = { path = "./target-tests" }
shadow-rs = { version = "2.0.0", default-features = false }
assign-resources = { version = "0.5.0" }

# Task supervision / lifecycle: реальная оркестрация embassy-задач (нужен
# Spawner) — остаётся в cross. Логика (что делает задача) — в domain, cross
# только создаёт объекты и спавнит. Рационале — см. doc-комментарии в
# cross/app/src/task_orchestration.rs.
embassy-supervisor = { version = "0.3.0", default-features = false, features = [
	"macros",
] }
embassy-task-watchdog = { version = "0.0.9", features = ["stm32"] }
ector = { version = "0.9.0", default-features = false, features = ["time"] }

# Zero-copy DMA-буфер: статические объекты создаются только в cross —
# см. cross/bsp/src/buffers.rs.
bbqueue = { version = "0.7.0", default-features = false, features = [
	"critical-section",
] }

# defmt-транспорт для release-прошивки (без пробника, RTT недоступен) — см.
# doc-комментарий в cross/app/src/task_orchestration.rs. `embassy-usb` пинуется
# на 0.5.x, а не на актуальные 0.6.0 — потому что defmt-embassy-usbserial
# требует именно "^0.5"; поднимать версию нельзя, будут две несовместимые копии
# embassy-usb в графе (проверено: defmt-bbq по той же причине отбракован —
# держит defmt@0.3.x при defmt@1.1.0 у нас, `symbol multiply defined` при
# реальной попытке использовать оба).
defmt-embassy-usbserial = { version = "0.2.1" }
embassy-usb = { version = "0.5" }

# ВНИМАНИЕ: `debug-assertions` в этих двух профилях — не только про проверки
# переполнения. `app`/`boot` выбирают паникёр и defmt-транспорт через
# `#[cfg(debug_assertions)]` в main.rs (см. CLAUDE.md, "Feature-flag
# конвенции"), а не через Cargo-фичу. Если поменять `debug-assertions` здесь
# (например, ради диагностики бага в release-сборке) — вслед за этим молча
# переключится и паникёр/транспорт в прошивке, без предупреждения компилятора.
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = "s"         # <-
overflow-checks = true
lto = "fat"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
opt-level = "s"
overflow-checks = false
lto = "fat"

[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true # <-
incremental = false
opt-level = "s"         # <-
overflow-checks = true  # <-
lto = "fat"
