[workspace]
members = ["app", "boot", "bsp", "target-tests"]
resolver = "3"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
let_underscore_must_use = "deny"
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"
large_stack_arrays = "warn"

[workspace.dependencies]
cortex-m = { version = "0.7.7", features = [
	"critical-section-single-core",
	"inline-asm",
	"linker-plugin-lto",
] }
cortex-m-rt = { version = "0.7.5" }
defmt-rtt = { version = "1.2.0" }
panic-probe = { version = "1.0.0" }
panic-abort = { version = "0.3.2" }
embassy-stm32 = { version = "0.6.0", features = [
	"time-driver-any",
	"{{chip_feature}}",
] }
embassy-executor = { version = "0.10.0", features = [
	"platform-cortex-m",
	"executor-thread",
] }
embassy-boot-stm32 = { version = "0.8.0" }
embedded-test = { version = "0.7.1", default-features = false, features = [
	"embassy-010",
	"semihosting",
] }
panic-persist = { version = "0.3.0" }
bsp = { path = "./bsp" }
boot = { path = "./boot" }
app = { path = "./app" }
domain ={ path = "../domain"}
target-tests = { path = "./target-tests" }


[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = "s"         # <-
overflow-checks = true
lto = "fat"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
opt-level = "s"
overflow-checks = false
lto = "fat"

[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true # <-
incremental = false
opt-level = "s"         # <-
overflow-checks = true  # <-
lto = "fat"
