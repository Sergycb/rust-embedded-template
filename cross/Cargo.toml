[workspace]
# "boot" — только когда OTA-схема embassy-boot помещается в flash выбранного
# чипа (переменная ota из chip-select.rhai). Если нет — каталог cross/boot в
# проект не копируется вовсе (см. [conditional] в cargo-generate.toml), и
# членом workspace ему быть нельзя.
members  = ["app", {% if ota == "true" %}"boot", {% endif %}"bsp", "target-tests"]
resolver = "3"

[workspace.package]
version      = "0.1.0"
edition      = "2024"
license      = "MIT"
# Тот же MSRV, что в корневом Cargo.toml — воркспейса два, а тулчейн один.
rust-version = "1.96"

[workspace.lints.rust]
# `#[embedded_test::tests]` генерирует ветку под `cfg(rust_analyzer)`, чтобы IDE
# видела тела тестов как обычный код. Для rustc этот cfg неизвестен, и
# `-D warnings` в `cargo xtask lint cross` превращал бы предупреждение в ошибку.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)"] }

[workspace.lints.clippy]
all                     = { level = "warn", priority = -1 }
unwrap_used             = "deny"
let_underscore_must_use = "deny"
dbg_macro               = "deny"
todo                    = "warn"
unimplemented           = "warn"
large_stack_arrays      = "warn"

[workspace.dependencies]
cortex-m = { version = "0.7.7", features = [
	"critical-section-single-core",
	"inline-asm",
	"linker-plugin-lto",
] }
cortex-m-rt   = { version = "0.7.5" }
defmt         = { version = "1.1.0" }
defmt-rtt     = { version = "1.2.0" }
panic-probe   = { version = "1.0.0" }
embassy-stm32 = { version = "0.6.0", features = [
	"time-driver-any",
	"{{chip_feature}}",{% if bank_mode != "" %}
	# У этого чипа stm32-metapac несёт несколько карт памяти, и build.rs
	# embassy-stm32 без явного выбора паникует ("Chip supports single and dual
	# bank configuration"). Значение выставляет chip-select.rhai (BANK_MODE).
	"{{bank_mode}}",{% endif %}
] }
embassy-executor = { version = "0.10.0", features = [
	"platform-cortex-m",
	"executor-thread",
] }
embassy-boot-stm32 = { version = "0.8.0" }
embassy-sync       = { version = "0.8.0" }
# Прямая зависимость нужна target-tests (embassy-stm32 тянет тот же крейт
# транзитивно, но полагаться на это для `use embassy_time::..` нельзя).
embassy-time       = { version = "0.5.1" }
# default отключён намеренно: в него входит `panic-handler`, а паникёр в
# бинарнике должен быть ровно один — им остаётся panic-probe, как в app и
# boot. `defmt` включён, чтобы вывод самого харнесса шёл тем же транспортом,
# что и логи прошивки.
embedded-test      = { version = "0.7.1", default-features = false, features = [
	"embassy-010",
	"defmt",
	"semihosting",
] }
bsp              = { path = "./bsp" }{% if ota == "true" %}
boot             = { path = "./boot" }{% endif %}
app              = { path = "./app" }
# `default-features = false` обязательно: дефолт domain — фича `log` (нужна
# хост-сборке, см. её [features]), а в прошивке используется только defmt.
domain           = { path = "../domain", default-features = false, features = [
	"defmt",
] }
target-tests     = { path = "./target-tests" }
shadow-rs        = { version = "2.0.0", default-features = false }
assign-resources = { version = "0.5.0" }

# Крейты из личной библиотеки (github.com/Sergycb/rust-lib). Здесь только те
# два, что действительно про железо и оркестрацию; `fsm`/`fsm-async`/
# `sync-request`/`typestate` из той же библиотеки объявлены в корневом
# workspace'е и подключаются к `domain` — cross получает их через него.
#
# `supervisor` заменил сразу три сторонних крейта: `embassy-supervisor`
# (упорядоченный старт по графу), `embassy-task-watchdog` (мультиплексор
# watchdog'ов, теперь — блок `watchdog:` в том же макросе) и `ector`
# (actor-паттерн, теперь — поля `inbox:`/`publish:`/`request:` узла). Раньше
# три независимых макро-DSL описывали один и тот же граф задач трижды.
# `watchdog` — no_std-ядро мультиплексора (`Clock`/`HardwareWatchdog`),
# нужно напрямую, чтобы `bsp` мог реализовать эти два трейта над IWDG.
supervisor       = { git = "https://github.com/Sergycb/rust-lib.git" }
watchdog         = { git = "https://github.com/Sergycb/rust-lib.git" }

# Zero-copy DMA-буфер: статические объекты создаются только в cross —
# см. cross/bsp/src/buffers.rs.
bbqueue = { version = "0.7.0", default-features = false, features = [
	"critical-section",
] }

# `embassy-usb` здесь больше нет: он стоял запиненным на 0.5 (а не на
# актуальную 0.6) исключительно потому, что этого требовал
# `defmt-embassy-usbserial` — готовый `#[global_logger]` над USB CDC-ACM,
# убранный вместе с остальными заменёнными зависимостями. Своего применения
# у `embassy-usb` в шаблоне не было. Если понадобится USB — берите версию,
# парную к текущей `embassy-stm32`, а не 0.5.

[profile.dev]
codegen-units    = 1
debug            = 2
debug-assertions = true
incremental      = false
opt-level        = "s"    # <-
overflow-checks  = true
lto              = "fat"

[profile.release]
codegen-units    = 1
debug            = 2
debug-assertions = false
incremental      = false
opt-level        = "s"
overflow-checks  = false
lto              = "fat"

[profile.test]
codegen-units    = 1
debug            = 2
debug-assertions = true   # <-
incremental      = false
opt-level        = "s"    # <-
overflow-checks  = true   # <-
lto              = "fat"
