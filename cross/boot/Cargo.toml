[package]
name = "boot"
version = "0.1.0"
edition = "2024"

[features]
debug = ["defmt"]
release = ["dep:panic-abort"]
defmt = [
	"dep:defmt",
	"dep:defmt-rtt",
	"dep:panic-probe",
	"panic-probe/print-defmt",
	"embassy-boot/defmt",
	"embassy-boot-stm32/defmt",
	"embassy-stm32/defmt",
	"embassy-sync/defmt",
]

[[bin]]
name = "boot"
harness = false

[dependencies]
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
defmt = { workspace = true, optional = true }
defmt-rtt = { workspace = true, optional = true }
panic-probe = { workspace = true, optional = true }
panic-abort = { workspace = true, optional = true }
panic-persist = { workspace = true }
embassy-boot = { workspace = true }
embassy-boot-stm32 = { workspace = true }
embassy-stm32 = { workspace = true }
embassy-sync = { workspace = true }
