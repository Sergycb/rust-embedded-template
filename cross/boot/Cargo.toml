[package]
name = "boot"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
debug = ["defmt"]
release = ["log", "dep:panic-halt"]
defmt = [
	"dep:defmt",
	"dep:defmt-rtt",
	"dep:panic-probe",
	"panic-probe/print-defmt",
	"defmt-or-log/defmt",
	"embassy-boot-stm32/defmt",
	"embassy-stm32/defmt",
]
log = ["dep:log", "defmt-or-log/log", "embassy-stm32/log", "embassy-boot-stm32/log"]

[[bin]]
name = "boot"
harness = false

[dependencies]
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
defmt-rtt = { workspace = true, optional = true }
defmt-or-log = { workspace = true }
defmt = { workspace = true, optional = true }
log = { workspace = true, optional = true }
panic-probe = { workspace = true, optional = true }
panic-halt = { workspace = true, optional = true }
panic-persist = { workspace = true }
embassy-boot-stm32 = { workspace = true }
embassy-stm32 = { workspace = true }
embassy-sync = { workspace = true }
