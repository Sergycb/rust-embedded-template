# Host-тесты — только через nextest (`cargo xtask test host`): он даёт тесту
# свой процесс, а часы `MockDriver` — одни на процесс, и под `cargo test`
# тесты с ними нестабильны — docs/conventions.md, «Host-тесты — только через
# nextest».
#
# Host-тесты `domain`, `adapters` и `adapters-logic` идут над фейками портов и флеша, которые
# не ждут по-настоящему: их future готовы с первого `poll` (`mod fakes`
# рядом с тестами){% if has_net == "true" %}, а сетевые тесты `adapters_logic::net`
# гоняют два стека `embassy-net` в памяти при стоящем времени — за
# миллисекунды{% endif %}. Тест, не кончившийся за секунды, уже завис. Раньше это ловил самописный `block_on` — паникой на `Pending`;
# с `#[tokio::test]` такой тест висел бы до таймаута CI-раннера. Поэтому
# nextest его убивает, а не только помечает медленным.
#
# Только этим крейтам: `host-target-tests` в том же workspace прошивают и
# гоняют живую плату, и им честные десятки секунд нужны. Регулярное выражение,
# а не перечень `package(…)`: крейта, которого нет в проекте, nextest
# не прощает — фильтр с ним падает.
[[profile.default.overrides]]
filter = 'package(/^(domain|adapters|adapters-logic)$/)'
slow-timeout = { period = "10s", terminate-after = 2 }
