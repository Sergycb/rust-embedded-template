[package]
name = "domain"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Хост-дефолт: без одной из фич `log`/`defmt` не собирается `defmt-or-log`, и
# первое же `cargo build`/`cargo test` в свежесгенерированном проекте (и
# rust-analyzer в IDE) падало с compile_error из чужого крейта. В прошивку
# `log` при этом не попадает: crates-cross/Cargo.toml подключает domain с
# `default-features = false, features = ["defmt"]`.
default = ["log"]
defmt = [
	"dep:defmt",
	"defmt-or-log/defmt",
	"ports/defmt",
]
log = [
	"dep:log",
	"defmt-or-log/log",
]
std = [
	"log?/std"
]

[dependencies]
# Порты — границы самого домена: логика вызывает их, а реализации приходят из
# `adapters` (хост) и `crates-cross/bsp` (железо). Зависимость нужна, чтобы
# правило «порт заводится под то, чем пользуется логика» было выполнимым: без
# неё `domain` не может даже назвать `ports::FirmwareUpdate`.
ports = { workspace = true }
defmt-or-log = { workspace = true }
log = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
# Задачи, которые спавнит граф из `crates-cross/app`, живут здесь (`app.rs`,
# `ota.rs`) — вместе со своими фрагментами и политикой. `supervisor` нужен им
# ради типов, которыми граф разговаривает с задачей: `Heartbeat` (отметка у
# сторожа), `TaskExit` (чем кончился прогон), `BackoffPolicy` (константа
# политики узла). Знания о самом графе это не даёт — контекст задачи эмитит
# фрагмент здесь же (`ctx: $crate::app::AppCtx`), типы его полей приходят через
# `::supervisor::__private`, и тип compose-site здесь не называется, — но
# `embassy-executor` приезжает транзитивно, так что старое правило «в domain
# нет embassy» больше не действует (docs/architecture.md).
supervisor = { workspace = true }
# Прямо, а не транзитивно через `supervisor`: `Ticker`/`Timer`/`Duration` стоят
# в теле задачи, а не только в её сигнатуре.
embassy-time = { workspace = true }
# Задачи узлов — автоматы `#[fsm::typestate]` на контексте фрагмента.
fsm = { workspace = true }
# Прямо, а не транзитивно: тип счётчика в `tasks::cpu_load::SleepTicks` —
# `portable_atomic::AtomicU64`, потому что на Cortex-M0/M0+ у `core` такого
# атомика нет вовсе.
portable-atomic = { workspace = true }

[dev-dependencies]
test-log = { workspace = true }
# Исполнитель для async-тестов над фейками портов (`#[tokio::test]`); фичи —
# в корневом Cargo.toml.
tokio = { workspace = true }
# Обе строки — ради линковки хостового тестового бинарника, а не ради самих
# тестов: он тянет `supervisor`, тот `embassy-executor` и `embassy-time`, а у
# обоих реализация выбирается фичей. Без `platform-std` линкер не находит
# `__pender`, без драйвера времени — символы очереди таймеров. `mock-driver`,
# а не `std`: время в тестах должно двигаться по команде, а не по системным
# часам. В прошивку это не уезжает — dev-зависимости path-зависимости cargo
# не собирает, там платформу и драйвер выбирает `crates-cross`.
embassy-executor = { workspace = true, features = [
	"platform-std",
	"executor-thread",
] }
embassy-time = { workspace = true, features = ["mock-driver"] }
# Реализация критической секции для хоста: её просит `MockDriver`. На плате её
# даёт `cortex-m` фичей `critical-section-single-core` (crates-cross/Cargo.toml).
critical-section = { workspace = true, features = ["std"] }
