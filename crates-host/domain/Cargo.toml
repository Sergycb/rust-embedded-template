[package]
name = "domain"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Хост-дефолт: без одной из фич `log`/`defmt` не собирается `defmt-or-log`, и
# первое же `cargo build`/`cargo test` в свежесгенерированном проекте (и
# rust-analyzer в IDE) падало с compile_error из чужого крейта. В прошивку
# `log` при этом не попадает: crates-cross/Cargo.toml подключает domain с
# `default-features = false, features = ["defmt"]`.
default = ["log"]
defmt = [
	"dep:defmt",
	"defmt-or-log/defmt",
	"ports/defmt",
	# {%- if ota == "true" %}
	"embassy-boot/defmt",
	# {%- endif %}
	# {%- if has_canopen == "true" %}
	"zencan-node/defmt",
	# {%- endif %}
	# {%- if has_net == "true" %}
	"embassy-net/defmt",
	# {%- endif %}
	# {%- if net_services contains "rest" %}
	"picoserve/defmt",
	# {%- endif %}
	# {%- if net_services contains "mqtt" %}
	"minimq/defmt",
	# {%- endif %}
	# {%- if has_usb == "true" %}
	"embassy-usb/defmt",
	# {%- endif %}
]
# Проверка подписи нового образа в bootloader'е (`ota::boot::screen_update`).
# Включает `boot` в проекте, где при генерации выбрана подпись; в корневом
# workspace её включают `cargo xtask lint`/`test host`, чтобы всё это
# проверялось и на хосте. Проверяет `salty` напрямую, а не
# `verify_and_mark_updated` из embassy-boot: тот живёт в апдейтере приложения,
# а проверка — в bootloader'е.
# {%- if ota == "true" %}
signed = ["dep:salty"]
# {%- endif %}
log = [
	"dep:log",
	"defmt-or-log/log",
	# {%- if has_canopen == "true" %}
	"zencan-node/log",
	# {%- endif %}
]

# `log` и `defmt` — необязательные зависимости, которые нужны только фичам
# (`dep:log`, `dep:defmt`): код зовёт их через `defmt_or_log`, и `cargo machete`
# по тексту исходников видит их неиспользуемыми.
[package.metadata.cargo-machete]
ignored = ["log", "defmt"]

[dependencies]
# Порты — границы самого домена: логика вызывает их, а реализации приходят из
# `adapters` (хост) и `crates-cross/bsp` (железо). Зависимость нужна, чтобы
# правило «порт заводится под то, чем пользуется логика» было выполнимым: без
# неё `domain` не может даже назвать `ports::FirmwareUpdate`.
ports = { workspace = true }
defmt-or-log = { workspace = true }
log = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
# Задачи, которые спавнит граф из `crates-cross/app`, живут здесь (`heartbeat.rs`,
# `ota.rs`) — вместе со своими фрагментами и политикой. `supervisor` нужен им
# ради типов, которыми граф разговаривает с задачей: `Heartbeat` (отметка у
# сторожа), `TaskExit` (чем кончился прогон). Знания о самом графе это не даёт — контекст задачи эмитит
# фрагмент здесь же (`ctx: $crate::heartbeat::HeartbeatCtx`), типы его полей приходят через
# `::supervisor::__private`, и тип compose-site здесь не называется, — но
# `embassy-executor` приезжает транзитивно, так что старое правило «в domain
# нет embassy» больше не действует (docs/architecture.md).
supervisor = { workspace = true }
# Прямо, а не транзитивно через `supervisor`: `Ticker`/`Timer`/`Duration` стоят
# в теле задачи, а не только в её сигнатуре.
embassy-time = { workspace = true }
# Задачи узлов — автоматы `#[fsm::typestate]` на контексте фрагмента.
fsm = { workspace = true }
# {%- if ota == "true" %}
# Решение bootloader'а (`ota::boot`): состояние `embassy-boot` над блокирующими
# разделами `NorFlash`. Сам крейт от чипа не зависит.
embassy-boot = { workspace = true }
embedded-storage = { workspace = true }
salty = { workspace = true, optional = true }
# {%- endif %}
# Прямо, а не транзитивно: тип счётчика в `cpu_load::SleepTicks` —
# `portable_atomic::AtomicU32`, потому что на Cortex-M0/M0+ у `core`
# атомика нет `fetch_add`.
portable-atomic = { workspace = true }
# {%- if has_modbus == "true" %}
# Modbus (`domain::modbus`): разбор PDU — кодек; транспорты — в `adapters`.
# Обоснование выбора — `//!` модуля `domain::modbus`.
rusty-modbus-codec = { workspace = true }
rusty-modbus-types = { workspace = true }
# Мьютекс карты регистров, общей у нескольких узлов Modbus
# (`modbus::SharedRegisters`).
embassy-sync = { workspace = true }
# {%- endif %}
# {%- if has_protobuf == "true" %}
# Узел HOST (`domain::host`): разбор и кодирование сообщений protobuf. Схему
# узел не знает — её знает обработчик приложения.
micropb            = { workspace = true }
# Схема `crates-host/proto` — для обработчика `domain::host::Service`.
proto              = { workspace = true }
# {%- endif %}
# {%- if has_canopen == "true" %}
# Узел CANOPEN (`domain::canopen`): стек CANopen и кадр шины.
zencan-node        = { workspace = true }
embedded-can       = { workspace = true }
# Словарь объектов устройства — для `domain::canopen::dictionary`.
canopen            = { workspace = true }
# {%- endif %}
# {%- if has_net == "true" %}
# Узел NET (`domain::net`): ведёт стек `embassy-net` над устройством платы.
embassy-net        = { workspace = true }
# {%- endif %}
# {%- if net_services contains "rest" %}
# Узлы HTTP (`domain::http`): REST API на `picoserve` поверх сокетов стека.
picoserve          = { workspace = true }
# {%- endif %}
# {%- if net_services != "" %}
# Тексты ответов REST и строки консоли SSH — в `heapless::String`.
heapless           = { workspace = true }
# {%- endif %}
# {%- if net_services contains "ssh" %}
# Узел SSH (`domain::ssh`): протокол `sunset` над сокетом — `sunset-async`
# (реэкспортирует `sunset`), канал сессии — `embedded-io-async`, `select`
# сессии — `embassy-futures`.
sunset-async       = { workspace = true }
embassy-futures    = { workspace = true }
embedded-io-async  = { workspace = true }
# {%- endif %}
# {%- if net_services contains "mqtt" %}
# Узел MQTT (`domain::mqtt`): клиент `minimq`.
minimq             = { workspace = true }
# {%- endif %}
# {%- if ssh_host_key == "config" %}
# Ключ хоста SSH, созданный на плате (`domain::ssh::Stored`).
getrandom          = { workspace = true }
# {%- endif %}
# {%- if has_usb == "true" %}
# Узел USB (`domain::usb`): ведёт устройство `embassy-usb` над драйвером платы.
embassy-usb        = { workspace = true }
# {%- endif %}

[dev-dependencies]
# Исполнитель для async-тестов над фейками портов (`#[tokio::test]`); фичи —
# в корневом Cargo.toml.
tokio = { workspace = true }
# {%- if ota == "true" or has_modbus == "true" %}
# Property-тесты `download::Transfer` (любое разбиение образа на куски) и
# Modbus slave (любой кадр не роняет разбор).
proptest = { workspace = true }
# {%- endif %}
# Обе строки — ради линковки хостового тестового бинарника, а не ради самих
# тестов: он тянет `supervisor`, тот `embassy-executor` и `embassy-time`, а у
# обоих реализация выбирается фичей. Без `platform-std` линкер не находит
# `__pender`, без драйвера времени — символы очереди таймеров. `mock-driver`,
# а не `std`: время в тестах должно двигаться по команде, а не по системным
# часам. В прошивку это не уезжает — dev-зависимости path-зависимости cargo
# не собирает, там платформу и драйвер выбирает `crates-cross`.
embassy-executor = { workspace = true, features = [
	"platform-std",
	"executor-thread",
] }
# `generic-queue-8` — очередь таймеров, которой годится любой waker: узлы с
# тактом (`domain::canopen`) тестируются под `#[tokio::test]`, а очередь,
# встроенная в исполнитель embassy, принимает только его waker и паникует.
embassy-time = { workspace = true, features = ["mock-driver", "generic-queue-8"] }
# Реализация критической секции для хоста: её просит `MockDriver`. На плате её
# даёт `cortex-m` фичей `critical-section-single-core` (crates-cross/Cargo.toml).
critical-section = { workspace = true, features = ["std"] }
# {%- if has_net == "true" or has_usb == "true" %}
# Узлы NET/USB тестируются над драйверами без шины из `adapters::fake`.
adapters = { workspace = true, features = ["fake"] }
# {%- endif %}
