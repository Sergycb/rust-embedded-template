[package]
name = "canopen"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Вывод `zencan-node` — как у `domain`: в прошивке `defmt`, на хосте `log`.
defmt = ["zencan-node/defmt"]
log   = ["zencan-node/log"]

[dependencies]
# Сгенерированный словарь объектов называет типы `zencan_node` полными путями.
zencan-node = { workspace = true }

[build-dependencies]
# Описание устройства (TOML) → словарь объектов, почтовый ящик кадров и
# состояние узла — `static` в `OUT_DIR`.
zencan-build = { workspace = true }
