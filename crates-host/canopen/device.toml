# Описание устройства CANopen — пример, который проект заменяет своим.
#
# Из него `build.rs` генерирует словарь объектов (OD) и всё, что нужно узлу:
# стандартные объекты связи CiA 301 (0x1000–0x1FFF: тип устройства,
# идентичность, heartbeat, PDO) добавляются сами, здесь — только
# идентичность, число PDO и объекты приложения (0x2000 и выше).
#
# Формат — `zencan_common::device_config` (документация `zencan-build`).

device_name = "Template node"
# Ревизия платы (0x1009) — её знает только проект.
hardware_version = "v1"
# Версия ПО (0x100A) подставляется при сборке из `version` прошивки
# (crates-cross/Cargo.toml) — `build.rs`; значение здесь — на случай сборки
# крейта отдельно от проекта.
software_version = "0.0.0"

[identity]
vendor_id = 0
product_code = 1
revision_number = 1

[pdos]
num_rpdo = 1
num_tpdo = 1

# Уставка, которую хост пишет по SDO или RPDO. `persist` — переживает
# перезагрузку: сохраняется командой `save` в 0x1010 (`domain::canopen`).
[[objects]]
index = 0x2000
parameter_name = "Setpoint"
object_type = "var"
data_type = "UInt16"
access_type = "rw"
default_value = 0
pdo_mapping = "rpdo"
persist = true

# {%- if ota == "true" %}
# Объект OTA — команды обновления записями SDO (`domain::canopen::OtaObject`,
# там же таблица подобъектов). `application_callback`: хранения в словаре у
# него нет, обработчик узел регистрирует при старте.
[[objects]]
index = 0x4F00
parameter_name = "Firmware update"
object_type = "record"
application_callback = true
[[objects.subs]]
sub_index = 1
parameter_name = "Start"
data_type = "domain"
access_type = "wo"
[[objects.subs]]
sub_index = 2
parameter_name = "Chunk"
data_type = "domain"
access_type = "wo"
[[objects.subs]]
sub_index = 3
parameter_name = "Finish"
data_type = "uint32"
access_type = "wo"
[[objects.subs]]
sub_index = 4
parameter_name = "Reboot"
data_type = "uint32"
access_type = "wo"
[[objects.subs]]
sub_index = 5
parameter_name = "Status"
data_type = "uint16"
access_type = "ro"
[[objects.subs]]
sub_index = 6
parameter_name = "Received"
data_type = "uint32"
access_type = "ro"
# {%- endif %}

# Измерение, которое устройство отдаёт по SDO или TPDO.
[[objects]]
index = 0x2001
parameter_name = "Measurement"
object_type = "var"
data_type = "Int32"
access_type = "ro"
default_value = 0
pdo_mapping = "tpdo"
