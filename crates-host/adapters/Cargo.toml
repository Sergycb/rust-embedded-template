[package]
name = "adapters"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Сами адаптеры ничего не пишут в лог, а у `embassy-boot` без фич `log`/`defmt`
# его макросы вывода превращаются в пустые выражения — на хосте это ровно то,
# что нужно. В прошивку `defmt` включает crates-cross/Cargo.toml.
defmt = [
	"dep:defmt",
	"ports/defmt",
	"embassy-boot/defmt",
	"sequential-storage/defmt",
	# {%- if interface == "tcp" or interface == "udp" %}
	"embassy-net/defmt",
	# {%- endif %}
	# {%- if interface == "usb" %}
	"embassy-usb/defmt",
	# {%- endif %}
]

[dependencies]
ports = { workspace = true }
# Обновление прошивки поверх разделов `NorFlash` — сам крейт от чипа не зависит.
embassy-boot = { workspace = true }
embedded-storage = { workspace = true }
embedded-storage-async = { workspace = true }
# Хранилище настроек (settings.rs) — async API, отсюда и мост в flash.rs.
sequential-storage = { workspace = true }
embassy-sync = { workspace = true }
# `BlockingPartition` — весь общий флеш как раздел под замком (`flash::whole`),
# `BlockingAsync` — async-вид для `embassy-boot` и `sequential-storage`: свои
# копии не нужны, их же собирают `bsp` и bootloader.
embassy-embedded-hal = { workspace = true }
# {%- if protocol == "modbus" or protocol == "protobuf" %}
# Транспорты поверх потока байтов `embedded_io_async::{Read, Write}` —
# `modbus::{Rtu, Tcp}` и `cobs::Cobs`; CRC кадра — у обоих.
embedded-io-async = { workspace = true }
crc = { workspace = true }
# {%- endif %}
# {%- if protocol == "protobuf" %}
# Кадрирование COBS под `cobs::Cobs`.
cobs = { workspace = true }
# {%- endif %}
# {%- if interface == "tcp" or interface == "udp" %}
# Сеть (`adapters::net`): заглушка устройства, TCP-сервер, UDP-канал.
embassy-net = { workspace = true }
# {%- endif %}
# {%- if interface == "usb" %}
# USB (`adapters::usb`): заглушка драйвера и поток CDC ACM.
embassy-usb = { workspace = true }
# {%- endif %}
# {%- if interface == "tcp" or interface == "udp" or interface == "usb" %}
# Таймауты: keep-alive сокета TCP (`net`), запись, которую хост не забирает (`usb`).
embassy-time = { workspace = true }
# {%- endif %}
# {%- if interface == "can" %}
# Кадр шины CAN — параметр заглушки `can::Unconnected`.
embedded-can = { workspace = true }
# {%- endif %}
# `defmt::Format` на ошибках адаптеров — в прошивке.
defmt = { workspace = true, optional = true }

[dev-dependencies]
# Сквозной тест `ota`: то, что пишет `Updater::signed`, находит проверка
# bootloader'а (`domain::ota::boot::screen_update`). Подписывает `salty`, как
# `cargo xtask build`. Циклическая dev-зависимость (у `domain` она на `adapters`)
# cargo разрешена: в обычную сборку ни та ни другая не попадает.
domain = { path = "../domain", features = ["signed"] }
salty = { workspace = true }
# Исполнитель для async-тестов над флешем в памяти (`#[tokio::test]`); фичи —
# в корневом Cargo.toml.
tokio = { workspace = true }
# {%- if protocol == "modbus" or protocol == "protobuf" %}
# Property-тесты кадрирования: любое дробление потока и любой мусор.
proptest = { workspace = true }
# {%- endif %}
# {%- if interface == "tcp" or interface == "udp" or interface == "usb" %}
# Сетевые и USB-тесты: стеки `embassy-net`/`embassy-usb` ждут таймеров и
# критической секции — на хосте их дают драйвер времени `mock-driver` и
# `critical-section/std`, как в `domain`.
embassy-time = { workspace = true, features = ["mock-driver", "generic-queue-8"] }
critical-section = { workspace = true, features = ["std"] }
# {%- endif %}
