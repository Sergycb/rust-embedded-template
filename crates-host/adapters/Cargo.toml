[package]
name = "adapters"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Сами адаптеры ничего не пишут в лог.
# {%- if ota == "true" %}
# У `embassy-boot` без фич `log`/`defmt` его макросы вывода превращаются в
# пустые выражения — на хосте это ровно то, что нужно.
# {%- endif %}
# В прошивку `defmt` включает crates-cross/Cargo.toml.
# Драйверы без шины и линка (`adapters::fake`) — для host-тестов `domain`.
fake = []
defmt = [
	"dep:defmt",
	"ports/defmt",
	# {%- if ota == "true" %}
	"embassy-boot/defmt",
	# {%- endif %}
	# {%- if config == "true" %}
	"sequential-storage/defmt",
	# {%- endif %}
	# {%- if has_net == "true" %}
	"embassy-net/defmt",
	# {%- endif %}
	# {%- if has_usb == "true" %}
	"embassy-usb/defmt",
	# {%- endif %}
]

[dependencies]
ports = { workspace = true }
# {%- if ota == "true" %}
# Обновление прошивки поверх разделов `NorFlash` — сам крейт от чипа не зависит.
embassy-boot = { workspace = true }
# Имя типа раздела, который режет `from_linkerfile` (`ota::Linked`): `embassy-boot`
# его не реэкспортирует.
embassy-embedded-hal = { workspace = true }
# `yield_now` между страницами стирания в `ota::Updater::prepare`.
embassy-futures = { workspace = true }
# {%- endif %}
# {%- if ota == "true" or config == "true" %}
embedded-storage = { workspace = true }
embedded-storage-async = { workspace = true }
# {%- endif %}
# {%- if config == "true" %}
# Хранилище настроек (settings.rs) — async API.
sequential-storage = { workspace = true }
# {%- endif %}
embassy-sync = { workspace = true }
# {%- if stream_io == "true" or net_services contains "mqtt" %}
# Поток байтов `embedded_io_async::{Read, Write}` — трейты транспортов платы.
# {%- if has_usb == "true" %}
# - `usb::CdcStream`
# {%- endif %}
# {%- if has_tcp == "true" %}
# - `net::TcpServer`
# {%- endif %}
# {%- if modbus_rtu == "true" %}
# - `modbus::Rtu`
# {%- endif %}
# {%- if modbus_tcp == "true" %}
# - `modbus::Tcp`
# {%- endif %}
# {%- if cobs_used == "true" %}
# - `cobs::Cobs`
# {%- endif %}
# {%- if net_services contains "mqtt" %}
# - `net::TcpClient` клиента MQTT
# {%- endif %}
# {%- if has_udp == "true" %}
# UDP-каналу поток не нужен: границу кадра даёт датаграмма.
# {%- endif %}
embedded-io-async = { workspace = true }
# {%- endif %}
# {%- if crc_used == "true" %}
# CRC кадра:
# {%- if modbus_rtu == "true" %}
# RTU (`modbus::Rtu`);
# {%- endif %}
# {%- if cobs_used == "true" %}
# COBS (`cobs::Cobs`).
# {%- endif %}
crc = { workspace = true }
# {%- endif %}
# {%- if cobs_used == "true" %}
# Кадрирование COBS под `cobs::Cobs`.
cobs = { workspace = true }
# {%- endif %}
# {%- if has_net == "true" %}
# Сеть (`adapters::net`): заглушка устройства, TCP-сервер, UDP-канал.
embassy-net = { workspace = true }
# {%- endif %}
# {%- if has_usb == "true" %}
# USB (`adapters::usb`): заглушка драйвера и поток CDC ACM.
embassy-usb = { workspace = true }
# {%- endif %}
# {%- if has_net == "true" or has_usb == "true" %}
# Таймауты: keep-alive сокета TCP (`net`), запись, которую хост не забирает (`usb`).
embassy-time = { workspace = true }
# {%- endif %}
# `defmt::Format` на ошибках адаптеров — в прошивке.
defmt = { workspace = true, optional = true }

[dev-dependencies]
# {%- if ota == "true" %}
# Сквозной тест `ota`: то, что пишет `Updater<_, true>`, находит проверка
# bootloader'а (`domain::ota::boot::screen_update`). Подписывает `salty`, как
# `cargo xtask build`. Циклическая dev-зависимость (у `domain` она на `adapters`)
# cargo разрешена: в обычную сборку ни та ни другая не попадает.
domain = { path = "../domain", features = ["signed"] }
salty = { workspace = true }
# `domain` тянет `supervisor`, а с ним `embassy-executor`, которому без
# платформенной фичи не хватает `__pender`. Фичу включает dev-зависимость
# самого `domain`, но cargo учитывает dev-зависимости только тестируемого
# пакета: без этой строки `cargo test -p adapters` не линкуется, хотя тест
# всего workspace проходит.
embassy-executor = { workspace = true, features = ["platform-std", "executor-thread"] }
# {%- endif %}
# Исполнитель для async-тестов над флешем в памяти (`#[tokio::test]`); фичи —
# в корневом Cargo.toml.
tokio = { workspace = true }
# {%- if framing_tests == "true" %}
# Property-тесты кадрирования: любое дробление потока и любой мусор.
proptest = { workspace = true }
# {%- endif %}
# {%- if has_net == "true" or has_usb == "true" or ota == "true" %}
# {%- if has_net == "true" or has_usb == "true" %}
# Тесты над стеками
# {%- if has_net == "true" %}
# `embassy-net`
# {%- endif %}
# {%- if has_usb == "true" %}
# `embassy-usb`
# {%- endif %}
# ждут таймеров и критической секции — на хосте их дают драйвер времени
# `mock-driver` и `critical-section/std`, как в `domain`.
# {%- endif %}
# {%- if ota == "true" %}
# С OTA драйвер времени нужен и `supervisor` из dev-зависимости `domain` — по
# той же причине, что выше.
# {%- endif %}
embassy-time = { workspace = true, features = ["mock-driver", "generic-queue-8"] }
critical-section = { workspace = true, features = ["std"] }
# {%- endif %}
