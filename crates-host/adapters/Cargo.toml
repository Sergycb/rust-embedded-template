[package]
name = "adapters"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Сами адаптеры ничего не пишут в лог, а у `embassy-boot` без фич `log`/`defmt`
# его макросы вывода превращаются в пустые выражения — на хосте это ровно то,
# что нужно. В прошивку `defmt` включает crates-cross/Cargo.toml.
defmt = [
	"ports/defmt",
	"embassy-boot/defmt",
	"sequential-storage/defmt",
]
# Подпись образа: проверка в bootloader'е (`ota::screen_update`) и запись для
# неё из приложения (`ota::Signed`). Включают `boot` и `app` в проекте, где при
# генерации выбрана подпись; в корневом workspace её включают
# `cargo xtask lint`/`test host`, чтобы всё это проверялось и на хосте.
# Проверяет `salty` напрямую, а не `verify_and_mark_updated` из embassy-boot:
# тот живёт в апдейтере приложения, а проверка — в bootloader'е.
signed = ["dep:salty"]

[dependencies]
ports = { workspace = true }
# Обновление прошивки поверх разделов `NorFlash` — сам крейт от чипа не зависит.
embassy-boot = { workspace = true }
embedded-storage = { workspace = true }
embedded-storage-async = { workspace = true }
# Хранилище настроек (settings.rs) — async API, отсюда и мост в flash.rs.
sequential-storage = { workspace = true }
embassy-sync = { workspace = true }
salty = { workspace = true, optional = true }

[dev-dependencies]
# Исполнитель для async-тестов над флешем в памяти (`#[tokio::test]`); фичи —
# в корневом Cargo.toml.
tokio = { workspace = true }
