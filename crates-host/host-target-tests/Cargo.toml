[package]
name = "host-target-tests"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[lints]
workspace = true
# {%- if has_protobuf == "true" %}

[dependencies]
# Клиент говорит с устройством тем же протоколом, что и прошивка: схема и
# типы сообщений — из `crates-host/proto`, кодек — `micropb` (`alloc` — запрос
# кодируется в `Vec`: на хосте куча есть).
proto   = { workspace = true }
micropb = { workspace = true, features = ["alloc"] }
# {%- if cobs_used == "true" %}
# Кадры COBS + CRC-16/IBM-SDLC — как `adapters_logic::cobs` в прошивке (TCP, UART,
# USB CDC). `alloc` — `encode_vec`/`decode_vec`: на хосте куча есть.
cobs = { workspace = true, features = ["alloc"] }
crc  = { workspace = true }
# {%- endif %}
# {%- if protobuf_serial == "true" %}
# Последовательный порт (UART через переходник, USB CDC) — `HOST_TARGET_PORT`.
# MPL-2.0 — исключение в `deny.toml`, как у `zencan`. Без `default-features`:
# дефолтная `libudev` нужна лишь для перечисления портов на Linux, а порт здесь
# называют явно — и системной библиотеки для сборки не требуется.
serialport = { version = "4.10.1", default-features = false }
# {%- endif %}
# {%- endif %}
