[package]
name = "chip-info"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"
publish = false

# Свой `[workspace]`, как у `crates-cross/` — и по той же причине, только наоборот.
# `stm32-metapac` выбирает чип Cargo-фичей (его build.rs паникует, если фич
# stm32* не ровно одна, — env-переменной это не обойти), а фича подставляется
# при генерации. То есть в `[dependencies]` ниже живёт Liquid, и до генерации
# этот манифест не резолвится ничем, включая `cargo metadata`. Будь крейт
# членом корневого workspace, в самом репозитории шаблона перестали бы
# работать `cargo xtask lint` и `cargo xtask test host` — они резолвят
# корневой workspace целиком.
[workspace]

[dependencies]
# Только метаданные: фича `pac` (регистровый код на мегабайты) в default,
# поэтому default-features = false обязателен. С ней сборка на хосте занимала
# бы минуты вместо ~15 секунд, а нужен здесь ровно `metadata::METADATA`.
#
# Версия — та же мажорная, что тянет embassy-stm32 из crates-cross/Cargo.toml.
# Разъедутся — справочник будет показывать данные другого поколения
# stm32-data, чем то, по которому собрана прошивка; сверять при обновлении
# embassy-stm32.
stm32-metapac = { version = "21", default-features = false, features = [
	"metadata",
	"{{chip_feature}}",
] }
anyhow = "1.0.104"

# Не член ни одного [workspace] — [workspace.lints] не наследуются, поэтому
# все правила корневого Cargo.toml продублированы явно; обоснование каждого —
# в комментариях там. Меняете их там — меняйте и здесь. Группы
# `arbitrary_source_item_ordering` и послабления для тестов берутся из
# корневого clippy.toml: clippy ищет его вверх от манифеста.
[lints.rust]
# Как в корне, `deny`: unsafe этому справочнику не нужен вовсе.
unsafe_code = "deny"
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn        = "warn"

[lints.clippy]
all                     = { level = "warn", priority = -1 }
unwrap_used             = "deny"
let_underscore_must_use = "deny"
dbg_macro               = "deny"
todo                    = "warn"
unimplemented           = "warn"
large_stack_arrays      = "warn"
undocumented_unsafe_blocks = "warn"
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
mod_module_files        = "warn"
map_err_ignore          = "warn"
arbitrary_source_item_ordering = "warn"
