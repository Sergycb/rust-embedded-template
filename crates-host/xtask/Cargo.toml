[package]
name = "xtask"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.103"
xshell = "0.2.7"
# Подпись OTA-образов (`cargo xtask ota-key`/`ota-sign`). Тот же крейт, что
# проверяет подпись в прошивке (см. crates-cross/bsp/src/ota.rs) — значит алгоритм и
# формат совпадают по построению, а не по договорённости.
#
# Объявлены безусловно, хотя нужны только проектам с подписью: манифест
# `xtask` — член корневого workspace, а Liquid в нём сломал бы `cargo
# metadata` в самом репозитории шаблона (ровно та причина, по которой
# `chip-info` живёт отдельным крейтом). На прошивку это не влияет: оба крейта
# хостовые. Сами команды при отключённой подписи отказываются работать и
# объясняют почему.
#
# `default-features = false`: дефолтная `rustcrypto` тянет крейт `ed25519`
# ради трейтов signature-совместимости, а здесь нужны только `Keypair`,
# `Sha512` и `to_bytes`.
salty = { version = "0.3.0", default-features = false }
getrandom = "0.4.3"
