[package]
name = "xtask"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
xshell = "0.2.7"
# {%- if ota == "true" %}
# Подпись OTA-образов внутри `cargo xtask build`. Тот же крейт, что
# проверяет подпись в прошивке (`domain::ota::boot::screen_update`) — значит
# алгоритм и формат совпадают по построению, а не по договорённости.
#
# `default-features = false`: дефолтная `rustcrypto` тянет крейт `ed25519`
# ради трейтов signature-совместимости, а здесь нужны только `Keypair`,
# `Sha512` и `to_bytes`.
salty = { version = "0.3.0", default-features = false }
# {%- endif %}
# {%- if ota == "true" %}
# Отпечаток раскладки в хвосте образа (`layout_fingerprint`): формат берётся
# у прошивки, а не повторяется здесь руками.
ports = { workspace = true }
# {%- endif %}
# {%- if ota == "true" or net_services contains "rest" or ssh_auth == "password" or ssh_host_key == "file" %}
# {%- if ota == "true" %}
# Случайный ключ подписи OTA и чужой ключ для `test host-target` (`signing.rs`).
# {%- endif %}
# {%- if net_services contains "rest" or ssh_auth == "password" or ssh_host_key == "file" %}
# Случайные секреты сетевых служб (`secrets.rs`).
# {%- endif %}
getrandom = "0.4.3"
# {%- endif %}
# Сырой образ из ELF — своим разбором, а не `cargo objcopy`: тот требует
# cargo-binutils, которого `cargo xtask setup` не ставит, и у пользователя
# такая команда не запустилась бы.
# Читаются только заголовки программы и их данные, поэтому default-фичи
# (запись, прочие форматы) выключены.
object = { version = "0.40.0", default-features = false, features = [
	"read_core",
	"elf",
	"std",
] }

[dev-dependencies]
# Точный вид строк отчёта `build` (`size_delta`) — снапшотами.
insta = { workspace = true }
