// Протокол обмена с хостом — пример, который проект заменяет своим.
//
// Конверт: каждый запрос несёт `request_id`, ответ возвращает его как есть.
// По нему хост сопоставляет ответ с запросом — даже если ответы придут не по
// порядку или один потеряется (UDP), и даже когда устройство начнёт слать
// сообщения само.
//
// Команды: прочитать значение — поле типа `Get` с именем значения
// (`Get info`); записать — поле с типом самого значения и приставкой `set_`.
// Значение, которое и читают, и пишут, занимает две команды:
//
//   Get channel = N;
//   Channel set_channel = M;
//
// Ответ на обе — то же значение (`Channel channel` в `Response`): после
// записи хост видит, что устройство приняло.
//
// Ёмкости строк и повторяющихся полей (контейнеры `heapless`) заданы в
// `build.rs`: в `.proto` их не выразить.
syntax = "proto3";

package host;

message Request {
  uint32 request_id = 1;
  oneof command {
    Ping ping = 2;
    Get info = 3;
  }
}

message Response {
  uint32 request_id = 1;
  oneof result {
    Pong pong = 2;
    Info info = 3;
    Error error = 4;
  }
}

// Прочитать значение: какое — говорит имя поля в `Request`.
message Get {}

// Проверка связи.
message Ping {}
message Pong {}

// Что за устройство.
message Info {
  // Версия прошивки (`version` из Cargo.toml).
  string version = 1;
  // Короткий хеш коммита, из которого собрана прошивка.
  string commit = 2;
  // Имя чипа (`stm32f407ve`).
  string chip = 3;
  // Заводской 96-битный номер экземпляра чипа.
  bytes uid = 4;
  // Объём flash чипа, байт.
  uint32 flash_size = 5;
  // Частота ядра, Гц; 0 — неизвестна.
  uint32 sys_hz = 6;
  // Время с запуска прошивки, с.
  uint32 uptime_s = 7;
}

// Запрос не выполнен: не разобрался, неизвестная команда, недопустимые
// значения. Текст — для человека.
message Error {
  string text = 1;
}
