// Протокол обмена с хостом — пример, который проект заменяет своим.
//
// Конверт: каждый запрос несёт `request_id`, ответ возвращает его как есть.
// По нему хост сопоставляет ответ с запросом — даже если ответы придут не по
// порядку или один потеряется, и даже когда устройство начнёт слать
// сообщения само.
//
// Ответ на любую команду — `Ok` или `Error` с текстом; исключение — `Get`:
// на него приходит само значение или `Error`. Прочитать значение — поле типа
// `Get` с именем значения (`Get info`); записать — поле с типом самого
// значения и приставкой `set_`. Значение, которое и читают, и пишут, занимает
// две команды:
//
//   Get config = N;          // ответ — `Config config` в `Response`
//   Config set_config = M;   // ответ — `Ok`
//
// {%- if ota == "true" %}
// Обновление прошивки — четыре команды по порядку: `ota_start` (длина и
// подпись), `ota_chunk` сколько нужно (кусок до 128 байт со смещением),
// `ota_finish`, затем `reboot`. Ответ на каждую — `Ok` или `Error`: исход
// именно этой команды, опрашивать статус не нужно. `Error` обрывает приём —
// начинать снова с `ota_start`. Хост молчит посреди образа дольше 30 с —
// приём брошен, следующий кусок получит `Error`.
//
// {%- endif %}
// Ёмкости строк и повторяющихся полей (контейнеры `heapless`) заданы в
// `build.rs`: в `.proto` их не выразить.
syntax = "proto3";

package host;

message Request {
  uint32 request_id = 1;
  oneof command {
    Get info = 2;
    // {%- if ota == "true" %}
    OtaStart ota_start = 3;
    OtaChunk ota_chunk = 4;
    OtaFinish ota_finish = 5;
    Reboot reboot = 6;
    // {%- endif %}
  }
}

message Response {
  uint32 request_id = 1;
  oneof result {
    Ok ok = 2;
    Info info = 3;
    Error error = 4;
  }
}

// Прочитать значение: какое — говорит имя поля в `Request`.
message Get {}

// Команда выполнена.
message Ok {}

// Что за устройство.
message Info {
  // Версия прошивки (`version` из Cargo.toml).
  string version = 1;
  // Короткий хеш коммита, из которого собрана прошивка.
  string commit = 2;
  // Имя чипа (`stm32f407ve`).
  string chip = 3;
  // Заводской 96-битный номер экземпляра чипа.
  bytes uid = 4;
  // Объём flash чипа, байт.
  uint32 flash_size = 5;
  // Частота ядра, Гц; 0 — неизвестна.
  uint32 sys_hz = 6;
  // Время с запуска прошивки, с.
  uint32 uptime_s = 7;
  // Причина последнего сброса (`power_on`, `pin`, `software`,
  // `independent_watchdog`…).
  string reset = 8;
  // Прошлая паника: файл, строка, столбец и первая строка сообщения; пусто —
  // паники не было (или прошивка отладочная).
  string last_panic = 9;
}

// Запрос не выполнен: не разобрался, неизвестная команда, недопустимые
// значения, отказ устройства. Текст — для человека.
message Error {
  string text = 1;
}
// {%- if ota == "true" %}

// Начать приём образа. Новый `ota_start` бросает незаконченный приём.
message OtaStart {
  // Длина образа, байт.
  uint32 len = 1;
  // Подпись образа (Ed25519, 64 байта) или пусто. Прошивка с подписью
  // отвергает образ без неё до стирания раздела (`Error`).
  bytes signature = 2;
}

// Кусок образа до 128 байт по своему смещению. Повтор уже принятого куска
// (ответ потерялся) подтверждается без записи; разрыв или наложение —
// `Error`.
message OtaChunk {
  bytes data = 1;
  // Смещение куска в образе, байт.
  uint32 offset = 2;
}

// Образ передан целиком: сверить длину и применить.
message OtaFinish {}

// Перезагрузить устройство: после `Ok` на `ota_finish` — чтобы bootloader
// обменял разделы. Ответ `Ok` уходит до сброса.
message Reboot {}
// {%- endif %}
