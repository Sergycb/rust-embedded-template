{%- if ota == "true" %}
name: Release

# Тег вида v1.2.3 — и то, что уезжает на устройства, начинает браться из
# версионированного места, а не из папки на машине того, кто собирал.
#
# Отдельный workflow, а не джоб в ci.yml: у него другой триггер (теги вместо
# веток) и другие права (`contents: write` для создания релиза). Смешав их, мы
# раздали бы право на запись каждому прогону обычного CI.
on:
  push:
    tags: ["v*"]

# Права — по джобам: сборка, где выполняется код зависимостей, читает
# репозиторий и только; право записи (создать релиз) получает публикация, в
# которой ничего не собирается.
permissions: {}

# Релизы не отменяем: оборванный прогон оставил бы тег без образа.
concurrency:
  group: {% raw %}${{ github.workflow }}-${{ github.ref }}{% endraw %}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FLIP_LINK_VERSION: "0.1.12"

jobs:
  build:
    name: Собрать и подписать
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Секрет подписи — в окружении `release`, а не в секретах репозитория:
    # там у окружения задаются обязательные ревьюеры и правило «только теги
    # `v*`» (Settings → Environments → release). Без них подписанный релиз
    # выпускает любой, кто может запушить тег, — на любой коммит.
    environment: release
    permissions:
      contents: read
    steps:
      # Токен в `.git/config` сборке не нужен: зависимости его не увидят.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (7.0.1)
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 (2.9.3)
        with:
          workspaces: crates-cross
      - run: rustup target add {{target}}
      # Версия — та же, что в `cargo xtask setup`: от линкера зависит раскладка
      # образа, и без пина релиз не повторить (docs/conventions.md,
      # «Воспроизводимый релиз»).
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2 (2.88.0)
        with:
          tool: flip-link@{% raw %}${{ env.FLIP_LINK_VERSION }}{% endraw %}
      # Релиз собирается ровно из закоммиченного Cargo.lock: без --locked cargo
      # молча разрешил бы зависимости заново.
      - run: cargo fetch --locked --manifest-path crates-cross/Cargo.toml

      # Прошивка печатает свою версию при старте (shadow-rs берёт её из
      # [workspace.package]), а релиз называется тегом. Разойдись они — и по
      # логу с устройства уже не понять, какой релиз на нём стоит. Дешевле
      # поймать это здесь, чем на устройстве в поле.
      - name: Тег и версия проекта должны совпадать
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' crates-cross/Cargo.toml | head -1)
          if [ "$tag" != "$version" ]; then
            echo "::error::тег $GITHUB_REF_NAME не совпадает с version = \"$version\" в crates-cross/Cargo.toml"
            exit 1
          fi
          echo "версия $version"

      # Оба ключа — до сборки, и без них релиза нет. Открытый ключ bootloader
      # берёт из репозитория: не закоммичен — `cargo xtask build` создал бы
      # одноразовую пару, и bootloader доверял бы ключу, которого больше нет ни
      # у кого. Закрытый — секрет: без него образ вышел бы неподписанным, а
      # такой не примет ни одно устройство.
      - name: Ключи подписи должны быть
        env:
          SIGNING_KEY: {% raw %}${{ secrets.OTA_SIGNING_KEY }}{% endraw %}
        run: |
          if [ ! -f ota-public-key.bin ]; then
            echo "::error::ota-public-key.bin не закоммичен — bootloader релиза доверял бы одноразовому ключу"
            exit 1
          fi
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::секрет OTA_SIGNING_KEY не задан в окружении release — образ вышел бы неподписанным"
            exit 1
          fi

      # Та же команда, что и локально: она собирает оба профиля, меряет образ
      # против раздела и кладёт рядом app.bin. Отдельного «релизного» пути
      # сборки нет намеренно — иначе на устройства уезжало бы не то, что
      # проверялось. Закрытого ключа здесь ещё нет: `build.rs` и proc-macro
      # зависимостей его не прочтут.
      - run: cargo xtask build

      # Ключ — только теперь и только на этот шаг: `cargo xtask sign` ничего
      # не пересобирает. Секрет — 32 байта seed в base64:
      # `base64 -w0 < ota-signing-key.bin`. Сверку ключа с открытым и с
      # зашитым в bootloader делает сам xtask (ensure_signing_key,
      # ensure_image_key).
      - name: Подписать образ
        env:
          SIGNING_KEY: {% raw %}${{ secrets.OTA_SIGNING_KEY }}{% endraw %}
        run: |
          printf '%s' "$SIGNING_KEY" | base64 -d > ota-signing-key.bin
          size=$(wc -c < ota-signing-key.bin)
          if [ "$size" -ne 32 ]; then
            rm -f ota-signing-key.bin
            echo "::error::OTA_SIGNING_KEY после base64 -d даёт $size байт вместо 32"
            exit 1
          fi
          cargo xtask sign
          rm -f ota-signing-key.bin

      - name: Файлы релиза
        run: |
          dir="crates-cross/target/{{target}}/release"
          mkdir release
          # ELF рядом с образом: по нему `probe-rs` и `defmt` расшифровывают лог
          # и стек платы с этим релизом — без него строки defmt не прочитать.
          cp "$dir/app.bin" "$dir/app.bin.sig" release/
          cp "$dir/app" release/app.elf
          # Суммы — тем, кто качает образ мимо gh: сверка `sha256sum -c SHA256SUMS`.
          (cd release && sha256sum app.bin app.bin.sig app.elf > SHA256SUMS)
          # Чем собрано — чтобы повторить сборку и сверить SHA256SUMS. Побайтно
          # повторяется app.bin; ELF несёт в отладочной информации пути машины.
          {
            echo "commit: $GITHUB_SHA"
            # Образ повторяется только по тому же пути проекта —
            # docs/conventions.md, «Воспроизводимый релиз».
            echo "path: $PWD"
            rustc -vV
            cargo -V
            echo "flip-link $FLIP_LINK_VERSION"
          } > release/BUILD-ENV
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (7.0.2)
        with:
          name: release
          path: release/
          if-no-files-found: error

  # Публикация — отдельным джобом: право записи в репозиторий у него есть, а
  # сборки, то есть чужого кода, — нет.
  publish:
    name: Выложить
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8 (8.0.2)
        with:
          name: release
          path: release
      - name: Выложить образ в релиз
        env:
          GH_TOKEN: {% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes release/*
{%- endif %}
