{%- if ota == "true" %}
name: Release

# Тег вида v1.2.3 — и то, что уезжает на устройства, начинает браться из
# версионированного места, а не из папки на машине того, кто собирал.
#
# Отдельный workflow, а не джоб в ci.yml: у него другой триггер (теги вместо
# веток) и другие права (`contents: write` для создания релиза). Смешав их, мы
# раздали бы право на запись каждому прогону обычного CI.
on:
  push:
    tags: ["v*"]

# По умолчанию токен рабочего процесса доступен только на чтение — без этой
# строки `gh release create` падает с 403.
permissions:
  contents: write

# Релизы не отменяем: оборванный прогон оставил бы тег без образа.
concurrency:
  group: {% raw %}${{ github.workflow }}-${{ github.ref }}{% endraw %}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FLIP_LINK_VERSION: "0.1.12"

jobs:
  release:
    name: Собрать, подписать, выложить
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (7.0.1)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 (2.9.3)
        with:
          workspaces: crates-cross
      - run: rustup target add {{target}}
      # Версия — та же, что в `cargo xtask setup`: от линкера зависит раскладка
      # образа, и без пина релиз не повторить (docs/conventions.md,
      # «Воспроизводимый релиз»).
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2 (2.88.0)
        with:
          tool: flip-link@{% raw %}${{ env.FLIP_LINK_VERSION }}{% endraw %}
      # Релиз собирается ровно из закоммиченного Cargo.lock: без --locked cargo
      # молча разрешил бы зависимости заново.
      - run: cargo fetch --locked --manifest-path crates-cross/Cargo.toml

      # Прошивка печатает свою версию при старте (shadow-rs берёт её из
      # [workspace.package]), а релиз называется тегом. Разойдись они — и по
      # логу с устройства уже не понять, какой релиз на нём стоит. Дешевле
      # поймать это здесь, чем на устройстве в поле.
      - name: Тег и версия проекта должны совпадать
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' crates-cross/Cargo.toml | head -1)
          if [ "$tag" != "$version" ]; then
            echo "::error::тег $GITHUB_REF_NAME не совпадает с version = \"$version\" в crates-cross/Cargo.toml"
            exit 1
          fi
          echo "версия $version"
{%- if signed == "true" %}

      # Закрытый ключ в репозитории не лежит (он в .gitignore), поэтому в CI
      # он приходит секретом. Без него сборка НЕ падает: образ соберётся, но
      # без подписи — и такой релиз ни одно уже прошитое устройство не примет,
      # так что предупреждение здесь заметное.
      #
      # Секрет — 32 байта seed в base64: `base64 -w0 < ota-signing-key.bin`.
      - name: Ключ подписи из секрета
        env:
          SIGNING_KEY: {% raw %}${{ secrets.OTA_SIGNING_KEY }}{% endraw %}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::секрет OTA_SIGNING_KEY не задан — образ будет собран, но НЕ подписан"
            exit 0
          fi
          printf '%s' "$SIGNING_KEY" | base64 -d > ota-signing-key.bin
          size=$(wc -c < ota-signing-key.bin)
          if [ "$size" -ne 32 ]; then
            echo "::error::OTA_SIGNING_KEY после base64 -d даёт $size байт вместо 32"
            exit 1
          fi
{%- endif %}

      # Та же команда, что и локально: она собирает оба профиля, меряет образ
      # против раздела, кладёт рядом app.bin и подписывает его, если ключ на
      # месте. Отдельного «релизного» пути сборки нет намеренно — иначе на
      # устройства уезжало бы не то, что проверялось.
      - run: cargo xtask build
{%- if signed == "true" %}

      # Сверку открытого ключа с закрытым и с зашитым в прошивку xtask делает
      # сам (ensure_signing_key, ensure_image_key) и падает при расхождении.
      # Здесь остаётся то, чего он не видит: если ключ в секрете был, подпись
      # обязана появиться — иначе выложился бы неподписанный релиз.
      - name: Подпись должна появиться, если ключ был задан
        run: |
          if [ -f ota-signing-key.bin ] && [ ! -f crates-cross/target/{{target}}/release/app.bin.sig ]; then
            echo "::error::ключ подписи был, а app.bin.sig после cargo xtask build нет — релиз вышел бы неподписанным"
            exit 1
          fi
{%- endif %}

      - name: Выложить образ в релиз
        env:
          GH_TOKEN: {% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}
        run: |
          dir="crates-cross/target/{{target}}/release"
          # ELF рядом с образом: по нему `probe-rs` и `defmt` расшифровывают лог
          # и стек платы с этим релизом — без него строки defmt не прочитать.
          cp "$dir/app" "$dir/app.elf"
          names="app.bin app.elf"
          if [ -f "$dir/app.bin.sig" ]; then
            names="$names app.bin.sig"
          else
            echo "::warning::подписи рядом с образом нет — релиз выйдет неподписанным"
          fi
          # Суммы — тем, кто качает образ мимо gh: сверка `sha256sum -c SHA256SUMS`.
          # shellcheck disable=SC2086
          (cd "$dir" && sha256sum $names > SHA256SUMS)
          # Чем собрано — чтобы повторить сборку и сверить SHA256SUMS. Побайтно
          # повторяется app.bin; ELF несёт в отладочной информации пути машины.
          {
            echo "commit: $GITHUB_SHA"
            # Образ повторяется только по тому же пути проекта —
            # docs/conventions.md, «Воспроизводимый релиз».
            echo "path: $PWD"
            rustc -vV
            cargo -V
            echo "flip-link $FLIP_LINK_VERSION"
          } > "$dir/BUILD-ENV"
          files=""
          for name in $names SHA256SUMS BUILD-ENV; do files="$files $dir/$name"; done
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" --generate-notes $files
{%- endif %}
