name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Host (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # На образе ubuntu-latest предустановлены cargo/rustc/rustdoc/rustfmt,
      # но НЕ clippy — без этой строки `cargo xtask lint` падает на
      # `cargo clippy` с "no such command" (код 101). В GitLab CI то же самое
      # делает before_script.
      - run: rustup component add rustfmt clippy
      - uses: taiki-e/install-action@cargo-nextest
      # Ловит рассинхрон Cargo.toml и закоммиченного Cargo.lock: без --locked
      # cargo молча обновил бы lock под себя, и CI остался бы зелёным на
      # версиях, которых нет в репозитории.
      - run: cargo fetch --locked
      - run: cargo xtask lint
      - run: cargo xtask test host

      # Покрытие — отдельным шагом и без порога: цифра здесь нужна, чтобы
      # видеть, куда тесты не заглядывают, а не чтобы ронять сборку. Порог
      # («не ниже 80%») в проекте, где половина кода — это `bsp` под железо,
      # которого на раннере нет, означал бы только одно: писать тесты ради
      # процента. Отчёт печатается в лог и складывается в сводку прогона.
      # llvm-tools — не «на всякий случай»: cargo-llvm-cov зовёт llvm-profdata
      # и llvm-cov из тулчейна, а в minimal-профиле их нет.
      - run: rustup component add llvm-tools
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Покрытие domain
        run: |
          set -o pipefail
          {
            echo '```'
            cargo llvm-cov nextest --workspace --exclude host-target-tests \
              --features domain/log,domain/std --release \
              --ignore-filename-regex 'xtask' --summary-only
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Джоб kani здесь был и намеренно убран: kani компилирует крейт вместе со
  # всеми зависимостями СВОИМ тулчейном (0.67.0 — rustc 1.93.0-nightly), а
  # крейты из rust-lib объявляют rust-version = 1.96, и cargo отказывается
  # резолвить ещё до верификации. Пока kani не догонит 1.96, джоб падал бы на
  # каждом пуше, тратя несколько минут на установку собственного тулчейна.
  # Харнессы (crates-host/domain/src/kani_proofs.rs) остались — они под cfg(kani) и на
  # обычные сборки не влияют; запускать вручную: cd crates-host/domain && cargo kani
  # --features log.

  cross:
    name: Cross (fmt, clippy, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates-cross
      # Раньше target ставился автоматически из crates-cross/rust-toolchain.toml;
      # тулчейн-файлов в шаблоне больше нет, поэтому явно — как в GitLab CI.
      # clippy тоже: на образе его нет (см. джоб host выше).
      - run: rustup component add rustfmt clippy
      - run: rustup target add {{target}}
      # Через install-action, а не `cargo install`: тот собирает flip-link из
      # исходников на каждом прогоне (минуты), install-action берёт готовый
      # бинарник.
      - uses: taiki-e/install-action@v2
        with:
          tool: flip-link
      # `--locked` здесь условный, в отличие от джоба host выше. Шаблон не
      # раздаёт crates-cross/Cargo.lock: состав зависимостей зависит от ответов
      # при генерации (OTA, раздел настроек, подпись), и один файл подходил бы
      # ровно одному сочетанию. Пока проект не собран и lock не закоммичен,
      # строгий шаг падал бы не на рассинхроне, а на отсутствии файла — то есть
      # первый же прогон свежего проекта был бы красным без причины. Как только
      # lock в репозитории, проверка становится строгой сама.
      - name: Fetch (cross)
        run: |
          if [ -f crates-cross/Cargo.lock ]; then
            cargo fetch --locked --manifest-path crates-cross/Cargo.toml
          else
            echo "::warning::crates-cross/Cargo.lock не закоммичен — версии резолвятся заново на каждом прогоне"
            cargo fetch --manifest-path crates-cross/Cargo.toml
          fi
      - run: cargo xtask lint cross

      # Размер образа в сравнении с веткой по умолчанию. Порога здесь нет — как
      # и у покрытия: цифра нужна, чтобы увидеть рост тогда, когда автор ещё
      # помнит, зачем он его добавил. `IMAGE_BUDGET_PERCENT` в xtask решает
      # другую задачу и срабатывает позже — когда место уже кончилось.
      #
      # База лежит в кеше и пишется ТОЛЬКО на ветке по умолчанию: иначе размер
      # из чужого PR стал бы базой для всех остальных. Ключи кеша у Actions
      # неизменяемы, поэтому ключ с sha плюс `restore-keys` по префиксу —
      # обычный для них приём «скользящего» кеша. Кеш ветки по умолчанию из PR
      # читается, кеш PR из других веток — нет, так что схема работает как
      # задумано.
      - uses: actions/cache/restore@v4
        with:
          path: .image-size-baseline
          key: image-size-{% raw %}${{ github.sha }}{% endraw %}
          restore-keys: image-size-
      - name: База размера образа
        run: |
          if [ -f .image-size-baseline ]; then
            echo "IMAGE_SIZE_BASELINE=$(cat .image-size-baseline)" >> "$GITHUB_ENV"
          else
            echo "::notice::базы размера образа ещё нет — дельта появится после первого прогона на ветке по умолчанию"
          fi
      - run: cargo xtask build
        env:
          IMAGE_SIZE_OUT: .image-size
      - name: Запомнить размер как базу
        if: github.ref_name == github.event.repository.default_branch
        run: cp .image-size .image-size-baseline
      - uses: actions/cache/save@v4
        if: github.ref_name == github.event.repository.default_branch
        with:
          path: .image-size-baseline
          key: image-size-{% raw %}${{ github.sha }}{% endraw %}

  # Тесты на живой плате. Джоб выключен, пока в репозитории не заведена
  # переменная HIL=true (Settings -> Secrets and variables -> Actions ->
  # Variables): без неё шаг пропускается, а не висит в ожидании раннера,
  # которого ни у кого нет.
  #
  # Требования к раннеру (self-hosted, метка `stm32`): подключённая плата с
  # отладочным пробником, rust с целевым target'ом, probe-rs-tools, flip-link.
  # Ставится всё одной командой `cargo xtask setup` — см. README, «Тесты на
  # плате в CI».
  hil:
    name: Board (target + host-target)
    needs: cross
    # Выражение без обёртки: в ключе `if` она необязательна, а лишние скобки
    # пришлось бы экранировать от Liquid (см. MAINTAINING, раздел про
    # выражения Actions). Писать их даже в комментарии нельзя по той же
    # причине — этот файл проходит через рендер.
    if: vars.HIL == 'true'
    runs-on: [self-hosted, stm32]
    # Пробник у платы один, и параллельные прогоны за него дерутся — ровно по
    # этой причине `test host-target` внутри зовёт nextest с --test-threads 1.
    # `cancel-in-progress: false`: обрывать прогон посреди прошивки нельзя,
    # плата останется с половиной образа.
    concurrency:
      group: hil
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      # Раннер свой, тулчейн на нём уже стоит — ставим только то, чего может
      # не хватать после смены target'а в проекте.
      - run: rustup target add {{target}}
      - run: cargo xtask test target
      - run: cargo xtask test host-target
