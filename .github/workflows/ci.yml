name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Host (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-nextest
      - run: cargo xtask lint
      - run: cargo xtask test host
      - run: cargo xtask deny

  kani:
    name: Kani (formal verification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: model-checking/kani-github-action@v1
        with:
          working-directory: domain
          args: --features log

  cross:
    name: Cross (fmt, clippy, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cross
      - run: cargo install flip-link --locked
      - run: cargo xtask lint cross
      - run: cargo xtask build
