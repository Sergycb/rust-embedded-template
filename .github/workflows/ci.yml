name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Все джобы этого workflow только читают репозиторий, поэтому права
# объявлены явно и минимально: по умолчанию они зависят от настроек
# организации, и без этой строки прогон получил бы ровно столько, сколько
# надумает владелец.{% if ota == "true" %} Право на запись есть только у release.yml — там оно
# объявлено отдельно, потому что `gh release create` без него падает с 403.{% endif %}
permissions:
  contents: read

# Новый пуш в ту же ветку/PR отменяет прогон предыдущего: он всё равно устарел.
concurrency:
  group: {% raw %}${{ github.workflow }}-${{ github.ref }}{% endraw %}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Host (fmt, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Действия запинены по коммиту: тег переставляем, и тогда прогон без
      # единой правки в этом репозитории выполнит другой код. Комментарий
      # справа — версия, для которой SHA снят; dependabot обновляет и SHA,
      # и комментарий сам.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (7.0.1)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 (2.9.3)
      # На образе ubuntu-latest предустановлены cargo/rustc/rustdoc/rustfmt,
      # но НЕ clippy — без этой строки `cargo xtask lint` падает на
      # `cargo clippy` с "no such command" (код 101).
      - run: rustup component add rustfmt clippy
      - uses: taiki-e/install-action@8cf20993b5c06ee1e20640afaceeb72d4af5543f # плавающий тег cargo-nextest
      # Ловит рассинхрон Cargo.toml и закоммиченного Cargo.lock: без --locked
      # cargo молча обновил бы lock под себя, и CI остался бы зелёным на
      # версиях, которых нет в репозитории. Условный — по той же причине, что
      # у cross ниже: lock-файлов шаблон не раздаёт, проект считает их сам
      # первой сборкой, и до коммита lock строгий шаг падал бы на отсутствии
      # файла, а не на рассинхроне.
      - name: Fetch (host)
        run: |
          if [ -f Cargo.lock ]; then
            cargo fetch --locked
          else
            echo "::warning::Cargo.lock не закоммичен — версии резолвятся заново на каждом прогоне"
            cargo fetch
          fi
      - run: cargo xtask lint
      - run: cargo xtask test host

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2 (2.88.0)
        with:
          tool: cargo-hack,cargo-deny

      # cargo-hack: `check` для каждого сочетания фич каждого крейта. Фичи
      # аддитивны, и cargo в одной сборке объединяет их со всего графа, так что
      # «невозможное» сочетание рано или поздно встретится (например,
      # `domain` без `log` и без `defmt` не собирается вовсе). `log` и `defmt`
      # взаимоисключающие, но одна из них обязательна; dev-зависимости не нужны.
      - name: cargo-hack (feature powerset)
        run: >
          cargo hack check --workspace --exclude host-target-tests --exclude xtask
          --feature-powerset --no-dev-deps
          --mutually-exclusive-features log,defmt --at-least-one-of log,defmt

      # Лицензии (только пермиссивные), источники зависимостей, уязвимости.
      # Политика — `deny.toml`.
      - run: cargo deny check

      # Покрытие — отдельным шагом и без порога: цифра здесь нужна, чтобы
      # видеть, куда тесты не заглядывают, а не чтобы ронять сборку. Порог
      # («не ниже 80%») в проекте, где половина кода — это `bsp` под железо,
      # которого на раннере нет, означал бы только одно: писать тесты ради
      # процента. Отчёт печатается в лог и складывается в сводку прогона.
      # llvm-tools — не «на всякий случай»: cargo-llvm-cov зовёт llvm-profdata
      # и llvm-cov из тулчейна, а в minimal-профиле их нет.
      - run: rustup component add llvm-tools
      - uses: taiki-e/install-action@2409e52fd2fc8a8601d0d900fab9d85ae1fe714a # плавающий тег cargo-llvm-cov
      - name: Покрытие domain
        run: |
          set -o pipefail
          {
            echo '```'
            cargo llvm-cov nextest --workspace --exclude host-target-tests \
              --features domain/log{% if ota == "true" %},domain/signed{% endif %} --release \
              --ignore-filename-regex 'xtask' --summary-only
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Джоба kani нет намеренно — Kani убран из шаблона целиком, причины в
  # docs/conventions.md («Известные, осознанные ограничения»).

  # Опечатки в коде и документации. Отдельным джобом и без Rust: проверка по
  # тексту, сборки ей не нужно, а параллельный запуск ничего не удлиняет.
  # Исключения — `.typos.toml`.
  typos:
    name: Typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (7.0.1)
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2 (2.88.0)
        with:
          tool: typos
      - run: typos

  cross:
    name: Cross (fmt, clippy, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (7.0.1)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 (2.9.3)
        with:
          workspaces: crates-cross
      # Цель и компоненты есть в rust-toolchain.toml, но явно: rustup ставит
      # их оттуда только вместе с самим тулчейном, и там, где эта версия уже
      # стоит, их бы не было.
      - run: rustup component add rustfmt clippy
      - run: rustup target add {{target}}
      # Через install-action, а не `cargo install`: тот собирает flip-link из
      # исходников на каждом прогоне (минуты), install-action берёт готовый
      # бинарник.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2 (2.88.0)
        with:
          tool: flip-link@0.1.12
      # `--locked` условный, как у host выше. Шаблон не раздаёт lock-файлов:
      # состав зависимостей зависит от ответов при генерации, и один файл
      # подходил бы ровно одному сочетанию. Пока проект не собран и lock не закоммичен,
      # строгий шаг падал бы не на рассинхроне, а на отсутствии файла — то есть
      # первый же прогон свежего проекта был бы красным без причины. Как только
      # lock в репозитории, проверка становится строгой сама.
      - name: Fetch (cross)
        run: |
          if [ -f crates-cross/Cargo.lock ]; then
            cargo fetch --locked --manifest-path crates-cross/Cargo.toml
          else
            echo "::warning::crates-cross/Cargo.lock не закоммичен — версии резолвятся заново на каждом прогоне"
            cargo fetch --manifest-path crates-cross/Cargo.toml
          fi
      - run: cargo xtask lint cross
      # Свой `Cargo.lock` прошивки, та же политика `deny.toml`.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2 (2.88.0)
        with:
          tool: cargo-deny
      - run: cargo deny --manifest-path crates-cross/Cargo.toml check

      # Размер образа в сравнении с веткой по умолчанию. Порога здесь нет — как
      # и у покрытия: цифра нужна, чтобы увидеть рост тогда, когда автор ещё
      # помнит, зачем он его добавил. `IMAGE_BUDGET_PERCENT` в xtask решает
      # другую задачу и срабатывает позже — когда место уже кончилось.
      #
      # База лежит в кеше и пишется ТОЛЬКО на ветке по умолчанию: иначе размер
      # из чужого PR стал бы базой для всех остальных. Ключи кеша у Actions
      # неизменяемы, поэтому ключ с sha плюс `restore-keys` по префиксу —
      # обычный для них приём «скользящего» кеша. Кеш ветки по умолчанию из PR
      # читается, кеш PR из других веток — нет, так что схема работает как
      # задумано.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6 (6.1.0)
        with:
          path: .image-size-baseline
          key: image-size-{% raw %}${{ github.sha }}{% endraw %}
          restore-keys: image-size-
      - name: База размера образа
        run: |
          if [ -f .image-size-baseline ]; then
            echo "IMAGE_SIZE_BASELINE=$(cat .image-size-baseline)" >> "$GITHUB_ENV"
          else
            echo "::notice::базы размера образа ещё нет — дельта появится после первого прогона на ветке по умолчанию"
          fi
      - run: cargo xtask build
        env:
          IMAGE_SIZE_OUT: .image-size
      - name: Запомнить размер как базу
        if: github.ref_name == github.event.repository.default_branch
        run: cp .image-size .image-size-baseline
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6 (6.1.0)
        if: github.ref_name == github.event.repository.default_branch
        with:
          path: .image-size-baseline
          key: image-size-{% raw %}${{ github.sha }}{% endraw %}

  # Тесты на живой плате. Джоб выключен, пока в репозитории не заведена
  # переменная HIL=true (Settings -> Secrets and variables -> Actions ->
  # Variables): без неё шаг пропускается, а не висит в ожидании раннера,
  # которого ни у кого нет.
  #
  # Требования к раннеру (self-hosted, метка `stm32`): подключённая плата с
  # отладочным пробником, rust с целевым target'ом, probe-rs-tools, flip-link.
  # Ставится всё одной командой `cargo xtask setup` — см. README, «Тесты на
  # плате в CI».
  hil:
    name: Board (target + host-target)
    needs: cross
    # Выражение без обёртки: в ключе `if` она необязательна, а лишние скобки
    # пришлось бы экранировать от Liquid (см. MAINTAINING, раздел про
    # выражения Actions). Писать их даже в комментарии нельзя по той же
    # причине — этот файл проходит через рендер.
    #
    # PR из форка на свой раннер с платой не пускаем: чужой код исполнился бы
    # на машине с пробником. На push объекта pull_request нет, сравнение с
    # null даёт true, и джоб идёт как раньше.
    if: vars.HIL == 'true' && github.event.pull_request.head.repo.fork != true
    runs-on: [self-hosted, stm32]
    # Запас на прошивку и оба этапа тестов; зависший пробник иначе держал бы
    # единственный раннер (и группу hil) до шести часов, а то и дольше.
    timeout-minutes: 30
    # Пробник у платы один, и параллельные прогоны за него дерутся — ровно по
    # этой причине `test host-target` внутри зовёт nextest с --test-threads 1.
    # `cancel-in-progress: false`: обрывать прогон посреди прошивки нельзя,
    # плата останется с половиной образа.
    concurrency:
      group: hil
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (7.0.1)
      # Раннер свой, тулчейн на нём уже стоит — ставим только то, чего может
      # не хватать после смены target'а в проекте.
      - run: rustup target add {{target}}
      - run: cargo xtask test target
      - run: cargo xtask test host-target
