# CI самого репозитория шаблона — не сгенерированного из него проекта.
#
# В проекты этот файл не копируется: он перечислен в `[template].ignore`
# (cargo-generate.toml). У проектов есть свой `ci.yml` рядом, и он проверяет
# совсем другое — их собственную сборку.
#
# Ограничение, определяющее состав джобов: `domain` зависит от приватного
# Sergycb/rust-lib, доступа к которому у Actions нет. Поэтому здесь только то,
# что обходится без резолва зависимостей — каскад выбора чипа, инструменты
# мейнтейнера и сама генерация. Сборку сгенерированного проекта проверяет
# `template-check` без `--quick`, и это остаётся локальной командой
# (см. MAINTAINING.md).
name: Template

on:
  push:
    branches: [main, master]
  pull_request:

# Ни одному джобу этого workflow ничего записывать не нужно: все они только
# читают репозиторий. Права по умолчанию зависят от настроек организации, и
# без этой строки прогон получал бы ровно столько, сколько надумает владелец
# репозитория. Право на запись есть только у release.yml — там оно объявлено
# явно, потому что `gh release create` без него падает с 403.
permissions:
  contents: read

concurrency:
  group: {% raw %}${{ github.workflow }}-${{ github.ref }}{% endraw %}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  maintenance:
    name: Каскад, chip-data-gen, генерация
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Действия запинены по коммиту, а не по тегу: тег `v5` — указатель,
      # который в любой момент могут переставить на другой коммит, и тогда
      # прогон без единой правки в этом репозитории выполнит другой код.
      # Комментарий справа — версия, для которой SHA снят; dependabot
      # обновляет и SHA, и комментарий сам.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (7.0.1)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 (2.9.3)
        with:
          workspaces: chip-data-gen
      - run: rustup component add rustfmt clippy

      # `cargo fmt` читает только манифесты (`cargo metadata --no-deps`) и
      # зависимости не резолвит, поэтому проходит и без доступа к rust-lib —
      # проверено эмпирически на копии шаблона с заведомо битым git-URL.
      # `cargo clippy` для корневого workspace так бы не смог, его здесь нет.
      - run: cargo fmt --check
      - run: cargo fmt --manifest-path chip-data-gen/Cargo.toml --check
      - run: cargo clippy --manifest-path chip-data-gen/Cargo.toml --all-targets -- -D warnings

      # Тесты на сам `chip-select.rhai`: гоняют его через движок rhai с
      # подменёнными `variable`/`file`, каждый — по всем 1479 чипам. Здесь же
      # проверка штампа версий (списки чипов собраны из той же версии
      # embassy-stm32, что объявлена в crates-cross/Cargo.toml) и юнит-тесты разбора
      # метаданных. В `--release`, иначе интерпретация rhai растягивает прогон
      # с секунд до минут.
      - run: cargo test --manifest-path chip-data-gen/Cargo.toml --release

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2 (2.88.0)
        with:
          tool: cargo-generate

      # `--quick`: генерация под каждый чип из набора и проверка, что не
      # осталось неподставленных плейсхолдеров; без сборки, которой всё равно
      # нужен rust-lib. Доступа к нему здесь нет вовсе, и это ничего не ломает:
      # генерация зависимости не резолвит, а `cargo update` делает только
      # полный прогон template-check — то есть локально.
      - run: cargo run --manifest-path chip-data-gen/Cargo.toml --bin template-check -- --quick

      # Два прогона, закрывающие ветки, которые до сих пор не генерировались
      # ни разу: дефолт `--ci` — `github`, и CI звал только его. Ветка `gitlab`
      # держала в `.gitlab-ci.yml` четыре куска Liquid, не отрендеренные ни в
      # одной из 11 конфигураций, а `ci=none` не проверял нигде, что каталоги
      # действительно исчезают. Одного чипа здесь достаточно: `[conditional]`
      # в `cargo-generate.toml` от чипа не зависит, а `template-check` сверяет
      # состав файлов проекта с ожидаемым для каждого `ci`.
      - name: Генерация под ci=gitlab
        run: cargo run --manifest-path chip-data-gen/Cargo.toml --bin template-check -- --quick --ci gitlab stm32f407ve
      - name: Генерация под ci=none
        run: cargo run --manifest-path chip-data-gen/Cargo.toml --bin template-check -- --quick --ci none stm32f407ve
