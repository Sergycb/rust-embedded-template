# rumdl — Markdown и Markdown внутри `///`/`//!`.
#
# Запускать в СГЕНЕРИРОВАННОМ проекте: в репозитории шаблона в 57 `.md` и 180
# строках doc-комментариев живут Liquid-подстановки и условия, и проверка
# сырых файлов даёт ложные срабатывания на ссылках и ветках, которых в проекте
# не будет. В сгенерированном проекте Liquid уже разрешён.
#
# Набор правил намеренно маленький: сначала формат и ссылки, без MD013
# (длина строки) и MD033 (inline HTML) — в доках есть таблицы, длинные
# объяснения и `<...>` в примерах. Добавлять правила по мере чистки baseline.

[global]
include = ["**/*.md", "**/*.rs"]
exclude = [
    "target/**",
    "crates-cross/target/**",
    "crates-host/chip-info/target/**",
    ".local/**",
    ".remember/**",
    ".claude/**",
    "chip-data/**",
]
respect-gitignore = true

# MD009 — хвостовые пробелы
# MD010 — табы вне кода
# MD012 — несколько пустых строк подряд
# MD022 — пустая строка вокруг заголовка
# MD031 — пустая строка вокруг code fence
# MD032 — пустая строка вокруг списка
# MD044 — капитализация технических терминов
# MD047 — файл заканчивается одним newline
# MD051 — якорь ссылки существует
# MD057 — относительный путь ссылки существует (с учётом регистра)
enable = [
    "MD009",
    "MD010",
    "MD012",
    "MD022",
    "MD031",
    "MD032",
    "MD044",
    "MD047",
    "MD051",
    "MD057",
]

[MD044]
names = [
    "STM32",
    # `embassy` — имя крейта/идентификатор, поэтому в списке его нет:
    # MD044 иначе требует `Embassy` даже в inline code.
    "CANopen",
    "Modbus",
    "MQTT",
    "W25Q",
    "EEPROM",
    "defmt",
    "probe-rs",
]
code-blocks = false
whole-words = true

[per-file-ignores]
# Модульные доки встраиваются в rustdoc через include_str!: `[`crate::...`]`
# разрешает rustdoc, а не Markdown reference definitions. MD051 в этих файлах
# тоже не нужен — якорей в них нет, а заголовки рендерит rustdoc.
"docs/modules/**/*.md" = ["MD051"]
# MAINTAINING.md есть только в шаблоне; его 15 якорей ссылаются на заголовки
# с Liquid и кодом.
"MAINTAINING.md" = ["MD051"]
