[package]
name = "chip-data-gen"
version = "0.1.0"
edition = "2024"
publish = false
# Бинарей здесь два (второй — template-check), а команда перегенерации списков
# документирована как `cargo run --manifest-path chip-data-gen/Cargo.toml`: без
# этого ключа cargo не смог бы выбрать, какой из них запускать.
default-run = "chip-data-gen"

# Не часть корневого workspace: этот крейт — инструмент обслуживания шаблона
# (перегенерирует таблицы чипов в chip-data/), сам каталог не должен
# попадать в проекты пользователей шаблона — см. cargo-generate.toml,
# [template].ignore (не .exclude — см. комментарий там же).
[workspace]

[dependencies]
anyhow     = "1.0.104"
serde_json = "1.0.154"

# Не член ни одного [workspace] — [workspace.lints] отсюда не наследуются,
# поэтому все правила корневого Cargo.toml продублированы явно (а не через
# `[lints] workspace = true`), как и в `crates-host/chip-info/Cargo.toml`;
# обоснование каждого — в комментариях там. Меняете их там — меняйте и здесь.
# Группы `arbitrary_source_item_ordering` и послабления для тестов берутся из
# корневого clippy.toml: clippy ищет его вверх от манифеста.
[lints.rust]
# Как в корне, `deny`: unsafe генератору не нужен вовсе.
unsafe_code = "deny"
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn        = "warn"

[lints.clippy]
all                     = { level = "warn", priority = -1 }
unwrap_used             = "deny"
let_underscore_must_use = "deny"
dbg_macro               = "deny"
todo                    = "warn"
unimplemented           = "warn"
large_stack_arrays      = "warn"
undocumented_unsafe_blocks = "warn"
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
mod_module_files        = "warn"
map_err_ignore          = "warn"
arbitrary_source_item_ordering = "warn"

[dev-dependencies]
rhai = "1.27.0"
