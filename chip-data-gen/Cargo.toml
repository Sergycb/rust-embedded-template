[package]
name = "chip-data-gen"
version = "0.1.0"
edition = "2024"
publish = false

# Не часть корневого workspace: этот крейт — инструмент обслуживания шаблона
# (перегенерирует список чипов в chip-select.rhai), сам каталог не должен
# попадать в проекты пользователей шаблона — см. cargo-generate.toml,
# [template].ignore (не .exclude — см. комментарий там же).
[workspace]

[dependencies]
anyhow     = "1.0.100"
serde_json = "1.0.149"

# Не член ни одного [workspace] — [workspace.lints] отсюда не наследуются,
# поэтому те же правила, что в корневом и cross/Cargo.toml, продублированы
# явно (а не через `[lints] workspace = true`).
[lints.clippy]
all                     = { level = "warn", priority = -1 }
unwrap_used             = "deny"
let_underscore_must_use = "deny"
dbg_macro               = "deny"
todo                    = "warn"
unimplemented           = "warn"
large_stack_arrays      = "warn"

[dev-dependencies]
rhai = "1.25.1"
