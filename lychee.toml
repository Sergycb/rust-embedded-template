# Внешние ссылки: http(s) вместо локальных путей — локальные ссылки и якоря
# проверяет `rumdl` (MD051/MD057). Приватные репозитории шаблона снаружи
# отвечают 404, поэтому lychee их не трогает; в проекте пользователя они
# доступны только с его правами.
scheme = ["https", "http"]
exclude = [
    '/Sergycb/(rust-lib|hw-drivers)(/|$)',
]
