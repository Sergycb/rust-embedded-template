# Внешние ссылки: http(s) вместо локальных путей — локальные ссылки и якоря
# проверяет `rumdl` (MD051/MD057). Приватные репозитории шаблона снаружи
# отвечают 404, а зеркала на своём сервере проверять еженедельным джобом
# незачем: в проекте пользователя они доступны только с его правами.
scheme = ["https", "http"]
exclude = [
    '/(Sergycb|lib)/(rust-lib|hw-drivers)(/|$)',
]
