# typos: опечатки в коде и документации. Ловит только известные ошибки по словарю,
# поэтому русский текст не трогает — исключения нужны английским сокращениям.

[files]
# Таблицы чипов, сгенерированные chip-data-gen (в проекты не раздаются):
# маркировки вроде `wba55ue` разбиваются на слова и дают `ue`.
extend-exclude = ["chip-data/"]

[default.extend-words]
# HSI — внутренний высокочастотный генератор RCC, а не «HIS».
HSI = "HSI"
# {%- if net_services contains "mqtt" %}
# Mosquitto — брокер MQTT (docs/modules/app-mqtt.md), а не «mosquito».
Mosquitto = "Mosquitto"
# {%- endif %}
