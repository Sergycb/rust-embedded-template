stages:
  - test
  - build

variables:
  CARGO_TERM_COLOR: always

.cache: &cache
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry
      - target
      - cross/target

# Пайплайны по расписанию заведены ради renovate (см. джоб в конце файла) —
# гонять на них сборку и тесты незачем.
.not-scheduled: &not_scheduled
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

host:test:
  stage: test
  image: rust:1.96.0
  <<: [*cache, *not_scheduled]
  before_script:
    - rustup component add rustfmt clippy
    - cargo install cargo-nextest --locked
  script:
    # --locked ловит рассинхрон Cargo.toml и закоммиченного Cargo.lock:
    # без него cargo молча подобрал бы свои версии, и пайплайн остался бы
    # зелёным на том, чего в репозитории нет.
    - cargo fetch --locked
    - cargo xtask lint
    - cargo xtask test host

# Джоб kani:test здесь был и намеренно убран: kani компилирует крейт вместе со
# всеми зависимостями СВОИМ тулчейном (0.67.0 — rustc 1.93.0-nightly), а крейты
# из rust-lib объявляют rust-version = 1.96, и cargo отказывается резолвить ещё
# до верификации. Пока kani не догонит 1.96, джоб падал бы на каждом пайплайне,
# тратя минуты на установку собственного тулчейна. Харнессы
# (domain/src/kani_proofs.rs) остались — они под cfg(kani) и на обычные сборки
# не влияют; запускать вручную: cd domain && cargo kani --features log.

cross:build:
  stage: build
  image: rust:1.96.0
  <<: [*cache, *not_scheduled]
  before_script:
    - rustup component add rustfmt clippy
    - rustup target add {{target}}
    - cargo install flip-link --locked
  script:
    - cargo fetch --locked --manifest-path cross/Cargo.toml
    - cargo xtask lint cross
    - cargo xtask build

# renovate.json — это КОНФИГУРАЦИЯ репозитория, а не запускалка: без джоба
# ниже (или без Mend Renovate App, подключённого к проекту) он лежит мёртвым
# грузом и никаких MR не создаёт. В отличие от GitHub, где dependabot.yml
# работает нативно, силами самой платформы.
#
# Чтобы это заработало, нужны две вещи со стороны проекта:
#   1. CI/CD variable RENOVATE_TOKEN — Project/Group Access Token с ролью
#      Developer и скоупом `api` (масked, не protected: расписание может идти
#      по незащищённой ветке);
#   2. Pipeline schedule (CI/CD -> Schedules), например раз в сутки ночью.
#
# Джоб намеренно не в стейдже сборки и запускается ТОЛЬКО по расписанию: на
# обычных push/MR он не нужен, а остальные джобы, наоборот, исключены из
# расписания (см. .not-scheduled выше).
#
# Взят образ renovate/renovate вместо `include:` официального
# renovate-bot/renovate-runner — так конфиг самодостаточен и не зависит от
# доступности внешнего проекта с self-managed инстанса.
renovate:
  stage: test
  image: renovate/renovate:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_TOKEN: $RENOVATE_TOKEN
    # Обновляем только этот проект, а не всё, что видно токену.
    RENOVATE_AUTODISCOVER: "false"
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    LOG_LEVEL: info
  script:
    - renovate
