stages:
  - test
  - build
{%- if ota == "true" %}
  # Только для тегов (джобы release:* в конце файла). Отдельный стейдж, а не
  # `build`: публикация обязана идти после сборки, а внутри одного стейджа
  # порядок джобов не гарантирован.
  - release
{%- endif %}

variables:
  CARGO_TERM_COLOR: always

.cache: &cache
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry
      - target
      - crates-cross/target

# Пайплайны по расписанию заведены ради renovate (см. джоб в конце файла) —
# гонять на них сборку и тесты незачем.
.not-scheduled: &not_scheduled
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

host:test:
  stage: test
  image: rust:1.96.0
  <<: [*cache, *not_scheduled]
  before_script:
    # llvm-tools нужен покрытию: cargo-llvm-cov зовёт llvm-profdata и llvm-cov
    # из тулчейна, а в образе их нет.
    - rustup component add rustfmt clippy llvm-tools
    - cargo install cargo-nextest --locked
    - cargo install cargo-llvm-cov --locked
  script:
    # --locked ловит рассинхрон Cargo.toml и закоммиченного Cargo.lock:
    # без него cargo молча подобрал бы свои версии, и пайплайн остался бы
    # зелёным на том, чего в репозитории нет.
    - cargo fetch --locked
    - cargo xtask lint
    - cargo xtask test host
    # Покрытие без порога: цифра нужна, чтобы видеть, куда тесты не
    # заглядывают, а не чтобы ронять пайплайн. Порог в проекте, где половина
    # кода — `bsp` под железо, которого у раннера нет, означал бы только одно:
    # писать тесты ради процента. Формат cobertura — тот, который GitLab
    # показывает прямо в диффе merge request'а.
    - cargo llvm-cov nextest --workspace --exclude host-target-tests
      --features domain/log,domain/std --release --ignore-filename-regex 'xtask' --summary-only
    # Второй вызов ничего не пересобирает и не перезапускает: `report` строит
    # отчёт по данным, которые оставил предыдущий шаг. Два вызова нужны потому,
    # что форматов за раз бывает только один — а нужны оба: таблица в лог (её
    # разбирает `coverage:` ниже) и cobertura для диффа merge request'а.
    - cargo llvm-cov report --cobertura --output-path coverage.xml
  # Первый процент в строке TOTAL — покрытие по регионам; GitLab покажет его
  # рядом с пайплайном.
  coverage: '/^\s*TOTAL.*?(\d+\.\d+)%/'
  artifacts:
    # Без `when: always`, хотя он тут и стоял: `coverage.xml` пишет последняя
    # строка `script`, и при упавших тестах пайплайн до неё не доходит — файла
    # не существует, выгружать нечего. Обещание «отчёт будет и на красном
    # прогоне» было невыполнимым, а платой за него шла ошибка выгрузки
    # артефакта в каждом красном пайплайне. Захотите отчёт и на упавших тестах
    # — его надо строить в `after_script`, а не помечать артефакт.
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Джоб kani:test здесь был и намеренно убран: kani компилирует крейт вместе со
# всеми зависимостями СВОИМ тулчейном (0.67.0 — rustc 1.93.0-nightly), а крейты
# из rust-lib объявляют rust-version = 1.96, и cargo отказывается резолвить ещё
# до верификации. Пока kani не догонит 1.96, джоб падал бы на каждом пайплайне,
# тратя минуты на установку собственного тулчейна. Харнессы
# (crates-host/domain/src/kani_proofs.rs) остались — они под cfg(kani) и на обычные сборки
# не влияют; запускать вручную: cd crates-host/domain && cargo kani --features log.

# Проверка распиновки: не занят ли выводами платы отладочный порт (`PA13`/
# `PA14` — после прошивки плата перестаёт отвечать пробнику) и выводы кварца.
# Всё остальное про распиновку ловит компилятор.
#
# `changes` здесь не оптимизация, а условие существования джоба: без фильтра
# каждый пайплайн платил бы сборкой `stm32-metapac` ради инструмента, который
# на прошивку не влияет, — а от этого в шаблоне отказывались осознанно
# (см. CLAUDE.md).
pins:check:
  stage: test
  image: rust:1.96.0
  # Свой кеш, а не общий `.cache`: у `chip-info` отдельный [workspace], и его
  # артефакты лежат в `crates-host/chip-info/target`, которого в том якоре нет
  # — джоб пересобирал бы `stm32-metapac` каждый раз, то есть ровно ту цену,
  # ради экономии которой заведён фильтр. Отдельный ключ заодно убирает гонку:
  # с общим ключом два джоба одной стадии перезаписывают архив друг друга.
  cache:
    key: "pins-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry
      - crates-host/chip-info/target
  # Одним правилом: `if` и `changes` внутри одного правила GitLab соединяет по
  # И. Источники перечислены явно, потому что в пайплайнах, где диффа нет
  # (`web`, `api`, `trigger`, теги), `changes` истинно всегда — джоб собирал бы
  # метапак там, где распиновку никто не трогал.
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - crates-cross/bsp/src/resources.rs
        # Обновление `stm32-metapac` (у него своя запись в renovate) меняет те
        # самые метаданные, по которым идёт проверка; смена чипа правит обе
        # чип-фичи сразу.
        - crates-host/chip-info/**
        - crates-cross/Cargo.toml
  script:
    # Напрямую, а не через `cargo xtask pins --check`: обёртка живёт в корневом
    # workspace, и её сборка потянула бы резолв всего воркспейса вместе с
    # `domain` и его git-зависимостями. Этому джобу они не нужны — `chip-info`
    # зависит только от `stm32-metapac` и `anyhow`.
    #
    # `--locked` — как в соседних джобах: иначе cargo молча подберёт свои
    # версии, и пайплайн останется зелёным на том, чего в репозитории нет.
    - cargo run --locked --manifest-path crates-host/chip-info/Cargo.toml -- --check

cross:build:
  stage: build
  image: rust:1.96.0
  <<: [*cache, *not_scheduled]
  before_script:
    - rustup component add rustfmt clippy
    - rustup target add {{target}}
    - cargo install flip-link --locked
  script:
    # `--locked` здесь условный, в отличие от host:test выше. Шаблон не раздаёт
    # crates-cross/Cargo.lock: состав зависимостей зависит от ответов при
    # генерации (OTA, раздел настроек, подпись), и один файл подходил бы ровно
    # одному сочетанию. Пока проект не собран и lock не закоммичен, строгий шаг
    # падал бы не на рассинхроне, а на отсутствии файла — то есть первый же
    # пайплайн свежего проекта был бы красным без причины. Как только lock в
    # репозитории, проверка становится строгой сама.
    - |
      if [ -f crates-cross/Cargo.lock ]; then
        cargo fetch --locked --manifest-path crates-cross/Cargo.toml
      else
        echo "ВНИМАНИЕ: crates-cross/Cargo.lock не закоммичен — версии резолвятся заново на каждом пайплайне"
        cargo fetch --manifest-path crates-cross/Cargo.toml
      fi
    - cargo xtask lint cross
    - cargo xtask build
    # Размер образа отдельной метрикой. Кеша и базы, в отличие от GitHub, здесь
    # не нужно: GitLab сам сравнивает metrics-отчёт merge request'а с отчётом
    # целевой ветки и показывает разницу в виджете MR. Порога нет — как и у
    # покрытия: цифра нужна, чтобы увидеть рост тогда, когда автор ещё помнит,
    # зачем он его добавил, а не чтобы ронять пайплайн.
    - echo "image_size_bytes $(cat .image-size)" > metrics.txt
  variables:
    # Число кладёт сам `cargo xtask build` — чтобы не вылавливать его отсюда
    # регулярным выражением из человекочитаемой строки.
    IMAGE_SIZE_OUT: .image-size
  artifacts:
    # Без `when: always`, в отличие от отчёта о покрытии выше: тот нужен как
    # раз когда тесты упали, а здесь при упавшей сборке нет ни образа, ни
    # `metrics.txt` — и GitLab ругался бы на отсутствующий артефакт в каждом
    # красном пайплайне.
    reports:
      metrics: metrics.txt

# Тесты на живой плате. Джоб выключен, пока в проекте не заведена переменная
# CI/CD `HIL` со значением `true`: без неё пайплайн не ждёт раннера, которого
# ни у кого нет.
#
# Требования к раннеру (тег `stm32`): подключённая плата с отладочным
# пробником, rust с целевым target'ом, probe-rs-tools, flip-link — всё ставит
# `cargo xtask setup`, см. README, «Тесты на плате в CI».
#
# `resource_group` — не украшение: пробник у платы один, и два пайплайна за
# него подерутся. GitLab выполняет джобы одной группы строго по одному.
board:test:
  # Стейдж `build`, а не `test`: джоб зависит от `cross:build`, а `needs` не
  # умеет смотреть в более поздний стейдж — пайплайн отказался бы стартовать.
  stage: build
  tags: [stm32]
  needs: ["cross:build"]
  resource_group: hil
  rules:
    - if: $HIL == "true" && $CI_PIPELINE_SOURCE != "schedule"
  before_script:
    - rustup target add {{target}}
  script:
    - cargo xtask test target
    - cargo xtask test host-target
{%- if ota == "true" %}

# Релиз по тегу: то, что уезжает на устройства, берётся из версионированного
# места, а не из папки на машине того, кто собирал.
#
# Джобов два, и это не дробление ради красоты: `release:` умеет только образ
# release-cli, а собрать прошивку можно только в rust-образе. Второй джоб
# получает ID первого через dotenv — без него не собрать ссылку на артефакт.
#
# Оба вне `.not-scheduled`: тег и расписание не пересекаются, а лишнее правило
# только маскировало бы ошибку в `rules`.
release:build:
  stage: release
  image: rust:1.96.0
  <<: *cache
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - rustup target add {{target}}
    - cargo install flip-link --locked
  script:
    # Прошивка печатает свою версию при старте (shadow-rs берёт её из
    # [workspace.package]), а релиз называется тегом. Разойдись они — и по
    # логу с устройства уже не понять, какой релиз на нём стоит.
    - |
      tag="${CI_COMMIT_TAG#v}"
      version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' crates-cross/Cargo.toml | head -1)
      if [ "$tag" != "$version" ]; then
        echo "тег $CI_COMMIT_TAG не совпадает с version = \"$version\" в crates-cross/Cargo.toml"
        exit 1
      fi
      echo "версия $version"
{%- if signed == "true" %}
    # Закрытый ключ в репозитории не лежит (он в .gitignore), поэтому приходит
    # переменной CI/CD — 32 байта seed в base64 (`base64 -w0 <
    # ota-signing-key.bin`), тип Variable, masked. Без него сборка НЕ падает:
    # образ соберётся, но без подписи, и такой релиз ни одно уже прошитое
    # устройство не примет.
    - |
      if [ -z "$OTA_SIGNING_KEY" ]; then
        echo "ВНИМАНИЕ: переменная OTA_SIGNING_KEY не задана — образ будет собран, но НЕ подписан"
      else
        printf '%s' "$OTA_SIGNING_KEY" | base64 -d > ota-signing-key.bin
        size=$(wc -c < ota-signing-key.bin)
        if [ "$size" -ne 32 ]; then
          echo "OTA_SIGNING_KEY после base64 -d даёт $size байт вместо 32"
          exit 1
        fi
      fi
{%- endif %}
    # Та же команда, что и локально: собирает оба профиля, меряет образ против
    # раздела, кладёт рядом app.bin и подписывает его, если ключ на месте.
    - cargo xtask build
    # Артефакты собираются из корня: путь внутри target/ зависит от чипа, а в
    # `artifacts:` подстановки переменных нет.
    - cp "crates-cross/target/{{target}}/release/app.bin" app.bin
    - if [ -f "crates-cross/target/{{target}}/release/app.bin.sig" ]; then cp "crates-cross/target/{{target}}/release/app.bin.sig" app.bin.sig; fi
    - echo "BUILD_JOB_ID=$CI_JOB_ID" > build.env
  artifacts:
    paths:
      - app.bin
      - app.bin.sig
    reports:
      dotenv: build.env
    expire_in: never

release:publish:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["release:build"]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "релиз $CI_COMMIT_TAG со ссылками на артефакты джоба $BUILD_JOB_ID"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Прошивка $CI_COMMIT_TAG"
    assets:
      links:
        - name: app.bin
          url: "$CI_PROJECT_URL/-/jobs/$BUILD_JOB_ID/artifacts/file/app.bin"
{%- if signed == "true" %}
        - name: app.bin.sig
          url: "$CI_PROJECT_URL/-/jobs/$BUILD_JOB_ID/artifacts/file/app.bin.sig"
{%- endif %}
{%- endif %}

# renovate.json — это КОНФИГУРАЦИЯ репозитория, а не запускалка: без джоба
# ниже (или без Mend Renovate App, подключённого к проекту) он лежит мёртвым
# грузом и никаких MR не создаёт. В отличие от GitHub, где dependabot.yml
# работает нативно, силами самой платформы.
#
# Чтобы это заработало, нужны две вещи со стороны проекта:
#   1. CI/CD variable RENOVATE_TOKEN — Project/Group Access Token с ролью
#      Developer и скоупом `api` (масked, не protected: расписание может идти
#      по незащищённой ветке);
#   2. Pipeline schedule (CI/CD -> Schedules), например раз в сутки ночью.
#
# Джоб намеренно не в стейдже сборки и запускается ТОЛЬКО по расписанию: на
# обычных push/MR он не нужен, а остальные джобы, наоборот, исключены из
# расписания (см. .not-scheduled выше).
#
# Взят образ renovate/renovate вместо `include:` официального
# renovate-bot/renovate-runner — так конфиг самодостаточен и не зависит от
# доступности внешнего проекта с self-managed инстанса.
renovate:
  stage: test
  image: renovate/renovate:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_TOKEN: $RENOVATE_TOKEN
    # Обновляем только этот проект, а не всё, что видно токену.
    RENOVATE_AUTODISCOVER: "false"
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    LOG_LEVEL: info
  script:
    - renovate
