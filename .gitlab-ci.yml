stages:
  - test
  - build

variables:
  CARGO_TERM_COLOR: always

.cache: &cache
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry
      - target
      - crates-cross/target

# Пайплайны по расписанию заведены ради renovate (см. джоб в конце файла) —
# гонять на них сборку и тесты незачем.
.not-scheduled: &not_scheduled
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

host:test:
  stage: test
  image: rust:1.96.0
  <<: [*cache, *not_scheduled]
  before_script:
    - rustup component add rustfmt clippy
    - cargo install cargo-nextest --locked
  script:
    # --locked ловит рассинхрон Cargo.toml и закоммиченного Cargo.lock:
    # без него cargo молча подобрал бы свои версии, и пайплайн остался бы
    # зелёным на том, чего в репозитории нет.
    - cargo fetch --locked
    - cargo xtask lint
    - cargo xtask test host

# Джоб kani:test здесь был и намеренно убран: kani компилирует крейт вместе со
# всеми зависимостями СВОИМ тулчейном (0.67.0 — rustc 1.93.0-nightly), а крейты
# из rust-lib объявляют rust-version = 1.96, и cargo отказывается резолвить ещё
# до верификации. Пока kani не догонит 1.96, джоб падал бы на каждом пайплайне,
# тратя минуты на установку собственного тулчейна. Харнессы
# (crates-host/domain/src/kani_proofs.rs) остались — они под cfg(kani) и на обычные сборки
# не влияют; запускать вручную: cd crates-host/domain && cargo kani --features log.

# Проверка распиновки: не занят ли выводами платы отладочный порт (`PA13`/
# `PA14` — после прошивки плата перестаёт отвечать пробнику) и выводы кварца.
# Всё остальное про распиновку ловит компилятор.
#
# `changes` здесь не оптимизация, а условие существования джоба: без фильтра
# каждый пайплайн платил бы сборкой `stm32-metapac` ради инструмента, который
# на прошивку не влияет, — а от этого в шаблоне отказывались осознанно
# (см. CLAUDE.md).
pins:check:
  stage: test
  image: rust:1.96.0
  # Свой кеш, а не общий `.cache`: у `chip-info` отдельный [workspace], и его
  # артефакты лежат в `crates-host/chip-info/target`, которого в том якоре нет
  # — джоб пересобирал бы `stm32-metapac` каждый раз, то есть ровно ту цену,
  # ради экономии которой заведён фильтр. Отдельный ключ заодно убирает гонку:
  # с общим ключом два джоба одной стадии перезаписывают архив друг друга.
  cache:
    key: "pins-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry
      - crates-host/chip-info/target
  # Одним правилом: `if` и `changes` внутри одного правила GitLab соединяет по
  # И. Источники перечислены явно, потому что в пайплайнах, где диффа нет
  # (`web`, `api`, `trigger`, теги), `changes` истинно всегда — джоб собирал бы
  # метапак там, где распиновку никто не трогал.
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - crates-cross/bsp/src/resources.rs
        # Обновление `stm32-metapac` (у него своя запись в renovate) меняет те
        # самые метаданные, по которым идёт проверка; смена чипа правит обе
        # чип-фичи сразу.
        - crates-host/chip-info/**
        - crates-cross/Cargo.toml
  script:
    # Напрямую, а не через `cargo xtask pins --check`: обёртка живёт в корневом
    # workspace, и её сборка потянула бы резолв всего воркспейса вместе с
    # `domain` и его git-зависимостями. Этому джобу они не нужны — `chip-info`
    # зависит только от `stm32-metapac` и `anyhow`.
    #
    # `--locked` — как в соседних джобах: иначе cargo молча подберёт свои
    # версии, и пайплайн останется зелёным на том, чего в репозитории нет.
    - cargo run --locked --manifest-path crates-host/chip-info/Cargo.toml -- --check

cross:build:
  stage: build
  image: rust:1.96.0
  <<: [*cache, *not_scheduled]
  before_script:
    - rustup component add rustfmt clippy
    - rustup target add {{target}}
    - cargo install flip-link --locked
  script:
    # `--locked` здесь условный, в отличие от host:test выше. Шаблон не раздаёт
    # crates-cross/Cargo.lock: состав зависимостей зависит от ответов при
    # генерации (OTA, раздел настроек, подпись), и один файл подходил бы ровно
    # одному сочетанию. Пока проект не собран и lock не закоммичен, строгий шаг
    # падал бы не на рассинхроне, а на отсутствии файла — то есть первый же
    # пайплайн свежего проекта был бы красным без причины. Как только lock в
    # репозитории, проверка становится строгой сама.
    - |
      if [ -f crates-cross/Cargo.lock ]; then
        cargo fetch --locked --manifest-path crates-cross/Cargo.toml
      else
        echo "ВНИМАНИЕ: crates-cross/Cargo.lock не закоммичен — версии резолвятся заново на каждом пайплайне"
        cargo fetch --manifest-path crates-cross/Cargo.toml
      fi
    - cargo xtask lint cross
    - cargo xtask build

# renovate.json — это КОНФИГУРАЦИЯ репозитория, а не запускалка: без джоба
# ниже (или без Mend Renovate App, подключённого к проекту) он лежит мёртвым
# грузом и никаких MR не создаёт. В отличие от GitHub, где dependabot.yml
# работает нативно, силами самой платформы.
#
# Чтобы это заработало, нужны две вещи со стороны проекта:
#   1. CI/CD variable RENOVATE_TOKEN — Project/Group Access Token с ролью
#      Developer и скоупом `api` (масked, не protected: расписание может идти
#      по незащищённой ветке);
#   2. Pipeline schedule (CI/CD -> Schedules), например раз в сутки ночью.
#
# Джоб намеренно не в стейдже сборки и запускается ТОЛЬКО по расписанию: на
# обычных push/MR он не нужен, а остальные джобы, наоборот, исключены из
# расписания (см. .not-scheduled выше).
#
# Взят образ renovate/renovate вместо `include:` официального
# renovate-bot/renovate-runner — так конфиг самодостаточен и не зависит от
# доступности внешнего проекта с self-managed инстанса.
renovate:
  stage: test
  image: renovate/renovate:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_TOKEN: $RENOVATE_TOKEN
    # Обновляем только этот проект, а не всё, что видно токену.
    RENOVATE_AUTODISCOVER: "false"
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    LOG_LEVEL: info
  script:
    - renovate
