[package]
name = "app"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "app"
harness = false

[dependencies]
# Нужен примеру применения обновления (`SCB::sys_reset()` в
# docs/modules/bsp-ota.md) и impl'у critical-section (фича
# `critical-section-single-core` в crates-cross/Cargo.toml).
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
embassy-executor = { workspace = true, features = ["defmt"] }
# Прямо, а не транзитивно: `main.rs` поднимает `raw::Executor` в `StaticCell`
# сам, а не макросом `#[embassy_executor::main]` — иначе нечем мерить, сколько
# тиков исполнитель стоял (docs/modules/app-cpu-load.md).
static_cell = { workspace = true }
# Прямо, а не транзитивно: тем же временем цикл исполнителя меряет свой сон.
embassy-time = { workspace = true }
defmt = { workspace = true }
defmt-rtt = { workspace = true }
# Паникёр по профилю — оба крейта обычные зависимости, выбор делает
# `#[cfg(debug_assertions)]` в src/panic.rs (Cargo гейтить зависимости по
# профилю не умеет, см. docs/conventions.md). dev: `panic-probe` печатает
# причину через defmt и останавливает ядро `udf()`; release: собственный
# `#[panic_handler]` сохраняет причину через `panic-persist` в регион PANIC,
# печатает её и перезапускает МК. `panic-probe` без `use` не линкуется, а
# `panic-persist` собран с `custom-panic-handler` — своего обработчика у него нет.
panic-probe = { workspace = true, features = ["print-defmt"] }
panic-persist = { workspace = true }
bsp = { workspace = true }
# Трейты портов: приложение зовёт объекты `Board` только через них, а про
# железо за ними — регион PANIC, разделы флеша — не знает вовсе.
ports = { workspace = true }
domain = { workspace = true }
{%- if signed == "true" %}
# Проверка подписи OTA-образа: адаптер платы приложение оборачивает в
# `adapters::ota::Signed` своей версией и своим ключом (src/ota.rs).
adapters = { workspace = true, features = ["signed"] }
{%- endif %}
shadow-rs = { workspace = true }
# Граф задач в graph.rs — настоящий код, а не пример: compose-site фрагментов
# из `domain`, блок `watchdog:`, `spawn_all` в main.rs. На чипах, где граф не
# помещается (см. GRAPH_MIN_PARTITION в chip-select.rhai), он вырезается при
# генерации, но зависимость остаётся: так её версия проверяется сборкой на ARM
# в любой конфигурации.
#
# И единственная зависимость графа — это обещание самого `supervisor`
# (`supervisor-sole-dep-fixture` в rust-lib): всё, что compose-site называет
# сам, — `Duration` для `check_every:`, `Liveness` в сигнатуре наблюдателя
# (`observe:`), `HardwareWatchdog` — он реэкспортирует публичными путями.
# Реализация трейта над IWDG живёт в `bsp` (bsp/src/wdg.rs), и там `watchdog`
# стоит прямой зависимостью; граф получает оттуда готовый тип.
supervisor = { workspace = true }
#
# `embassy-stm32` здесь нет и быть не должно: про чип знает `bsp`, а
# приложение — только про объекты, которые тот отдаёт. Драйвер времени
# (`time-driver-any`) просит оттуда же — см. `bsp/Cargo.toml`, где разобрано,
# почему фича не в воркспейсе.

[build-dependencies]
shadow-rs = { workspace = true, features = ["build", "no_std"] }
