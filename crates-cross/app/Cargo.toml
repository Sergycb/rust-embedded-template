[package]
name = "app"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
{%- if ota == "true" %}
# `cargo run -p app` — рабочий образ, а не тестовый `app-unconfirmed` ниже.
default-run = "app"
{%- endif %}

[lints]
workspace = true

# Всё, что не запуск, — библиотека пакета (`src/lib.rs`); запуск — `#[entry]
# main` у каждого бинарника свой. Целей unit-тестов, бенчмарков и doc-тестов у
# библиотеки нет: им нужен крейт `test`, а его для `thumbv*-none-*` нет
# (E0463), как и у `bsp`.
[lib]
test = false
bench = false
doctest = false

[[bin]]
name = "app"
harness = false
{%- if ota == "true" %}

# Тестовый образ{% if has_protobuf == "true" %} `cargo xtask test host-target`{% endif %}: та же библиотека пакета, свой
# запуск и свои свойства образа (`src/bin/app-unconfirmed.rs`) — версия на
# единицу больше, себя не подтверждает, и следующий сброс его откатывает
# (docs/ota.md, «Тесты OTA по протоколу»). Отдельным бинарником: у ELF своё
# имя, и рабочий `app` (`app.bin` из `cargo xtask build`, `cargo flash -p app
# --bin app`) с ним не спутать. Голый `cargo build` собирает оба; `cargo xtask
# build` и прошивка — только `--bin app`{% if has_protobuf == "true" %}, `cargo xtask test host-target` —
# `--bin app-unconfirmed`{% endif %}, `cargo xtask lint cross` линтует оба.
[[bin]]
name = "app-unconfirmed"
path = "src/bin/app-unconfirmed.rs"
harness = false
test = false
bench = false
{%- endif %}

[dependencies]
embassy-executor = { workspace = true, features = ["defmt"] }
# Прямо, а не транзитивно: `main` бинарника поднимает `raw::Executor` в
# `StaticCell` сам, а не макросом `#[embassy_executor::main]` — иначе нечем
# мерить, сколько тиков исполнитель стоял (docs/modules/app-cpu-load.md).
static_cell = { workspace = true }
# Прямо, а не транзитивно: тем же временем цикл исполнителя меряет свой сон.
# Отметка времени у строк лога — здесь, а не в воркспейсе (см.
# crates-cross/Cargo.toml).
embassy-time = { workspace = true, features = ["defmt-timestamp-uptime-ms"] }
defmt = { workspace = true }
defmt-rtt = { workspace = true }
# Точка входа (`#[entry]`) и обработчик `HardFault` (src/fault.rs).
cortex-m-rt = { workspace = true }
# Свободные функции ядра: `wfe` в цикле исполнителя, запрет прерываний в
# паникёре, ловушка деления и регистры фолта (src/fault.rs).
cortex-m = { workspace = true }
# Паникёр по профилю (src/panic.rs) — обе обычные зависимости, выбор делает
# `#[cfg(debug_assertions)]` (docs/diagnostics.md, «Два паникёра, один на
# сборку»). `panic-persist` собран с `custom-panic-handler` — своего
# обработчика у него нет.
panic-probe = { workspace = true, features = ["print-defmt"] }
panic-persist = { workspace = true }
# Драйвер времени — фичей `bsp` (там же почему){% if ota == "true" %}: от него зависит и `boot`,
# которому драйвер времени нельзя{% endif %}.
bsp = { workspace = true, features = ["time-driver"] }
domain = { workspace = true }
{%- if protocol_link == "true" %}
# Каналы протоколов над потоком, CDC или сокетом строит приложение в своей
# памяти ({% if graph == "true" %}привязка узла в src/graph.rs{% else %}задача протокола в src/tasks/{% endif %}) и отдаёт узлам готовыми.
adapters-logic = { workspace = true }
{%- endif %}
{%- if has_udp == "true" %}
# Тип метаданных датаграмм UDP-сокета протокола — память под них объявляет
# граф (src/graph.rs).
embassy-net = { workspace = true }
{%- endif %}
shadow-rs = { workspace = true }
{%- if graph == "true" %}
# Граф задач в graph.rs — настоящий код, а не пример: compose-site фрагментов
# из `domain`, блок `watchdog:`, `spawn_all` в задаче `start` бинарника.
#
# И единственная зависимость графа — это обещание самого `supervisor`
# (`supervisor-sole-dep-fixture` в rust-lib): всё, что compose-site называет
# сам, — `Duration` для `check_every:`, `Liveness` в сигнатуре наблюдателя
# (`observe:`), `HardwareWatchdog` — он реэкспортирует публичными путями.
# Реализация трейта над IWDG живёт в `bsp` (bsp/src/wdg.rs), и там `watchdog`
# стоит прямой зависимостью; граф получает оттуда готовый тип.
{%- elsif ota == "true" %}
# `supervisor::Readiness` в контексте узла OTA (src/tasks/ota.rs).
{%- else %}
# Код `app` в этой конфигурации `supervisor` не называет: зависимость лишь
# включает фичи из `[workspace.dependencies]` (crates-cross/Cargo.toml) тому же
# крейту, что у `domain`.
{%- endif %}
supervisor = { workspace = true }
#
# `embassy-stm32` здесь нет и быть не должно: про чип знает `bsp`, а
# приложение — только про объекты, которые тот отдаёт. Драйвер времени
# (`time-driver-any`) включает фича `bsp/time-driver` — см. `bsp/Cargo.toml`,
# почему она не в воркспейсе{% if ota == "true" %} и не безусловная{% endif %}.

{%- if ota == "true" and graph != "true" %}
# Входы команд узла OTA (`tasks::ota::CMD` и `ASK`): модуль задачи объявляет
# их `static` сам — с тем же мьютексом, что у `supervisor`, иначе типы полей `cmd`
# и `ask` контекста узла не сойдутся.
sync-request = { workspace = true }
{%- endif %}
{%- if has_modbus == "true" or ota == "true" and graph != "true" %}
{%- if has_modbus == "true" %}
# `OnceLock` карты регистров Modbus (src/modbus.rs).
{%- endif %}
{%- if ota == "true" and graph != "true" %}
# Мьютекс и сигналы узла OTA (src/tasks/ota.rs){% if has_canopen == "true" %}, метки ребра `ASK` у задач CANopen
# (src/tasks/canopen.rs){% endif %}.
{%- endif %}
embassy-sync = { workspace = true }
{%- endif %}

[build-dependencies]
shadow-rs = { workspace = true, features = ["build", "no_std"] }
