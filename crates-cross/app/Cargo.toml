[package]
name = "app"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "app"
harness = false

[dependencies]
embassy-executor = { workspace = true, features = ["defmt"] }
# Прямо, а не транзитивно: `main.rs` поднимает `raw::Executor` в `StaticCell`
# сам, а не макросом `#[embassy_executor::main]` — иначе нечем мерить, сколько
# тиков исполнитель стоял (docs/modules/app-cpu-load.md).
static_cell = { workspace = true }
# Прямо, а не транзитивно: тем же временем цикл исполнителя меряет свой сон.
# Отметка времени у строк лога — здесь, а не в воркспейсе (см.
# crates-cross/Cargo.toml).
embassy-time = { workspace = true, features = ["defmt-timestamp-uptime-ms"] }
defmt = { workspace = true }
defmt-rtt = { workspace = true }
# Драйвер времени, паникёр и обработчик `HardFault` — фичами `bsp` (там же
# почему): от него зависит и `boot`, которому драйвер времени нельзя, а
# обработчик не по карману.
bsp = { workspace = true, features = ["time-driver", "panic-handler", "fault-handler"] }
domain = { workspace = true }
{%- if has_modbus == "true" or has_protobuf == "true" or has_canopen == "true" or has_usb == "true" or has_net == "true" or ota == "true" or config == "true" %}
# Адаптеры над объектами платы собирает приложение: транспорты протоколов
# (`adapters::modbus::Rtu`, `adapters::cobs::Cobs`) вокруг интерфейса платы{% if has_usb == "true" %},
# USB-устройство с классом CDC (`adapters::usb`, src/usb.rs){% endif %}{% if has_net == "true" %},
# сетевой стек (`adapters::net::Net`, src/net.rs){% endif %}{% if ota == "true" %},
# адаптер обновления (`adapters::ota`, src/ota.rs){% endif %}{% if config == "true" %}, хранилище настроек
# (`adapters::settings`, src/settings.rs){% endif %} — `bsp` отдаёт
# поток байтов и драйверы, а что поверх них, решает приложение.
adapters = { workspace = true }
{%- endif %}
{%- if has_net == "true" %}
# Сетевой стек над Ethernet платы, сокеты и их память (src/net.rs,
# src/link.rs): число сокетов и порты — решение приложения, а не платы.
embassy-net = { workspace = true }
{%- endif %}
{%- if has_usb == "true" %}
# Конфигурация и память USB-устройства (`Config`, состояние класса CDC) —
# src/usb.rs: идентификаторы и классы — решение приложения, а не платы.
embassy-usb = { workspace = true }
{%- endif %}
shadow-rs = { workspace = true }
# Граф задач в graph.rs — настоящий код, а не пример: compose-site фрагментов
# из `domain`, блок `watchdog:`, `spawn_all` в main.rs. На чипах, где граф не
# помещается (см. GRAPH_MIN_PARTITION в chip-select.rhai), он вырезается при
# генерации, но зависимость остаётся: так её версия проверяется сборкой на ARM
# в любой конфигурации.
#
# И единственная зависимость графа — это обещание самого `supervisor`
# (`supervisor-sole-dep-fixture` в rust-lib): всё, что compose-site называет
# сам, — `Duration` для `check_every:`, `Liveness` в сигнатуре наблюдателя
# (`observe:`), `HardwareWatchdog` — он реэкспортирует публичными путями.
# Реализация трейта над IWDG живёт в `bsp` (bsp/src/wdg.rs), и там `watchdog`
# стоит прямой зависимостью; граф получает оттуда готовый тип.
supervisor = { workspace = true }
#
# `embassy-stm32` здесь нет и быть не должно: про чип знает `bsp`, а
# приложение — только про объекты, которые тот отдаёт. Драйвер времени
# (`time-driver-any`) включает фича `bsp/time-driver` — см. `bsp/Cargo.toml`,
# почему она не в воркспейсе и не безусловная.

{%- if ota == "true" and graph != "true" %}
# Вход команд узла OTA без графа (`ota::CMD` в src/main.rs): с графом его
# заводит `request:` фрагмента, а здесь `main` объявляет `static` сам — с тем же
# мьютексом, что у `supervisor`, иначе тип поля `cmd` контекста узла не сойдётся.
sync-request = { workspace = true }
embassy-sync = { workspace = true }
{%- endif %}
{%- if net_services contains "ssh" %}
# Бэкенд `getrandom` над RNG платы (src/rng.rs): случайность для криптографии
# проекта — и крейтов, что зовут `getrandom` сами, и тех, что берут генератор
# параметром (`getrandom::SysRng`). Мьютекс генератора — `embassy-sync`.
getrandom = { workspace = true }
{%- if ota != "true" or graph == "true" %}
embassy-sync = { workspace = true }
{%- endif %}
{%- endif %}

[build-dependencies]
shadow-rs = { workspace = true, features = ["build", "no_std"] }
