[package]
name = "app"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
{%- if test_image == "true" %}
# `cargo run -p app` — рабочий образ, а не тестовый `test-ota` ниже.
default-run = "app"
{%- endif %}

[lints]
workspace = true

# Всё, что не запуск, — библиотека пакета (`src/lib.rs`); запуск — `#[entry]
# main` у каждого бинарника свой. Целей unit-тестов, бенчмарков и doc-тестов у
# библиотеки нет: им нужен крейт `test`, а его для `thumbv*-none-*` нет
# (E0463), как и у `bsp`.
[lib]
test = false
bench = false
doctest = false

[[bin]]
name = "app"
harness = false
{%- if test_image == "true" %}

# Тестовый образ `cargo xtask test host-target`: та же библиотека пакета, свой
# запуск и свои свойства образа (`src/bin/test-ota.rs`) — версия на
# единицу больше, себя не подтверждает, и следующий сброс его откатывает
# (docs/ota.md, «Тесты OTA по протоколу»). Отдельным бинарником: у ELF своё
# имя, и рабочий `app` (`app.bin` из `cargo xtask build`, `cargo flash -p app
# --bin app`) с ним не спутать. Голый `cargo build` собирает оба; `cargo xtask
# build` и прошивка — только `--bin app`, `cargo xtask test host-target` —
# `--bin test-ota`, `cargo xtask lint cross` линтует оба. Есть только с
# protobuf: сценарии OTA по протоколу пока написаны только под него.
[[bin]]
name = "test-ota"
path = "src/bin/test-ota.rs"
harness = false
test = false
bench = false
{%- endif %}

[dependencies]
embassy-executor = { workspace = true, features = ["defmt"] }
# Прямо, а не транзитивно: `main` бинарника поднимает `raw::Executor` в
# `StaticCell` сам, а не макросом `#[embassy_executor::main]` — иначе нечем
# мерить, сколько тиков исполнитель стоял (docs/modules/app-cpu-load.md).
static_cell = { workspace = true }
# Прямо, а не транзитивно: тем же временем цикл исполнителя меряет свой сон.
# Отметка времени у строк лога — здесь, а не в воркспейсе (см.
# crates-cross/Cargo.toml).
embassy-time = { workspace = true, features = ["defmt-timestamp-uptime-ms"] }
defmt = { workspace = true }
# Точка входа (`#[entry]`) и обработчик `HardFault` (src/fault.rs).
cortex-m-rt = { workspace = true }
# Свободные функции ядра: `wfe` в цикле исполнителя, запрет прерываний в
# паникёре, ловушка деления и регистры фолта (src/fault.rs).
cortex-m = { workspace = true }
# Паникёр по профилю и транспорт лога — отдельным крейтом (`panic-handler`):
# библиотеку `app` линкует `target-tests` со своим паникёром от `embedded-test`,
# и второй `#[panic_handler]` в том же образе не собрался бы. Бинарники
# подключают его (`use panic_handler as _`).
panic-handler = { workspace = true }
# Дамп причины паники в регион `PANIC` (release-паникёр) и её чтение — в
# `panic-handler` и `src/panic.rs`. `custom-panic-handler` снимает собственный
# `#[panic_handler]` крейта — свой нужен, чтобы вдобавок напечатать причину.
panic-persist = { workspace = true }
# Драйвер времени — фичей `cpu` (там же почему){% if ota == "true" %}: от него зависит и `boot`,
# которому драйвер времени нельзя{% endif %}.
cpu = { workspace = true, features = ["time-driver"] }
# Плата: рычаги чипа, разложенные по полям (`crate::Board` — псевдоним над ней).
bsp = { workspace = true }
domain = { workspace = true }
# Буферы канала COBS меряются кодеком (`ports::cobs::rx_len/tx_len` в
# graph.rs / tasks/protobuf.rs) — прямо, а не транзитивно: имя крейта в коде
# `app` обязано быть своей зависимостью. Псевдонимы графа над `ports::Cpu` —
# тоже отсюда.
ports = { workspace = true }
{%- if ota == "true" or config == "true" %}
# Разделы обновления и настройки: `BlockingPartition`/`BlockingAsync` над
# сырыми ручками чипа (src/storage.rs) — то же, чем их строит bootloader.
embassy-embedded-hal = { workspace = true }
{%- endif %}
{%- if flash_page == "true" %}
# Страница раздела, не равная странице чипа (`flash_page::ErasePage`): у
# `STATE`/`CONFIG` мельче, у `ACTIVE`/`DFU` — страница обмена.
flash-page = { workspace = true }
{%- endif %}
{%- if external_flash == "true" %}
# Ёмкость внешней флеши как `NorFlash` (`ReadNorFlash::capacity`) — под размер
# её раздела настроек (src/storage.rs).
embedded-storage = { workspace = true }
{%- endif %}
{%- if protocol_link == "true" %}
# Каналы протоколов над потоком, CDC или сокетом строит приложение в своей
# памяти ({% if graph == "true" %}привязка узла в src/graph.rs{% else %}задача протокола в src/tasks/{% endif %}) и отдаёт узлам готовыми.
adapters-logic = { workspace = true }
{%- endif %}
{%- if has_udp == "true" %}
# Тип метаданных датаграмм UDP-сокета протокола — память под них объявляет
# граф (src/graph.rs).
embassy-net = { workspace = true }
{%- endif %}
shadow-rs = { workspace = true }
{%- if graph == "true" %}
# Граф задач в graph.rs — настоящий код, а не пример: compose-site фрагментов
# из `domain`, блок `watchdog:`, `spawn_all` в задаче `start` бинарника.
#
# И единственная зависимость графа — это обещание самого `supervisor`
# (`supervisor-sole-dep-fixture` в rust-lib): всё, что compose-site называет
# сам, — `Duration` для `check_every:`, `Liveness` в сигнатуре наблюдателя
# (`observe:`), `HardwareWatchdog` — он реэкспортирует публичными путями.
# Реализация трейта над IWDG живёт в `cpu` (cpu/src/wdg.rs), и там `watchdog`
# стоит прямой зависимостью; граф получает оттуда готовый тип.
{%- elsif ota == "true" %}
# `supervisor::Readiness` в контексте узла OTA (src/tasks/ota.rs).
{%- else %}
# Код `app` в этой конфигурации `supervisor` не называет: зависимость лишь
# включает фичи из `[workspace.dependencies]` (crates-cross/Cargo.toml) тому же
# крейту, что у `domain`.
{%- endif %}
supervisor = { workspace = true }
#
# `embassy-stm32` здесь нет и быть не должно: про чип знает `cpu`, а
# приложение — только про объекты, которые тот отдаёт (`crate::Board`).
# Драйвер времени (`time-driver-any`) включает фича `cpu/time-driver` — см.
# `cpu/Cargo.toml`, почему она не в воркспейсе{% if ota == "true" %} и не безусловная{% endif %}.

{%- if ota == "true" and graph != "true" %}
# Входы команд узла OTA (`tasks::ota::CMD` и `ASK`): модуль задачи объявляет
# их `static` сам — с тем же мьютексом, что у `supervisor`, иначе типы полей `cmd`
# и `ask` контекста узла не сойдутся.
sync-request = { workspace = true }
{%- endif %}
{%- if has_modbus == "true" or ota == "true" or config == "true" %}
# Мьютексы того, что проект заводит один раз на запуск: {% if has_modbus == "true" %}карта регистров
# (src/registers.rs){% endif %}{% if ota == "true" %}{% if has_modbus == "true" %}; {% endif %}разделы обновления (src/storage.rs){% if graph != "true" %} и входы
# узла OTA (src/tasks/ota.rs){% if has_canopen == "true" %}, метки ребра `ASK` у задач CANopen (src/tasks/canopen.rs){% endif %}{% endif %}{% endif %}{% if config == "true" %}{% if has_modbus == "true" or ota == "true" %}; {% endif %}носитель
# настроек (src/storage.rs){% endif %}.
embassy-sync = { workspace = true }
{%- endif %}

[build-dependencies]
shadow-rs = { workspace = true, features = ["build", "no_std"] }
