[package]
name = "app"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "app"
harness = false

[dependencies]
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
embassy-executor = { workspace = true, features = ["defmt"] }
defmt = { workspace = true }
defmt-rtt = { workspace = true }
# `panic-probe` здесь больше нет: его `#[panic_handler]` печатает бэктрейс, но
# ничего не сохраняет, а причина падения нужна и после сброса, когда пробника
# рядом нет. Свой хендлер в src/main.rs делает обе вещи и потому занимает
# единственное место паникёра в бинарнике. В `boot` panic-probe остался — там
# ни PERSIST, ни чтения дампа нет.
panic-persist = { workspace = true }
bsp = { workspace = true }
# Трейты портов: приложение зовёт объекты `Board` только через них, а про
# железо за ними — регион PERSIST, разделы флеша — не знает вовсе.
ports = { workspace = true }
domain = { workspace = true }
shadow-rs = { workspace = true }
# Граф задач в task_orchestration.rs — настоящий код, а не пример: `node`,
# политика перезапуска, `spawn_all` в main.rs. На чипах, где граф не помещается
# (см. GRAPH_MIN_PARTITION в chip-select.rhai), он вырезается при генерации, но
# зависимость остаётся: так её версия проверяется сборкой на ARM в любой
# конфигурации.
supervisor = { workspace = true }
# Реализация трейта `HardwareWatchdog` над IWDG живёт в `bsp` (bsp/src/wdg.rs),
# и граф получает оттуда готовый тип. Прямая зависимость здесь ради одного
# имени: наблюдатель за просрочкой узлов (`observe:` в блоке `watchdog:`)
# обязан иметь сигнатуру `fn(&'static str, watchdog::Liveness)`, а `Liveness`
# `supervisor` наружу не реэкспортирует. В проекте без графа наблюдателя нет и
# зависимость не используется — остаётся по той же причине, что и `supervisor`
# выше.
watchdog = { workspace = true }
#
# А вот `embassy-time` нужен прямо: время графа задач — это `Duration`
# (`check_every:`, `watchdog:`, backoff'ы), и транзитивно он сюда не приходит —
# `supervisor` реэкспортирует в своём `__private` только executor, futures,
# sync и sync_request.
embassy-time = { workspace = true }
# Только ради драйвера времени. В воркспейсе этой фичи нет намеренно: оттуда
# она доставалась и бутлоадеру, который запускал TIM и оставлял его
# прерывание размаскированным на момент прыжка в приложение (см. комментарий
# в crates-cross/Cargo.toml). Просить её обязан тот, кто линкуется с
# `embassy-time`, — то есть этот бинарник.
embassy-stm32 = { workspace = true, features = ["time-driver-any"] }

[build-dependencies]
shadow-rs = { workspace = true, features = ["build", "no_std"] }
