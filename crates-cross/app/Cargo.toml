[package]
name = "app"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "app"
harness = false

[dependencies]
# Нужен примеру применения обновления (`SCB::sys_reset()` в
# docs/modules/bsp-ota.md) и impl'у critical-section (фича
# `critical-section-single-core` в crates-cross/Cargo.toml).
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
embassy-executor = { workspace = true, features = ["defmt"] }
defmt = { workspace = true }
defmt-rtt = { workspace = true }
# Паникёр по профилю — оба крейта обычные зависимости, выбор делает
# `#[cfg(debug_assertions)]` на `use … as _;` в src/main.rs (Cargo гейтить
# зависимости по профилю не умеет, см. docs/conventions.md). dev: `panic-probe`
# печатает причину через defmt и останавливает ядро `udf()`; release:
# `panic-persist` сохраняет причину в регион PANIC и перезапускает МК. Крейт без
# `use` не линкуется и своего `#[panic_handler]` не регистрирует — поэтому два
# паникёра в манифесте не конфликтуют.
panic-probe = { workspace = true, features = ["print-defmt"] }
panic-persist = { workspace = true }
bsp = { workspace = true }
# Трейты портов: приложение зовёт объекты `Board` только через них, а про
# железо за ними — регион PERSIST, разделы флеша — не знает вовсе.
ports = { workspace = true }
domain = { workspace = true }
shadow-rs = { workspace = true }
# Граф задач в graph.rs — настоящий код, а не пример: `node`, политика
# перезапуска, `spawn_all` в main.rs. На чипах, где граф не помещается (см.
# GRAPH_MIN_PARTITION в chip-select.rhai), он вырезается при генерации, но
# зависимость остаётся: так её версия проверяется сборкой на ARM в любой
# конфигурации.
supervisor = { workspace = true }
# Реализация трейта `HardwareWatchdog` над IWDG живёт в `bsp` (bsp/src/wdg.rs),
# и граф получает оттуда готовый тип. Прямая зависимость здесь ради одного
# имени: наблюдатель за просрочкой узлов (`observe:` в блоке `watchdog:`)
# обязан иметь сигнатуру `fn(&'static str, watchdog::Liveness)`, а `Liveness`
# `supervisor` наружу не реэкспортирует. В проекте без графа наблюдателя нет и
# зависимость не используется — остаётся по той же причине, что и `supervisor`
# выше.
watchdog = { workspace = true }
#
# А вот `embassy-time` нужен прямо: время графа задач — это `Duration`
# (`check_every:`, `watchdog:`, backoff'ы), и транзитивно он сюда не приходит —
# `supervisor` реэкспортирует в своём `__private` только executor, futures,
# sync и sync_request.
embassy-time = { workspace = true }
#
# `embassy-stm32` здесь нет и быть не должно: про чип знает `bsp`, а
# приложение — только про объекты, которые тот отдаёт. Драйвер времени
# (`time-driver-any`) просит оттуда же — см. `bsp/Cargo.toml`, где разобрано,
# почему фича не в воркспейсе.

[build-dependencies]
shadow-rs = { workspace = true, features = ["build", "no_std"] }

# Cortex-M0/M0+ (ARMv6-M — STM32 C0/F0/G0/L0 и CM0+-ядра WB/WL) не имеет
# аппаратного compare-and-swap, и `portable-atomic` на таких целях отказывается
# собирать `compare_exchange`, пока ему не сказали, чем его эмулировать. Здесь,
# а не только в `bsp`: `supervisor` выше — безусловная зависимость `app` (её
# версия проверяется сборкой на ARM в любой конфигурации, см. комментарий у
# неё), и тянет `static_cell` транзитивно через `cloned-cell` независимо от
# OTA и раздела настроек — то есть до этой строки падал даже проект без обоих.
[target.thumbv6m-none-eabi.dependencies]
portable-atomic = { workspace = true, features = ["critical-section"] }
