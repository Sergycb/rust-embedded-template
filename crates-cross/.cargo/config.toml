[build]
target = "{{target}}"

[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "probe-rs run --chip {{chip}}"
rustflags = [
	"-C",
	"target-cpu={{cpu}}",
	"-C",
	"linker=flip-link",
	"-C",
	"link-arg=-Tlink.x",
	# defmt всегда используется (см. docs/conventions.md, "Feature-flag конвенции") —
	# в отличие от прежней схемы с log-only release-профилем, безусловно
	# нужен и в build.rs подставлять его больше незачем.
	"-C",
	"link-arg=-Tdefmt.x",
	"-C",
	"link-arg=--nmagic",
{%- if net_services contains "ssh" %}
	# Своего источника у `getrandom` на `target_os = "none"` нет: бэкенд —
	# `__getrandom_v03_custom` в `bsp/src/rng.rs`, над RNG платы.
	"--cfg",
	'getrandom_backend="custom"',
{%- endif %}
]

# Cortex-M0/M0+ (ARMv6-M — STM32 C0/F0/G0/L0 и CM0+-ядра WB/WL) — единственная
# цель шаблона без аппаратного compare-and-swap (у Cortex-M23 на
# `thumbv8m.base` он есть): `core` даёт там атомики только с `load`/`store`,
# и `portable-atomic`, через который CAS берут `static_cell`, `cloned-cell`
# и слова событий `supervisor`, отказывается собираться, пока ему не сказали,
# чем CAS эмулировать.
#
# Ответ — этот cfg, а не Cargo-фича `critical-section` того же крейта, по двум
# причинам. Первая — цена: под фичей в `critical_section::with` уходит КАЖДАЯ
# операция, включая `load`, а у `supervisor` одна такая на каждый poll цикла
# супервизии (`Events::is_set`); под cfg прерывания маскируются только на
# read-modify-write, `load` остаётся обычной инструкцией — сам `portable-atomic`
# советует ровно это, когда реализация критической секции лишь выключает
# прерывания. Вторая — допущение не новое: `cortex-m` в crates-cross/Cargo.toml
# уже стоит с `critical-section-single-core`, то есть «прерывания выключены —
# значит, никто не вмешается» принято для каждой критической секции прошивки;
# cfg повторяет то же самое для атомиков и ничего сверх не требует. На
# многоядерных чипах (WL) это, как и `critical-section-single-core`, защищает
# только от своего ядра — общее с другим ядром в атомиках держать нельзя ни при
# каком варианте, для этого HSEM.
#
# Здесь, а не фичей в манифестах `app` и `bsp`: rustflags цели доезжают до
# КАЖДОГО крейта, собираемого под неё, включая зависимости и сборку одного `bsp`
# (заготовки `pins --snippet`), тогда как фича включалась бы отдельно в каждом
# члене, которому она нужна транзитивно, и терялась при сборке члена в одиночку.
# Cargo складывает эту секцию с `[target.'cfg(...)']` выше, а не выбирает одну
# из них (проверено `cargo build -v`: у `portable_atomic` в одной команде и
# `target-cpu`, и `flip-link`, и cfg). На остальных целях секция не читается.
[target.thumbv6m-none-eabi]
rustflags = ["--cfg", "portable_atomic_unsafe_assume_single_core"]

[env]
DEFMT_LOG = "info"
{%- if graph == "true" %}
# Аппаратный таймаут сторожа, мкс. Здесь, а не константой в коде, потому что
# у неё есть обоснование и пара — `bsp::wdg::HW_TIMEOUT_US` (там же почему
# цифра такая){% if ota == "true" %}; bootloader берёт её оттуда же{% endif %} (docs/watchdog.md).
WATCHDOG_TIMEOUT_US = "10000000"
{%- endif %}
{%- if ota == "true" %}
# Раскладка flash, посчитанная при генерации (`memory.x` считается теми же
# цифрами). Часть чисел нужна и приложению, и bootloader'у — оба берут их из
# `bsp` (`bsp::flash`{% if ota_store == "external" %}, `bsp::external`{% endif %}), и расходиться им негде (docs/flash.md). Числа лежат здесь, а не линкерными символами: читать
# собственные константы через `unsafe extern` незачем.
{%- if active_len != "" %}
# Размер раздела `ACTIVE` в байтах — самый длинный образ, который доедет до
# устройства (`bsp::layout`).
ACTIVE_LEN = "{{active_len}}"
{%- endif %}
{%- if ota_store == "external" %}
# Страница обмена с внешней флешью: стирание драйвера обязано её делить.
EXT_PAGE_SIZE = "{{ext_page_size | remove: '_'}}"
{%- else %}
{%- if state_erase_size != "" %}
# Страница `BOOTLOADER_STATE` — размер сектора, в котором он лежит.
STATE_ERASE_SIZE = "{{state_erase_size | remove: '_'}}"
{%- endif %}
{%- if swap_paged == "true" %}
# Страница обмена `ACTIVE` и `DFU`, крупнее физической (`ErasePage`).
SWAP_PAGE_SIZE = "{{page_size | remove: '_'}}"
{%- endif %}
{%- endif %}
{%- endif %}
{%- if has_net == "true" %}
# Сокетов в стеке `embassy-net` (`bsp::net`): DHCP-клиент, сетевые транспорты и
# соединения сетевых служб — счёт генерации. Откроете ещё сокет (или включите
# фичу `dns` у `embassy-net` — она тоже занимает слот) — прибавьте один.
NET_SOCKETS = "{{net_stack_sockets}}"
{%- endif %}
{%- if net_services contains "rest" %}
{%- if graph == "true" %}
# Соединений REST API разом — копий пула узлов `HTTP` (`app::net`, пул в
# `app/src/graph.rs`): у каждой свой сокет и свои буферы. Меняете — меняйте и
# литерал пула в графе (DSL не берёт константу) и `NET_SOCKETS` выше.
{%- else %}
# Соединений REST API разом — копий пула задач `HTTP` (`app::net`, пул в
# `app/src/tasks/http.rs`): у каждой свой сокет и свои буферы. Меняете — меняйте
# и `NET_SOCKETS` выше.
{%- endif %}
HTTP_CONNECTIONS = "{{http_connections}}"
{%- endif %}
{%- if dma_nc_start != "" %}
# Регион `DMA_NC` (non-cacheable память под буферы DMA, `bsp::dma_nc`): адрес и
# размер в байтах, как в `memory.x`.
DMA_NC_START = "{{dma_nc_start}}"
DMA_NC_LEN = "{{dma_nc_len}}"
{%- if bdma_nc_start != "" %}
# `SRAM4` целиком — память BDMA (H7).
BDMA_NC_START = "{{bdma_nc_start}}"
BDMA_NC_LEN = "{{bdma_nc_len}}"
{%- endif %}
{%- endif %}
{%- if config_start != "" %}
{%- if config_store == "external" %}
# Границы раздела настроек (`bsp::layout`): смещения от начала внешней флеши.
{%- else %}
# Границы раздела настроек (`bsp::layout`): смещения от базы flash — так их
# ждёт `embassy_stm32::flash::Flash`.
{%- endif %}
CONFIG_START = "{{config_start}}"
CONFIG_END = "{{config_end}}"
{%- endif %}
{%- if ext_flash_end != "" %}
# Конец последнего раздела на внешней флеши, байты: микросхема меньше — не
# годится, `bsp::external` скажет это в лог при старте.
EXT_FLASH_END = "{{ext_flash_end}}"
{%- endif %}
