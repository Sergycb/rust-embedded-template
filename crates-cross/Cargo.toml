[workspace]
# "boot" — только когда OTA-схема embassy-boot помещается в flash выбранного
# чипа (переменная ota из chip-select.rhai). Если нет — каталог crates-cross/boot в
# проект не копируется вовсе (см. [conditional] в cargo-generate.toml), и
# членом workspace ему быть нельзя.
members  = ["app", {% if ota == "true" %}"boot", {% endif %}"bsp", "target-tests"]
# Bootloader собирается только в release и только явно (`cargo build -p boot
# --release`, `cargo flash -p boot --release`): debug-сборки у него нет, поэтому
# голые `cargo build`/`cargo check` его не трогают. Размер зоны bootloader'а
# (порядка 28–32 KiB) рассчитан на release — с подписью debug-сборка в неё не
# влезает.
default-members = ["app", "bsp", "target-tests"]
resolver = "3"

[workspace.package]
version      = "0.1.0"
edition      = "2024"
license      = "MIT"
# Тот же MSRV, что в корневом Cargo.toml — воркспейса два, а тулчейн один.
rust-version = "1.96"

[workspace.lints.rust]
# `#[embedded_test::tests]` генерирует ветку под `cfg(rust_analyzer)`, чтобы IDE
# видела тела тестов как обычный код. Для rustc этот cfg неизвестен, и
# `-D warnings` в `cargo xtask lint cross` превращал бы предупреждение в ошибку.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)"] }
# `warn`, а не `deny`, как в корневом workspace: unsafe в `crates-cross` есть
# и оправдан — прыжок в образ в `boot`, поллинг исполнителя в `app`,
# `app/src/version.rs` (имя символа), бэкенд `getrandom` в `bsp/src/rng.rs` (с ssh)
# (внешний символ и запись по его указателю), регистры option bytes, которых нет
# в `stm32-metapac` (`bsp/src/clocks.rs`, только H723/725/730/733/735). Ровно на
# этих местах стоит `#[expect(unsafe_code)]` с объяснением, и это весь
# unsafe этого воркспейса, который видит clippy (проверено прогоном с
# `-W unsafe_code`, а не перечислением файлов). Вместе с `-D warnings` в
# `cargo xtask lint cross` линт делает новый unsafe ошибкой сборки — то есть
# добавить его можно, только обдумав, и нигде он не спрячется.
unsafe_code = "warn"
# Публичные типы печатаются в логах и в сообщениях `expect`: без `Debug` их
# нечем показать.
missing_debug_implementations = "warn"
# Тело `unsafe fn` не получает unsafe автоматически: каждая небезопасная
# операция внутри оборачивается в явный блок со своим `// SAFETY:`.
unsafe_op_in_unsafe_fn        = "warn"

[workspace.lints.clippy]
all                     = { level = "warn", priority = -1 }
unwrap_used             = "deny"
let_underscore_must_use = "deny"
dbg_macro               = "deny"
todo                    = "warn"
unimplemented           = "warn"
large_stack_arrays      = "warn"
# Каждый `unsafe`-блок обязан объяснять, почему он корректен. Линт нашёл то,
# чего не видел ни один линтер: `executor.poll()` в `app/src/main.rs` шёл без
# `// SAFETY:`, хотя объяснение рядом стояло — на несколько строк выше и без
# префикса, которого ждёт clippy.
undocumented_unsafe_blocks = "warn"
# `pedantic`: приведения без `as`, `# Errors`/`# Panics` в doc, `#[must_use]`.
# Приоритет -1, иначе группа конфликтует с отдельными линтами (clippy
# `lint_groups_priority`). `warn` вместе с `-D warnings` в `cargo xtask lint`
# даёт ошибку сборки, поэтому исключения пишутся точечно:
# `#[expect(lint, reason = "…")]`, а не `#[allow]`.
pedantic                  = { level = "warn", priority = -1 }
# Подавление без причины и мёртвое подавление — тоже долг: `reason` обязателен,
# а `#[expect]` сам падает, когда подавлять уже нечего.
allow_attributes_without_reason = "warn"
# Подмодули — `foo.rs` + `foo/`, а не `foo/mod.rs`.
mod_module_files        = "warn"
# `map_err(|_| …)` теряет причину отказа.
map_err_ignore          = "warn"

[workspace.dependencies]
cortex-m = { version = "0.7.9", features = [
	"critical-section-single-core",
	"inline-asm",
	"linker-plugin-lto",
] }
cortex-m-rt   = { version = "0.7.6" }
defmt         = { version = "1.1.1" }
# `disable-blocking-mode`: запись в RTT никогда не ждёт хоста. `probe-rs`
# при подключении переводит канал в «блокировать при заполнении», и после
# отключения пробника первый же лог, не влезший в буфер, остановил бы
# прошивку навсегда — в поле, под сторожем или без него. Цена — при потоке
# быстрее, чем пробник успевает вычитывать, кадры теряются, а не ждут.
defmt-rtt     = { version = "1.3.0", features = ["disable-blocking-mode"] }
panic-probe   = { version = "1.0.0" }
# `time-driver-any` здесь НЕТ намеренно, и вернуть её сюда нельзя. Фичи
# воркспейса складываются со всем, что просит крейт, а не заменяются им, —
# значит отсюда драйвер времени доставался и `boot`. Тот запускал TIM и
# размаскировал его прерывание, после чего `bl.load()` лишь пишет VTOR и
# прыгает: прерывание таймера (при тике по умолчанию — каждые десятки
# миллисекунд) приходило уже в таблицу векторов приложения, до того как
# обнулён его `.bss` и до его собственной инициализации. Бутлоадеру драйвер
# времени не нужен вовсе — в примере embassy его тоже нет.
#
# Просят его теперь те, кому он и правда нужен: `app` — фичей `bsp/time-driver`
# (про `embassy-stm32` приложение не знает), `target-tests` — сам. `boot`
# зависит от `bsp` без этой фичи и собирается отдельным вызовом cargo.
embassy-stm32 = { version = "0.6.0", features = [
	# Не «за компанию» с остальным defmt в проекте: без этой фичи `Clocks` не
	# реализует `defmt::Format`, а перечислить её поля вручную шаблон не может
	# — их состав генерируется под конкретный чип и различается по семействам.
	# То есть дамп фактических частот в `Board::new` без неё нереализуем.
	# Побочно включаются собственные логи embassy — это плюс, а не цена:
	# строки defmt лежат в отдельной секции ELF и во flash не попадают.
	"defmt",
	"{{chip_feature}}",{% if bank_mode != "" %}
	# У этого чипа stm32-metapac несёт несколько карт памяти, и build.rs
	# embassy-stm32 без явного выбора паникует ("Chip supports single and dual
	# bank configuration"). Значение выставляет chip-select.rhai (BANK_MODE).
	"{{bank_mode}}",{% endif %}
] }
embassy-executor = { version = "0.10.0", features = [
	"platform-cortex-m",
	"executor-thread",
] }
embassy-boot         = { version = "0.7.0" }
embassy-boot-stm32 = { version = "0.8.0" }
# Разделы и асинхронный вид блокирующего флеша (`bsp::flash`, `boot`). Версия
# та же, что тянет embassy-boot.
embassy-embedded-hal = { version = "0.6.0" }
# Один `Flash` на весь чип делится между OTA и настройками, а обеим нужен
# `&'static` (иначе их не отдать в спавнящиеся задачи — те требуют 'static).
static_cell            = { version = "2.1.1" }
{%- if has_usb == "true" %}
# USB-устройство (`bsp::usb`): та же версия, что в корневом Cargo.toml.
embassy-usb            = { version = "0.6.0", default-features = false, features = ["defmt"] }
# Трейт драйвера под `embassy-usb` — им заглушка платы (`bsp::stub`) встаёт в
# слот USB-блока; версия — та, на которой стоят `embassy-usb` 0.6 и `embassy-stm32` 0.6.
embassy-usb-driver     = { version = "0.2.2" }
{%- endif %}
{%- if has_net == "true" %}
# Сетевой стек (`bsp::net`): та же версия и фичи, что в корневом Cargo.toml.
embassy-net            = { version = "0.9.1", features = ["tcp", "udp", "proto-ipv4", "medium-ethernet", "dhcpv4", "defmt"] }
# Трейт драйвера под `embassy-net` — им заглушка платы (`bsp::stub`) встаёт в
# слот Ethernet; версия — та, на которой стоят `embassy-net` 0.9 и `embassy-stm32` 0.6.
embassy-net-driver     = { version = "0.2.0" }
{%- if net_services contains "ssh" %}
# Случайность для криптографии (`bsp::rng` — бэкенд над RNG платы): через
# `getrandom` её берут и крейты, что зовут его сами (`sunset`), и те, что берут
# генератор параметром (`getrandom::SysRng`, фича `sys_rng`). Без фич: своего
# источника на `target_os = "none"` у него нет, бэкенд — `--cfg` в
# `.cargo/config.toml`.
getrandom              = { version = "0.4.3" }
{%- endif %}
{%- endif %}
embassy-sync       = { version = "0.8.0" }
# Трейты `NorFlash` — нужны только `boot/src/external.rs` при `ext_flash=yes`
# (геометрия драйвера внешней флеши в проверках при компиляции). Та же версия,
# что тянет embassy-boot.
embedded-storage   = { version = "0.3.1" }
{%- if has_uart == "true" %}
# Заглушка UART (`bsp::stub::Serial`) — поток байтов, как у `BufferedUart`.
embedded-io-async  = { version = "0.7.0" }
{%- endif %}
# `portable-atomic` здесь не объявлен намеренно: на Cortex-M0/M0+ ему нужно
# сказать, чем эмулировать CAS, и это делает cfg в `.cargo/config.toml`
# (`[target.thumbv6m-none-eabi] rustflags`), а не фича у членов workspace —
# там же разобрано, почему.
# Прямая зависимость нужна target-tests (embassy-stm32 тянет тот же крейт
# транзитивно, но полагаться на это для `use embassy_time::..` нельзя).
# Фича `defmt-timestamp-uptime-ms` ставит время рядом с КАЖДОЙ строкой лога —
# баннером старта, дампом прошлой паники, собственными логами embassy и всем,
# что напишете вы. Без неё в логе видно, что произошло, но не когда: «упал» и
# «упал через 40 мс после старта» — разные диагнозы.
#
# Фича — у бинарников с драйвером времени (`app`, `target-tests`), а не здесь,
# по той же причине, что и `time-driver-any` выше: отметка зовёт
# `Instant::now()`, а у `boot` драйвера нет. `bsp`, от которого он зависит,
# использует `embassy-time`, крейт попадает в образ, и отметка из воркспейса
# требовала бы `_embassy_time_now` — линковка `boot` падает. Без фичи его логи
# идут без отметки (дефолт `defmt.x`), как и прежде.
#
# Крейт определяет `defmt::timestamp!` за нас (embassy-time/src/lib.rs), и
# отсюда ограничение: макрос допускает ровно одно определение на бинарник.
# Захотите свою отметку времени (RTC, счётчик тактов DWT) — сначала уберите
# эту фичу, иначе линковка упадёт на дубле.
#
# Из семи вариантов взяты миллисекунды: секунды слишком грубы для старта, где
# всё интересное укладывается в десятки миллисекунд, а микросекунды дают
# лишние три разряда в каждой строке.
embassy-time       = { version = "0.5.1" }
# default отключён, чтобы состав фич был виден списком, но обе входящие в
# него фичи здесь же и перечислены: `semihosting` — канал, которым тест
# сообщает результат раннеру, `panic-handler` — то, что превращает панику в
# «тест упал» вместо HardFault (подробности — в crates-cross/target-tests/Cargo.toml,
# там же про то, почему в этом бинарнике нет panic-probe). `defmt` — чтобы
# вывод харнесса шёл тем же транспортом, что и логи прошивки.
embedded-test      = { version = "0.7.2", default-features = false, features = [
	"embassy-010",
	"defmt",
	"semihosting",
	"panic-handler",
] }
# Трейты-границы домена и типы ошибок: их реализуют adapters и bsp, а app
# работает только через них. `defmt` — ради `Format` на ошибках в логе.
ports            = { path = "../crates-host/ports", features = ["defmt"] }
# Адаптеры, generic по флешу/шине: OTA поверх embassy-boot, настройки поверх
# sequential-storage. Собирают их узлы над рычагами `bsp`, а `bsp` берёт отсюда
# обёртки, из которых строит рычаги сам (USB, сеть, EEPROM, флеш обновления). `defmt` — ради `Format` на ошибках в логе прошивки; на хосте
# крейт собирается без фич вывода вовсе.
adapters         = { path = "../crates-host/adapters", features = ["defmt"] }
{%- if flash_page == "true" %}
flash-page       = { path = "../crates-host/flash-page" }
{%- endif %}
bsp              = { path = "./bsp" }
# `default-features = false` обязательно: дефолт domain — фича `log` (нужна
# хост-сборке, см. её [features]), а в прошивке используется только defmt.
domain           = { path = "../crates-host/domain", default-features = false, features = [
	"defmt",
] }
shadow-rs        = { version = "2.0.0", default-features = false }
assign-resources = { version = "0.5.0" }

# Крейты из личной библиотеки ({{rust_lib}}) — оба про железо
# и оркестрацию, поэтому объявлены здесь, а не в корневом workspace'е (для
# `domain`).
#
# `supervisor` заменил сразу три сторонних крейта: `embassy-supervisor`
# (упорядоченный старт по графу), `embassy-task-watchdog` (мультиплексор
# watchdog'ов, теперь — блок `watchdog:` в том же макросе) и `ector`
# (actor-паттерн, теперь — поля `inbox:`/`publish:`/`request:` узла). Раньше
# три независимых макро-DSL описывали один и тот же граф задач трижды.
# `watchdog` — no_std-ядро мультиплексора (трейт `HardwareWatchdog`),
# нужно напрямую, чтобы `bsp` мог реализовать эти два трейта над IWDG.
#
# Фичи `defmt` у `supervisor` больше нет: библиотека сама ничего не печатает
# (трассировку rust-lib удалил). Что видно в логе, решает прошивка: ошибку
# `spawn_all` печатает `main.rs`, имя узла, переставшего кормить сторож, перед
# аппаратным сбросом — `before_reset` в `bsp::wdg`, застой и восстановление
# узла — наблюдатель `observe:` в `graph.rs`, исход прогона — тело задачи.
#
# * `metadata-name` — имя узла из DSL попадает в
#   `embassy_executor::Metadata`, то есть в defmt-виды задач и в дампы, где
#   иначе стоял бы непрозрачный идентификатор. Занимает flash: по
#   `&'static str` на узел.
#
# * `local-resources` — ради узлов со слотами `local`: `OTA` (`LINK`, `FLASH`
#   во фрагменте `domain::ota`), `NET` (`RUNNER`), `USB` (`DEVICE`), протокольных
#   узлов (`MODBUS_LINK`...). Эти слоты помечены `local`, потому что держат
#   `!Send`-объекты платы — например, `adapters::ota::Updater` над разделами
#   `bsp::flash` ссылается на `Mutex<NoopRawMutex, …>`, — а обычный
#   слот графа это `static`, которому нужен `Send`. Включена всегда, а не только
#   с OTA: без неё узлы `NET`/`USB`/`MODBUS` не собирались на чипе без OTA.
#   Фича включает `LocalResourceSlot` и снимает у `supervisor`
#   `forbid(unsafe_code)` до `deny` (у слота один документированный
#   `unsafe impl Sync`), а макрос эмитит по `unsafe`-блоку на каждый такой
#   `static` (`LocalResourceSlot::empty()`) в `app`: обязательство «значение
#   живёт на исполнителе, спавнящем граф» лежит в крейте графа, а не в
#   библиотеке. Это то же допущение, что у `NoopRawMutex` в
#   `bsp::flash::FlashMutex`; менять их вместе.
supervisor       = { git = "{{rust_lib}}.git", features = [
	"metadata-name",
	"local-resources",
] }
watchdog         = { git = "{{rust_lib}}.git" }
# Вход команд узла OTA в проекте без графа (`app`, src/main.rs): с графом его
# заводит `supervisor` сам. Тот же git, что у `supervisor`, — один крейт в дереве.
sync-request     = { git = "{{rust_lib}}.git" }
{%- if external_flash == "true" %}

# Драйвер внешней флеши Winbond W25Q (W25Q10..W25Q128) по SPI или QSPI —
# `bsp::external`: асинхронный у приложения (фича `async`), блокирующий у
# bootloader'а (`sync`). Объём — по JEDEC ID при `init`. Своя библиотека
# драйверов, по git; `rev` закреплён: драйвер стоит под данными OTA и
# настройками, и чужое изменение команд микросхемы не должно приехать молча.
w25q             = { git = "https://github.com/Sergycb/hw-drivers.git", rev = "4deb2e145fb5ed135f335b98c97b8bb12af98cc4", default-features = false, features = [
	"nor-flash",
	"defmt",
] }
# `block_on` в `main` приложения: `Board::new` асинхронный (ждёт `init`
# внешней флеши), а исполнитель поднимается позже — вручную, ради `CPU_LOAD`.
embassy-futures  = { version = "0.1.2" }
{%- endif %}

# Причина паники, переживающая сброс: release-паникёр `app`
# (`app/src/panic.rs`) пишет её `report_panic_info` в регион PANIC (посчитан при
# генерации, см. memory.x) и делает `sys_reset`; следующий старт `app` читает её
# и печатает. `custom-panic-handler` снимает собственный `#[panic_handler]`
# крейта — свой нужен, чтобы вдобавок напечатать причину в RTT. `utf8` добавляет
# `get_panic_message_utf8`, без него сообщение читается только байтами.
panic-persist = { version = "0.3.0", features = ["utf8", "custom-panic-handler"] }

# `embassy-usb` подключается выше, только под `interface=usb`, — версия 0.6,
# парная к `embassy-stm32` 0.6. Прежде он стоял запиненным на 0.5 ради
# `defmt-embassy-usbserial` (`#[global_logger]` над USB CDC-ACM), убранного
# вместе с остальными заменёнными зависимостями: 0.5 больше не брать.

[profile.dev]
codegen-units    = 1
debug            = 2
debug-assertions = true
incremental      = false
opt-level        = "s"
overflow-checks  = true
lto              = "fat"

[profile.release]
codegen-units    = 1
debug            = 2
debug-assertions = false
incremental      = false
opt-level        = "s"
overflow-checks  = false
lto              = "fat"

