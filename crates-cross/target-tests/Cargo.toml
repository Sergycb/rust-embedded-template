[package]
name = "target-tests"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

# Свой harness: libtest на устройстве нет, его роль играет `embedded-test`
# на стороне прошивки и `probe-rs run` на стороне хоста.
[[test]]
name = "test"
harness = false

[lints]
workspace = true

[dependencies]
# Транспорт нужен здесь по той же причине, что и в `app`: тестовый бинарник —
# это полноценная прошивка, которую заливают в плату целиком.
#
# А вот `panic-probe` здесь НЕ подключён, в отличие от {% if ota == "true" %}app/boot{% else %}app{% endif %}, и это не
# упущение: паникёр в тестовом бинарнике — это способ сообщить раннеру, что
# тест провалился. `embedded-test` под фичей `panic-handler` (она в его
# default) заканчивает панику через `semihosting::process::abort()`, который
# `probe-rs run` понимает как «этот тест упал» и переходит к следующему;
# `panic-probe` вместо этого делает `udf()`, то есть HardFault, и один
# провалившийся assert обрушил бы весь прогон. Ограничение «ровно один
# `#[panic_handler]`» — на бинарник, а не на workspace: у `app` паникёр свой
# (`panic-probe` в dev, свой поверх `panic-persist` в release, см.
# `app/src/panic.rs`){% if ota == "true" %}, у `boot` — свой, без сообщений, а здесь — третий{% else %}, а здесь — второй{% endif %}.
# Не для собственного использования, а ради impl'а `critical-section`: его
# даёт `cortex-m` с фичей `critical-section-single-core` (см. crates-cross/Cargo.toml),
# и без прямой зависимости фича в дереве зависимостей этой цели не включается. Ошибка при
# этом вылезает только на линковке — `undefined symbol:
# _critical_section_1_0_acquire`, — а `cargo clippy` до неё не доходит, так что
# поймать это можно лишь реальным `cargo xtask test target`.
cortex-m = { workspace = true }
defmt = { workspace = true }
defmt-rtt = { workspace = true }
# Макрос `#[embedded_test::tests]` с фичей `embassy-010` разворачивается в код,
# который обращается к `::embassy_executor` — по имени, из крейта теста, поэтому
# зависимость нужна прямая, транзитивной через embassy-stm32 не хватает.
embassy-executor = { workspace = true }
embedded-test = { workspace = true, features = ["panic-handler"] }
# Отметка времени у строк лога — как у `app` (см. crates-cross/Cargo.toml).
embassy-time = { workspace = true, features = ["defmt-timestamp-uptime-ms"] }
# Только ради драйвера времени — по той же причине, что и у `app`: в
# воркспейсе фичи нет{% if ota == "true" %}, чтобы она не досталась бутлоадеру{% endif %} (см. комментарий в
# crates-cross/Cargo.toml), а тестовый образ линкуется с `embassy-time` и без
# драйвера не соберётся.
embassy-stm32 = { workspace = true, features = ["time-driver-any"] }
# Паникёр у тестов свой (`embedded-test`), `HardFault` — по умолчанию из
# `cortex-m-rt`: обработчик с причиной — у `app` (src/fault.rs).
bsp = { workspace = true }
{%- if ota == "true" or config == "true" %}
# Трейты портов: тесты дёргают объекты `Board` тем же способом, что и `app`
# ({% if ota == "true" %}`FirmwareUpdate` — тесты OTA{% endif %}{% if ota == "true" and config == "true" %}, {% endif %}{% if config == "true" %}`SettingsStorage` — тест настроек{% endif %}).
ports = { workspace = true }
# {% if ota == "true" %}Адаптер обновления{% endif %}{% if ota == "true" and config == "true" %} и хранилище настроек{% elsif config == "true" %}Хранилище настроек{% endif %} над разделами платы — {% if ota == "true" and config == "true" %}их{% else %}его{% endif %} собирает
# приложение, а тест собирает так же ({% if ota == "true" %}`updater`{% endif %}{% if ota == "true" and config == "true" %}, {% endif %}{% if config == "true" %}`settings`{% endif %} в tests/test.rs).
adapters = { workspace = true }
{%- endif %}
{%- if signed == "true" %}
# Проверка версии образа в тесте отката (`domain::ota::update::apply_signed`).
domain = { workspace = true }
{%- endif %}
