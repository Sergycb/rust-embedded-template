[package]
name = "boot"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Не запускать сторож перед прыжком в образ. Нужна тестам на плате: `cargo
# xtask test target` собирает bootloader с ней (`target-tests` кормить сторож не
# умеют); руками — для отладки bootloader'а и раннего старта (docs/watchdog.md).
# Релиз и `cargo xtask build` её не включают.{% if graph != "true" %} Сторожа в
# bootloader'е этого проекта нет вовсе, и фича ничего не меняет.{% endif %}
no-watchdog = []

[[bin]]
name = "boot"
harness = false

[dependencies]
# Boot намеренно не получает release-транспорт defmt (UART без пробника,
# см. docs/modules/app.md): у него нет embassy-executor и
# Spawner'а под фоновую drain-задачу, а единственная диагностическая строка
# перед прыжком в прошивку не стоит того, чтобы тянуть ради неё в bootloader
# целый UART-стек. Здесь только RTT.
defmt-rtt = { workspace = true }
defmt = { workspace = true }
# Точка входа (`#[entry]`).
cortex-m-rt = { workspace = true }
{%- if ota_store == "external" %}
# Задержка на `SysTick` драйвера внешней флеши (src/external.rs).
cortex-m = { workspace = true }
{%- endif %}
# Переключение банков, HAL, общие с приложением константы раскладки и сброс МК
# в паникёре (`bsp::reset`) — из `bsp`, а не копиями. Фичи `time-driver` здесь нет и быть не должно (см.
# `bsp/Cargo.toml`).
bsp = { workspace = true }
embassy-boot-stm32 = { workspace = true, features = ["defmt"] }
{%- if erase_zero == "true" and ota_store != "external" %}
# Прямая зависимость только ради фичи: у этого чипа стёртая страница читается
# нулями, и `embassy-boot` должен ждать 0x00 вместо 0xFF, иначе признак
# «стёрто» читается наоборот. Только при STATE во внутреннем flash: внешняя
# NOR стирается в 0xFF. `embassy-boot-stm32` фичу не пробрасывает; `bsp` её
# тоже включает, но признак, от которого зависит обмен разделов, bootloader
# просит сам, а не через соседа.
embassy-boot = { workspace = true, features = ["flash-erase-zero"] }
{%- endif %}
embassy-stm32 = { workspace = true, features = ["defmt"] }
embassy-sync = { workspace = true }
{%- if boot_partitioned == "true" %}
# Разделы со своей страницей, а не страницей всего чипа
# (`flash_page::ErasePage` поверх `BlockingPartition`, src/main.rs). Тот же
# код, что строит их в приложении (bsp), — расходиться им нельзя.
flash-page = { workspace = true }
{%- endif %}
{%- if ota_store == "external" %}
# Слово записи адаптера OTA приложения (`ports::MAX_WRITE_SIZE`,
# src/external.rs) — предел, под который посчитан журнал `STATE`.
ports = { workspace = true }
{%- endif %}
{%- if boot_partitioned == "true" %}
# Раздел на весь флеш под замком (`BlockingPartition`) — основа разделов со
# своей страницей (`flash_page::ErasePage`, src/main.rs): тот же приём, что в `bsp`.
{%- else %}
# `BlockingPartition` этой конфигурации не нужен: все три раздела bootloader
# строит прямо над `Flash`, и в его коде крейт не назван.
{%- endif %}
embassy-embedded-hal = { workspace = true }
# Решение bootloader'а — проверка нового образа перед обменом
# (`domain::ota::boot::screen_update`, фича `boot` у `domain`); почему `boot` зависит
# от `domain` и что из него попадает в образ — docs/architecture.md. Драйвер
# времени `domain` не включает — см. комментарий к `embassy-stm32` в
# crates-cross/Cargo.toml.
domain = { workspace = true, features = ["boot"] }
{%- if ota_store == "external" %}
# Геометрия драйвера внешней флеши в проверках при компиляции.
embedded-storage = { workspace = true }
# Блокирующий драйвер внешней флеши (src/external.rs) — тот же крейт, что у
# `bsp::external`, с фичей `sync`.
w25q = { workspace = true, features = ["sync"] }
{%- endif %}
