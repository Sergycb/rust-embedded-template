[package]
name = "boot"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "boot"
harness = false

[dependencies]
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
# Boot намеренно не получает release-транспорт defmt (UART без пробника,
# см. crates-cross/app/src/graph.rs): у него нет embassy-executor и
# Spawner'а под фоновую drain-задачу, а единственная диагностическая строка
# перед прыжком в прошивку не стоит того, чтобы тянуть ради неё в bootloader
# целый UART-стек. Здесь только RTT.
defmt-rtt = { workspace = true }
defmt = { workspace = true }
# Паникёр по профилю — то же правило, что у `app` (см. crates-cross/app/Cargo.toml):
# dev — `panic-probe`, release — src/panic.rs поверх `panic-persist`. В release это единственный
# способ узнать, почему bootloader не прыгнул: с `panic-probe` плата стояла
# бы в `udf()` молча (до выключения питания или, в проекте с графом, до сброса
# сторожем), а так причина лежит в PANIC и читается `cargo xtask panic-info`.
panic-probe = { workspace = true, features = ["print-defmt"] }
panic-persist = { workspace = true }
embassy-boot-stm32 = { workspace = true, features = ["defmt"] }
{%- if erase_zero == "true" and ota_store != "external" %}
# Прямая зависимость только ради фичи: у этого чипа стёртая страница читается
# нулями, и `embassy-boot` должен ждать 0x00 вместо 0xFF, иначе признак
# «стёрто» читается наоборот. Только при STATE во внутреннем flash: внешняя
# NOR стирается в 0xFF. `embassy-boot-stm32` фичу не пробрасывает, а
# полагаться на объединение фич с `bsp` нельзя: bootloader собирается своей
# командой (`cargo build -p boot`), где соседних крейтов в графе нет.
embassy-boot = { workspace = true, features = ["flash-erase-zero"] }
{%- endif %}
# `unstable-pac` — ради регистров option bytes в `bsp/src/banks.rs`, который bootloader
# подключает по пути: режим банков обязан быть выставлен до его `Flash::new`.
embassy-stm32 = { workspace = true, features = ["defmt"{% if bank_switch != "" %}, "unstable-pac"{% endif %}] }
embassy-sync = { workspace = true }
# Раздел BOOTLOADER_STATE со страницей своего сектора, а не всего чипа
# (`adapters::flash::Paged` поверх `Shared`, src/main.rs). Тот же код, что
# строит этот раздел в приложении (bsp::ota), — расходиться им нельзя.
{%- if signed == "true" %}
# С подписью — ещё и проверка нового образа перед обменом
# (`adapters::ota::screen_update`, фича `signed`).
adapters = { workspace = true, features = ["signed"] }
{%- else %}
adapters = { workspace = true }
{%- endif %}
{%- if graph == "true" or ota_store == "external" %}
# Обёртка флеша, кормящая сторож во время обмена разделов (`Fed` в src/main.rs),
# и геометрия драйвера внешней флеши в проверках при компиляции.
embedded-storage = { workspace = true }
{%- endif %}
