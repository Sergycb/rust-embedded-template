[package]
name = "bsp"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# Драйвер времени (`time-driver-any`) просит `bsp`, а не `app`: приложение про
# чип не знает вовсе, а этот крейт — единственный, кто с ним работает. В
# воркспейсе фичи нет намеренно: оттуда она доставалась и бутлоадеру, который
# запускал TIM и оставлял его прерывание размаскированным на момент прыжка в
# приложение (см. комментарий в crates-cross/Cargo.toml). `boot` от `bsp` не
# зависит и собирается отдельным вызовом cargo, так что отсюда фича до него не
# доходит.
embassy-stm32 = { workspace = true, features = ["time-driver-any"] }
domain = { workspace = true }
# Трейты, которые реализуют объекты `Board`: приложение видит только их.
ports = { workspace = true }
# Адаптеры поверх generic-флеша и шин: `Board::new` собирает их из периферии
# и кладёт полями. `signed` включает проверку подписи у OTA-адаптера — ровно
# тогда, когда её выбрали при генерации.
adapters = { workspace = true{% if signed == "true" %}, features = ["signed"]{% endif %} }
assign-resources = { workspace = true }
# Регистры ядра напрямую: `wfi` в ожидании сброса от сторожа (src/wdg.rs) и
# impl critical-section (фича в crates-cross/Cargo.toml). Периферию ядра
# (`Peripherals`) `bsp` не забирает: она никому здесь не нужна, а забрав её, он
# лишил бы её приложение — `take()` отдаёт её ровно один раз за запуск.
cortex-m = { workspace = true }
# Общий `Flash` всего чипа: и OTA, и раздел настроек работают через один
# объект под `blocking_mutex` (см. `FlashMutex` в src/board.rs). `static-cell` —
# потому что обеим половинам нужен `&'static`: иначе их нельзя отдать в задачу,
# которую спавнит `Spawner` (аргументы задач обязаны быть 'static).
{%- if ota == "true" or config == "true" %}
embassy-sync = { workspace = true }
static_cell = { workspace = true }
{%- endif %}
# Только ради `ota.rs`, которого в проектах без OTA нет вовсе — вместе с
# `crates-cross/boot` его удаляет chip-select.rhai. Сам адаптер живёт в
# `adapters::ota`; здесь `embassy-boot` нужен ради `from_linkerfile_blocking`
# (разделы из символов memory.x) и фичи `flash-erase-zero`, а
# `embassy-embedded-hal` — ради имени типа раздела в псевдониме `Ota`.
{%- if ota == "true" %}
embassy-boot = { workspace = true, features = ["defmt"{% if erase_zero == "true" %}, "flash-erase-zero"{% endif %}] }
embassy-embedded-hal = { workspace = true }
{%- endif %}
# Zero-copy DMA-буфер: объявлен заранее, чтобы пример из docs/buffers.md
# вставлялся без правки манифеста. Своего кода на нём в шаблоне нет — статику
# под DMA заводит проект, когда доходит до периферии.
bbqueue = { workspace = true }
# Аппаратный сторож под трейт `HardwareWatchdog` (см. src/wdg.rs). Крейт
# объявлен здесь, а не у `app`, потому что реализация трейта — это железо:
# сам `watchdog` про HAL не знает и знать не должен.
watchdog = { workspace = true }
# Только ради `Duration` в сигнатуре того же модуля: время в проекте одно —
# `embassy_time::Duration` (обоснование — в docs/modules/app-graph.md,
# раздел про supervisor: `core::time::Duration` стоил бы вызова
# `__aeabi_uldivmod` на каждой конверсии).
embassy-time = { workspace = true }
# Безусловно, не за фичей: `log` в прошивке не используется вовсе, поэтому
# фичам `defmt`/`log` у bsp (и мосту `defmt-or-log`) выбирать больше не из
# чего — defmt включён в обоих профилях, как в `app` и `boot`.
defmt = { workspace = true }

# Cortex-M0/M0+ (ARMv6-M — STM32 C0/F0/G0/L0 и CM0+-ядра WB/WL) не имеет
# аппаратного compare-and-swap, и `portable-atomic` на таких целях отказывается
# собирать `compare_exchange`, пока ему не сказали, чем его эмулировать. Фича
# `critical-section` — тот самый ответ; реализацию критической секции даёт
# `cortex-m` с `critical-section-single-core`, она включена в crates-cross/Cargo.toml.
#
# Безусловно, как и у `app`: `static_cell` приходит сюда двумя путями — общий
# `Flash` под OTA и раздел настроек просят его напрямую, а `domain` тянет его
# транзитивно (`supervisor` → `cloned-cell`) в любой конфигурации. Условие
# здесь когда-то стояло, пока второго пути не было, и ловилось это не сборкой
# прошивки (там фичи складываются с манифестом `app`), а сборкой одного `bsp`
# — например проверкой заготовок `pins --snippet` в template-check.
[target.thumbv6m-none-eabi.dependencies]
portable-atomic = { workspace = true, features = ["critical-section"] }
