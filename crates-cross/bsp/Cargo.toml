[package]
name = "bsp"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Драйвер времени — фичей, которую включает `app` (`target-tests` просит его у
# `embassy-stm32` сам): приложение про чип не знает, а `bsp` — единственный, кто
# с ним работает. Не безусловно, потому что от `bsp` зависит и `boot`: драйвер
# там запускал бы TIM и оставлял его прерывание размаскированным на момент
# прыжка в приложение (см. комментарий в crates-cross/Cargo.toml). Фичи
# сливаются по всем крейтам одного вызова cargo, поэтому `boot` собирается
# отдельным (`cargo build -p boot --release`, crates-host/xtask/src/firmware.rs).
time-driver = ["embassy-stm32/time-driver-any"]
# Паникёр прошивки (src/panic.rs) — у `app` и `boot`. Фичей, а не безусловно:
# `target-tests` тоже зависит от `bsp`, а паникёр у него свой (`embedded-test`),
# и два `#[panic_handler]` в одном бинарнике не линкуются.
panic-handler = ["dep:panic-probe", "dep:panic-persist"]
# Обработчик `HardFault` с причиной (src/fault.rs) — у `app` и `target-tests`.
# Фичей по той же причине, что и драйвер времени: с LTO он попадает в образ
# всякого, кто линкует `bsp`, и в `boot` занял бы около 14 KiB зоны.
fault-handler = []

[dependencies]
# `unstable-pac` — только там, где `bsp` пишет регистры сам (src/clocks.rs, src/banks.rs —
# option bytes; src/cache.rs — `FLASH_ACR` и `ICACHE`): их нет в API HAL, а сырой адрес
# вместо типизированного регистра `stm32-metapac` ничем не проверялся бы.
embassy-stm32 = { workspace = true, features = [{% if cpu_freq_boost == "true" or bank_switch != "" or cache contains "icen" or cache contains "icache" %}"unstable-pac"{% endif %}] }
{%- if core_baseline != "true" or ota == "true" or config_store == "eeprom" or has_can == "true" %}
# Порты, которые плата реализует сама — у чего нет трейта в `embedded-hal`:{% if core_baseline != "true" %}
# счётчик тактов (`Cycles`, src/cycles.rs);{% endif %}{% if ota == "true" %}
# перезагрузка для узла OTA (`Reboot`, src/cpu.rs);{% endif %}{% if config_store == "eeprom" %}
# доступ к EEPROM (`EepromAccess`, src/settings.rs);{% endif %}{% if has_can == "true" %}
# шина CAN (`CanBus`, заглушка в src/stub.rs);{% endif %}
ports = { workspace = true }
{%- endif %}
{%- if flash_page == "true" %}
# Страница стирания раздела (`ErasePage`){% if ota == "true" and ota_store == "external" %} и страница драйвера внешней флеши
# (`erase_size`, src/external.rs){% endif %} — общая с bootloader'ом.
flash-page = { workspace = true }
{%- endif %}
{%- if has_uart == "true" %}
# Поток байтов заглушки UART (src/stub.rs).
embedded-io-async = { workspace = true }
{%- endif %}
{%- if external_flash == "true" %}
# Драйвер внешней флеши W25Q (src/external.rs): асинхронный — приложению,
# блокирующий — bootloader'у; шину-заглушку (src/stub.rs) оба видят своим
# трейтом, поэтому обе фичи здесь, а не по одной у `app` и `boot`.
w25q = { workspace = true, features = ["sync", "async"] }
{%- endif %}
assign-resources = { workspace = true }
# Регистры ядра напрямую:{% if graph == "true" %} `wfi` в ожидании сброса от сторожа (src/wdg.rs),{% endif %}
# `wfe`, запрет прерываний и сброс для `app` и `boot` (src/cpu.rs) и impl
# critical-section (фича в crates-cross/Cargo.toml).
cortex-m = { workspace = true }
# Рантайм и точка входа: `app` и `boot` берут `#[entry]` отсюда (src/cpu.rs).
cortex-m-rt = { workspace = true }
# Паникёр по профилю (src/panic.rs, фича `panic-handler`) — обе обычные
# зависимости, выбор делает `#[cfg(debug_assertions)]` (Cargo гейтить
# зависимости по профилю не умеет, см. docs/conventions.md). dev: `panic-probe`
# печатает причину через defmt и останавливает ядро `udf()`; release: свой
# `#[panic_handler]` сохраняет причину через `panic-persist` в регион PANIC,
# печатает её и перезапускает МК. `panic-probe` без `use` не линкуется, а
# `panic-persist` собран с `custom-panic-handler` — своего обработчика у него нет.
panic-probe = { workspace = true, features = ["print-defmt"], optional = true }
panic-persist = { workspace = true, optional = true }
# Общий `Flash` всего чипа: и OTA, и раздел настроек работают через один
# объект под `blocking_mutex` (см. `FlashMutex` в src/board.rs).
{%- if shared_flash == "true" or ota == "true" or external_flash == "true" %}
embassy-sync = { workspace = true }
# `BlockingAsync` — асинхронный вид блокирующего флеша под `Partition`,
# `FirmwareUpdater` и `sequential-storage` (src/ota.rs, src/settings.rs); с OTA —
# ещё и имя типа раздела в псевдониме `Ota`.
embassy-embedded-hal = { workspace = true }
{%- endif %}
# `static-cell` — потому что общему флешу нужен `&'static`: иначе его разделы
# нельзя отдать в задачу, которую спавнит `Spawner` (аргументы задач обязаны
# быть 'static).
{%- if shared_flash == "true" or ota == "true" or external_flash == "true" %}
static_cell = { workspace = true }
{%- endif %}
{%- if has_usb == "true" %}
# Трейт USB-драйвера — его реализует заглушка (`bsp::stub::UsbDriver`) и
# драйвер `embassy-stm32`; устройство и классы над ним собирает `app`.
embassy-usb-driver = { workspace = true }
{%- endif %}
{%- if has_net == "true" %}
# Трейт сетевого драйвера — его реализует заглушка (`bsp::stub::NetDevice`) и
# драйвер Ethernet `embassy-stm32`; стек и сокеты над ним собирает `app`.
embassy-net-driver = { workspace = true }
{%- endif %}
# Только ради `ota.rs`, которого в проектах без OTA нет вовсе — вместе с
# `crates-cross/boot` его удаляет chip-select.rhai. Адаптер обновления над
# разделами собирает `app`; здесь `embassy-boot` нужен ради `from_linkerfile`
# (разделы из символов memory.x) и фичи `flash-erase-zero`.
{%- if ota == "true" %}
embassy-boot = { workspace = true, features = ["defmt"{% if erase_zero == "true" and ota_store != "external" %}, "flash-erase-zero"{% endif %}] }
{%- endif %}
{%- if graph == "true" %}
# Аппаратный сторож под трейт `HardwareWatchdog` (см. src/wdg.rs). Крейт
# объявлен здесь, а не у `app`, потому что реализация трейта — это железо:
# сам `watchdog` про HAL не знает и знать не должен.
watchdog = { workspace = true }
{%- endif %}
{%- if graph == "true" or external_flash == "true" %}
# Время в проекте одно — `embassy_time`:{% if graph == "true" %} `Duration` в сигнатуре сторожа
# (src/wdg.rs; `core::time::Duration` стоил бы вызова `__aeabi_uldivmod` на
# каждой конверсии — docs/modules/app-graph.md, раздел про supervisor){% endif %}{% if graph == "true" and external_flash == "true" %};{% endif %}{% if external_flash == "true" %}
# `Delay` асинхронного драйвера внешней флеши (src/external.rs){% endif %}.
embassy-time = { workspace = true }
{%- endif %}
# Безусловно, не за фичей: `log` в прошивке не используется вовсе, поэтому
# фичам `defmt`/`log` у bsp (и мосту `defmt-or-log`) выбирать больше не из
# чего — defmt включён в обоих профилях, как в `app` и `boot`.
defmt = { workspace = true }
