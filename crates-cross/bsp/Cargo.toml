[package]
name = "bsp"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

# Без целей unit-тестов и бенчмарков: им нужен крейт `test`, а его для
# `thumbv*-none-*` нет (E0463), и `cargo clippy --all-targets` — так его зовут
# `cargo xtask lint cross` и rust-analyzer — на `bsp` падал бы всегда.
[lib]
test = false
bench = false

[lints]
workspace = true

[dependencies]
# Порт чипа: плата generic по нему и о самом чипе не знает ничего — ни
# `embassy-stm32`, ни раскладки памяти, ни разделов (src/board.rs).
ports = { workspace = true }
{%- if has_usb == "true" or has_net == "true" %}
# Обёртки над железом без чипа, из которых плата собирает рычаги, — по строке
# на рычаг:
{%- if has_usb == "true" %}
#   USB-устройство с потоком CDC (`adapters_hw::usb`, src/usb.rs)
{%- endif %}
{%- if has_net == "true" %}
#   стек с фоновой работой (`adapters_hw::net::Net`, src/ethernet.rs)
{%- endif %}
adapters-hw = { workspace = true }
{%- endif %}
{%- if has_usb == "true" %}
# Устройство с классом CDC над драйвером чипа — `embassy-usb` (src/usb.rs).
embassy-usb = { workspace = true }
{%- endif %}
{%- if has_net == "true" %}
# Стек над драйвером Ethernet — `embassy-net` (src/ethernet.rs), сокеты на
# стеке открывают узлы.
embassy-net = { workspace = true }
{%- endif %}
{%- if has_usb == "true" or has_net == "true" %}
# `static-cell` — потому что объектам платы нужна память `&'static`:
# {% if has_usb == "true" %}USB-устройству{% endif %}{% if has_usb == "true" and has_net == "true" %}, {% endif %}{% if has_net == "true" %}стеку{% endif %} — иначе их нельзя отдать в задачу, которую
# спавнит `Spawner` (аргументы задач обязаны быть 'static).
static_cell = { workspace = true }
{%- endif %}
# Безусловно, не за фичей: `log` в прошивке не используется вовсе, поэтому
# фичам `defmt`/`log` у bsp (и мосту `defmt-or-log`) выбирать не из
# чего — defmt включён в обоих профилях, как в `app` и `boot`.
defmt = { workspace = true }
