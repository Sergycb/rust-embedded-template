[package]
name = "bsp"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
embassy-stm32 = { workspace = true }
domain = { workspace = true }
# Трейты, которые реализуют объекты `Board`: приложение видит только их.
ports = { workspace = true }
# Драйверы поверх шин (`adapters::Lm75` и ваши собственные): `Board::init`
# собирает их из периферии и кладёт полями. Объявлено заранее, чтобы пример из
# resources.rs собирался без правки манифеста.
adapters = { workspace = true }
# Дамп причины паники: сохраняет его `#[panic_handler]` в `app` (lang item
# привязан к бинарнику и уехать сюда не может), а читает — `Board::last_panic`,
# чтобы приложению не приходилось знать про регион PANIC. Фича
# `custom-panic-handler` (объявлена в crates-cross/Cargo.toml) отключает
# собственный хендлер крейта — иначе он конфликтовал бы и с хендлером `app`, и
# с паникёром `embedded-test` в target-tests.
panic-persist = { workspace = true }
assign-resources = { workspace = true }
# Периферия ядра (DWT, MPU, NVIC, SYST...): её забирает и раздаёт `Board`, см.
# поле `core` в lib.rs. Фичи не нужны никакие — берётся только `Peripherals`.
cortex-m = { workspace = true }
# Общий `Flash` всего чипа: и OTA, и раздел настроек работают через один
# объект под `blocking_mutex` (см. `flash()` в lib.rs). `static-cell` — потому
# что обеим половинам нужен `&'static`: иначе их нельзя отдать в задачу,
# которую спавнит `Spawner` (аргументы задач обязаны быть 'static).
{%- if ota == "true" or config == "true" %}
embassy-sync = { workspace = true }
static_cell = { workspace = true }
# Блокирующие трейты флеша: ими пользуется и embassy-boot (ota.rs), и обёртка
# `SharedFlash` (config.rs), которая поверх них реализует асинхронные.
embedded-storage = { workspace = true }
{%- endif %}
# Только ради `ota.rs`, которого в проектах без OTA нет вовсе — вместе с
# `crates-cross/boot` его удаляет chip-select.rhai.
{%- if ota == "true" and signed == "true" %}
# С подписью: фича `ed25519-salty` включает у embassy-boot
# `verify_and_mark_updated`, а сам `salty` объявлен здесь же ради своей фичи
# `slow-motion` (обоснование — в crates-cross/Cargo.toml).
embassy-boot = { workspace = true, features = ["defmt", "ed25519-salty"] }
embassy-boot-stm32 = { workspace = true, features = ["defmt"] }
salty = { workspace = true }
{%- endif %}
{%- if ota == "true" and signed != "true" %}
embassy-boot = { workspace = true, features = ["defmt"] }
embassy-boot-stm32 = { workspace = true, features = ["defmt"] }
{%- endif %}
# Ради `config.rs` — его тоже удаляет chip-select.rhai, если раздел настроек
# не выбран при генерации или не помещается во flash чипа.
{%- if config == "true" %}
sequential-storage = { workspace = true }
embedded-storage-async = { workspace = true }
{%- endif %}
bbqueue = { workspace = true }
# Аппаратный сторож под трейт `HardwareWatchdog` (см. src/wdg.rs). Крейт
# объявлен здесь, а не у `app`, потому что реализация трейта — это железо:
# сам `watchdog` про HAL не знает и знать не должен.
watchdog = { workspace = true }
# Только ради `Duration` в сигнатуре того же модуля: время в проекте одно —
# `embassy_time::Duration` (обоснование — в crates-cross/app/src/task_orchestration.rs,
# раздел про supervisor: `core::time::Duration` стоил бы вызова
# `__aeabi_uldivmod` на каждой конверсии).
embassy-time = { workspace = true }
# Безусловно, не за фичей: `log` в прошивке не используется вовсе, поэтому
# фичам `defmt`/`log` у bsp (и мосту `defmt-or-log`) выбирать больше не из
# чего — defmt включён в обоих профилях, как в `app` и `boot`.
defmt = { workspace = true }
