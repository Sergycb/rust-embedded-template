[package]
name = "bsp"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# Драйвер времени (`time-driver-any`) просит `bsp`, а не `app`: приложение про
# чип не знает вовсе, а этот крейт — единственный, кто с ним работает. В
# воркспейсе фичи нет намеренно: оттуда она доставалась и бутлоадеру, который
# запускал TIM и оставлял его прерывание размаскированным на момент прыжка в
# приложение (см. комментарий в crates-cross/Cargo.toml). `boot` от `bsp` не
# зависит и собирается отдельным вызовом cargo, так что отсюда фича до него не
# доходит.
#
# `unstable-pac` — только там, где `bsp` пишет option bytes сам (src/clocks.rs, src/banks.rs):
# регистров FLASH для этого нет в API HAL, а сырой адрес вместо типизированного
# регистра `stm32-metapac` ничем не проверялся бы.
embassy-stm32 = { workspace = true, features = ["time-driver-any"{% if cpu_freq_boost == "true" or bank_switch != "" %}, "unstable-pac"{% endif %}] }
{%- if ota == "true" or interface == "can" %}
# Трейты портов, которые `bsp` реализует сам: канал доставки образа
# (`bsp::ota`) и шина CAN поверх контроллера чипа (`bsp::can::Bus`). Без них
# `bsp` портов не называет: настройки реализуют свой порт в `adapters`.
ports = { workspace = true }
{%- endif %}
# Адаптеры поверх generic-флеша и шин: `Board::new` собирает их из периферии
# и кладёт полями. Проверку подписи (`signed`) плата не включает: подпись
# проверяет bootloader (crates-cross/boot), версию задаёт приложение.
adapters = { workspace = true }
assign-resources = { workspace = true }
# Регистры ядра напрямую: `wfi` в ожидании сброса от сторожа (src/wdg.rs) и
# impl critical-section (фича в crates-cross/Cargo.toml). Периферию ядра
# (`Peripherals`) `bsp` не забирает: она никому здесь не нужна, а забрав её, он
# лишил бы её приложение — `take()` отдаёт её ровно один раз за запуск.
cortex-m = { workspace = true }
# Общий `Flash` всего чипа: и OTA, и раздел настроек работают через один
# объект под `blocking_mutex` (см. `FlashMutex` в src/board.rs).
{%- if shared_flash == "true" or ota == "true" %}
embassy-sync = { workspace = true }
{%- endif %}
# `static-cell` — потому что общему флешу, сети и USB нужен `&'static`: иначе их
# нельзя отдать в задачу, которую спавнит `Spawner` (аргументы задач обязаны
# быть 'static).
{%- if shared_flash == "true" or ota == "true" or interface == "tcp" or interface == "udp" or interface == "usb" %}
static_cell = { workspace = true }
{%- endif %}
{%- if interface == "usb" %}
# USB-устройство над USB-блоком платы (`bsp::usb`); заглушка и поток CDC — в
# `adapters::usb`.
embassy-usb = { workspace = true }
{%- endif %}
{%- if interface == "tcp" or interface == "udp" %}
# Стек над Ethernet платы (`bsp::net`); сокеты и заглушка — в `adapters::net`.
embassy-net = { workspace = true }
{%- endif %}
# Только ради `ota.rs`, которого в проектах без OTA нет вовсе — вместе с
# `crates-cross/boot` его удаляет chip-select.rhai. Сам адаптер живёт в
# `adapters::ota`; здесь `embassy-boot` нужен ради `from_linkerfile`
# (разделы из символов memory.x) и фичи `flash-erase-zero`, а
# `embassy-embedded-hal` — ради имени типа раздела в псевдониме `Ota`.
{%- if ota == "true" %}
embassy-boot = { workspace = true, features = ["defmt"{% if erase_zero == "true" and ota_store != "external" %}, "flash-erase-zero"{% endif %}] }
embassy-embedded-hal = { workspace = true }
{%- endif %}
# Аппаратный сторож под трейт `HardwareWatchdog` (см. src/wdg.rs). Крейт
# объявлен здесь, а не у `app`, потому что реализация трейта — это железо:
# сам `watchdog` про HAL не знает и знать не должен.
watchdog = { workspace = true }
# Только ради `Duration` в сигнатуре того же модуля: время в проекте одно —
# `embassy_time::Duration` (обоснование — в docs/modules/app-graph.md,
# раздел про supervisor: `core::time::Duration` стоил бы вызова
# `__aeabi_uldivmod` на каждой конверсии).
embassy-time = { workspace = true }
# Безусловно, не за фичей: `log` в прошивке не используется вовсе, поэтому
# фичам `defmt`/`log` у bsp (и мосту `defmt-or-log`) выбирать больше не из
# чего — defmt включён в обоих профилях, как в `app` и `boot`.
defmt = { workspace = true }
