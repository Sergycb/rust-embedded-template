[package]
name = "bsp"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Драйвер времени — фичей, которую включает `app` (`target-tests` просит его у
# `embassy-stm32` сам): приложение про чип не знает, а `bsp` — единственный, кто
# с ним работает.{% if ota == "true" %} Не безусловно, потому что от `bsp` зависит и `boot`: драйвер
# там запускал бы TIM и оставлял его прерывание размаскированным на момент
# прыжка в приложение (см. комментарий в crates-cross/Cargo.toml). Фичи
# сливаются по всем крейтам одного вызова cargo, поэтому `boot` собирается
# отдельным (`cargo build -p boot --release`, crates-host/xtask/src/firmware.rs).{% endif %}
time-driver = ["embassy-stm32/time-driver-any"]

[dependencies]
# `unstable-pac` — только там, где `bsp` пишет регистры сам (src/clocks.rs, src/banks.rs —
# option bytes; src/cache.rs — `FLASH_ACR` и `ICACHE`): их нет в API HAL, а сырой адрес
# вместо типизированного регистра `stm32-metapac` ничем не проверялся бы.
embassy-stm32 = { workspace = true, features = [{% if cpu_freq_boost == "true" or bank_switch != "" or cache contains "icen" or cache contains "icache" %}"unstable-pac"{% endif %}] }
{%- if has_usb == "true" or has_net == "true" or config_store == "eeprom" or ota == "true" %}
# Обёртки, из которых плата собирает свои рычаги, — по строке на рычаг:
{%- if ota == "true" %}
#   флеш под обновлением (`adapters::ota::Linked`, src/flash.rs{% if ota_store == "external" %}, src/external.rs{% endif %})
{%- endif %}
{%- if config_store == "eeprom" %}
#   EEPROM как `NorFlash` (`adapters::eeprom::Eeprom`, src/flash.rs)
{%- endif %}
{%- if has_usb == "true" %}
#   USB-устройство с потоком CDC (`adapters::usb`, src/usb.rs)
{%- endif %}
{%- if has_net == "true" %}
#   стек с фоновой работой (`adapters::net::Net`, src/net.rs)
{%- endif %}
{%- if has_usb == "true" or has_net == "true" %}
{%- if has_usb == "true" and has_net == "true" %}
# Классы USB регистрируются до постройки устройства, а стек и его фон рождает
# один `embassy_net::new`, поэтому эти пары собирает плата.
{%- elsif has_usb == "true" %}
# Классы USB регистрируются до постройки устройства, поэтому эту пару собирает
# плата.
{%- else %}
# Стек и его фон рождает один `embassy_net::new`, поэтому эту пару собирает
# плата.
{%- endif %}
{%- endif %}
adapters = { workspace = true }
{%- endif %}
{%- if core_baseline != "true" or ota == "true" or config_store == "eeprom" or has_can == "true" %}
# Порты, которые плата реализует сама — у чего нет трейта в `embedded-hal`:{% if core_baseline != "true" %}
# счётчик тактов (`Cycles`, src/cycles.rs);{% endif %}{% if ota == "true" %}
# перезагрузка для узла OTA (`Reboot`, src/reset.rs);{% endif %}{% if config_store == "eeprom" %}
# доступ к EEPROM (`EepromAccess`, src/flash.rs);{% endif %}{% if has_can == "true" %}
# шина CAN (`CanBus`, заглушка в src/stub.rs);{% endif %}
ports = { workspace = true }
{%- endif %}
{%- if flash_page == "true" %}
# Страница стирания раздела (`ErasePage`){% if ota == "true" and ota_store == "external" %} и страница драйвера внешней флеши
# (`erase_size`, src/external.rs){% endif %}{% if ota == "true" %} — общая с bootloader'ом{% endif %}.
flash-page = { workspace = true }
{%- endif %}
{%- if has_uart == "true" %}
# Поток байтов заглушки UART (src/stub.rs).
embedded-io-async = { workspace = true }
{%- endif %}
{%- if external_flash == "true" %}
{%- if ota == "true" and ota_store == "external" %}
# Драйвер внешней флеши W25Q (src/external.rs): асинхронный — приложению,
# блокирующий — bootloader'у; шину-заглушку (src/stub.rs) оба видят своим
# трейтом, поэтому обе фичи здесь, а не по одной у `app` и `boot`.
{%- else %}
# Драйвер внешней флеши W25Q (src/external.rs).
{%- endif %}
w25q = { workspace = true, features = ["sync", "async"] }
{%- endif %}
assign-resources = { workspace = true }
# Регистры ядра, которые настраивает плата: кэши и MPU (src/cache.rs,
# src/dma_nc.rs), сброс (src/reset.rs){% if graph == "true" %}, `wfi` в ожидании сброса от сторожа
# (src/wdg.rs){% endif %}{% if core_baseline != "true" %}, счётчик тактов (src/cycles.rs){% endif %}.
cortex-m = { workspace = true }
{%- if shared_flash == "true" or ota == "true" or external_flash == "true" %}
{%- if shared_flash == "true" %}
# Общий `Flash` всего чипа — один объект под `blocking_mutex` (`FlashMutex` в
# src/flash.rs){% if ota == "true" and ota_store != "external" and config_store != "none" and config_store != "external" %}: через него работают и OTA, и настройки{% endif %}.
{%- else %}
# Мьютексы носителей на внешней флеши (src/external.rs).
{%- endif %}
embassy-sync = { workspace = true }
# Адаптеры флеша (`BlockingAsync`, `BlockingPartition`, `Partition`) — носители и
# разделы, которые нарезает плата (src/flash.rs{% if external_flash == "true" %}, src/external.rs{% endif %}).
embassy-embedded-hal = { workspace = true }
{%- endif %}
# `static-cell` — потому что объектам платы нужна память `&'static`: общему
# флешу и его разделам, USB-устройству и стеку — иначе их нельзя отдать в
# задачу, которую спавнит `Spawner` (аргументы задач обязаны быть 'static).
{%- if shared_flash == "true" or ota == "true" or external_flash == "true" or has_usb == "true" or has_net == "true" %}
static_cell = { workspace = true }
{%- endif %}
{%- if has_usb == "true" %}
# Трейт USB-драйвера — его реализует заглушка (`bsp::stub::UsbDriver`) и
# драйвер `embassy-stm32`; устройство с классом CDC над ним — `embassy-usb`
# (src/usb.rs).
embassy-usb-driver = { workspace = true }
embassy-usb = { workspace = true }
{%- endif %}
{%- if has_net == "true" %}
# Трейт сетевого драйвера — его реализует заглушка (`bsp::stub::NetDevice`) и
# драйвер Ethernet `embassy-stm32`; стек над ним — `embassy-net` (src/net.rs),
# сокеты на стеке открывают узлы.
embassy-net-driver = { workspace = true }
embassy-net = { workspace = true }
{%- endif %}
{%- if net_services contains "ssh" %}
# Бэкенд `getrandom` над RNG платы (src/rng.rs): случайность для криптографии
# проекта — и крейтов, что зовут `getrandom` сами, и тех, что берут генератор
# параметром (`getrandom::SysRng`). Мьютекс генератора — `embassy-sync`.
getrandom = { workspace = true }
{%- if shared_flash != "true" and ota != "true" and external_flash != "true" %}
embassy-sync = { workspace = true }
{%- endif %}
{%- endif %}
{%- if ota == "true" and erase_zero == "true" and ota_store != "external" %}
# Прямая зависимость только ради фичи — свойства этого чипа: стёртая страница
# читается нулями, и `embassy-boot` в адаптере обновления (`adapters::ota`) должен
# ждать 0x00 вместо 0xFF. Отсюда она достаётся всем, кто линкует `bsp`, — `app` и
# `target-tests`; bootloader просит её сам (crates-cross/boot).
embassy-boot = { workspace = true, features = ["flash-erase-zero"] }
{%- endif %}
{%- if graph == "true" %}
# Аппаратный сторож под трейт `HardwareWatchdog` (см. src/wdg.rs). Крейт
# объявлен здесь, а не у `app`, потому что реализация трейта — это железо:
# сам `watchdog` про HAL не знает и знать не должен.
watchdog = { workspace = true }
{%- endif %}
{%- if graph == "true" or external_flash == "true" %}
# Время в проекте одно — `embassy_time`:{% if graph == "true" %} `Duration` в сигнатуре сторожа
# (src/wdg.rs; `core::time::Duration` стоил бы вызова `__aeabi_uldivmod` на
# каждой конверсии — docs/modules/app-graph.md, раздел про supervisor){% endif %}{% if graph == "true" and external_flash == "true" %};{% endif %}{% if external_flash == "true" %}
# `Delay` асинхронного драйвера внешней флеши (src/external.rs){% endif %}.
embassy-time = { workspace = true }
{%- endif %}
# Безусловно, не за фичей: `log` в прошивке не используется вовсе, поэтому
# фичам `defmt`/`log` у bsp (и мосту `defmt-or-log`) выбирать больше не из
# чего — defmt включён в обоих профилях, как в `app` и `boot`.
defmt = { workspace = true }
