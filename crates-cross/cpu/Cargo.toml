[package]
name = "cpu"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

# Без целей unit-тестов и бенчмарков: им нужен крейт `test`, а его для
# `thumbv*-none-*` нет (E0463), и `cargo clippy --all-targets` — так его зовут
# `cargo xtask lint cross` и rust-analyzer — на `cpu` падал бы всегда.
[lib]
test = false
bench = false

[lints]
workspace = true

[features]
# Драйвер времени — фичей, которую включает `app` (`target-tests` просит его у
# `embassy-stm32` сам): приложение про чип не знает, а `cpu` — единственный, кто
# с ним работает.{% if ota == "true" %} Не безусловно, потому что от `cpu` зависит и `boot`: драйвер
# там запускал бы TIM и оставлял его прерывание размаскированным на момент
# прыжка в приложение (см. комментарий в crates-cross/Cargo.toml). Фичи
# сливаются по всем крейтам одного вызова cargo, поэтому `boot` собирается
# отдельным (`cargo build -p boot --release`, crates-host/xtask/src/firmware.rs).{% endif %}
time-driver = ["embassy-stm32/time-driver-any"]

[dependencies]
# `unstable-pac` — там, где `cpu` читает и пишет регистры сам (src/system.rs — флаги
# сброса `RCC`{% if bank_switch != "" or cpu_freq_boost == "true" %}; src/{% if cpu_freq_boost == "true" %}clocks.rs{% if bank_switch != "" %}, src/{% endif %}{% endif %}{% if bank_switch != "" %}banks.rs{% endif %} — option bytes{% endif %}{% if cache contains "icen" or cache contains "icache" %};
# src/cache.rs — `FLASH_ACR` и `ICACHE`{% endif %}{% if graph == "true" and dbgmcu_freeze != "" %};
# src/wdg.rs — заморозка IWDG в `DBGMCU`{% endif %}): их нет в API HAL, а сырой адрес вместо
# типизированного регистра `stm32-metapac` ничем не проверялся бы.
embassy-stm32 = { workspace = true, features = ["unstable-pac"] }
{%- if config_store == "eeprom" or has_usb == "true" or has_net == "true" %}
# Обёртки над железом, из которых `cpu` собирает свои рычаги, — по строке на рычаг:
{%- if config_store == "eeprom" %}
#   EEPROM как `NorFlash` (`adapters_hw::eeprom::Eeprom`, src/eeprom.rs)
{%- endif %}
{%- if has_usb == "true" %}
#   драйвер-заглушка до USB-блока (`adapters_hw::usb::stub`, src/usb.rs)
{%- endif %}
{%- if has_net == "true" %}
#   устройство-заглушка до Ethernet (`adapters_hw::net::stub`, src/eth.rs)
{%- endif %}
adapters-hw = { workspace = true }
{%- endif %}
# Порт чипа (`Reboot` у системы{% if has_can == "true" %}, `CanBus` у шины CAN{% endif %}) — то, что
# `cpu` реализует.
ports = { workspace = true }
{%- if has_uart == "true" %}
# Поток байтов заглушки UART (src/com.rs).
embedded-io-async = { workspace = true }
{%- endif %}
{%- if external_flash == "true" %}
# Драйвер внешней флеши W25Q (src/external.rs): блокирующий — им пользуются и
# приложение, и bootloader; шину-заглушку (src/external.rs) оба видят своим
# трейтом, поэтому обе фичи здесь.
w25q = { workspace = true, features = ["sync", "async"] }
{%- endif %}
assign-resources = { workspace = true }
# Периферия ядра, которой распоряжается `cpu`: {% if cache != "" %}кэши{% if dma_nc == "true" %} и MPU{% endif %} (src/cache.rs{% if dma_nc == "true" %},
# src/dma_nc.rs{% endif %}), {% endif %}сброс (src/system.rs){% if graph == "true" %}, `wfi` в ожидании сброса от сторожа
# (src/wdg.rs){% endif %}{% if external_flash == "true" %}, `Delay` на SysTick для драйвера внешней флеши
# (src/external.rs){% endif %}.
cortex-m = { workspace = true }
# Мьютексы флеша (src/flash.rs), внешней флеши (src/external.rs){% if graph == "true" %}, сторожа
# (src/wdg.rs){% endif %}: объекты живут в `static`, а делят их задачи одного исполнителя.
embassy-sync = { workspace = true }
# Память `&'static` под статики `cpu` — общий флеш, внешнюю флешь.
static_cell = { workspace = true }
{%- if cache contains "scb_d" or cache contains "icache" or cache contains "dcen" or config_store == "eeprom" or external_flash == "true" %}
# {% if config_store == "eeprom" %}Трейт `Storage` — доступ к EEPROM под обёрткой `adapters_hw::eeprom::Eeprom`
# (`EepromFlash` в src/eeprom.rs){% else %}Трейты `NorFlash` — обёртка флеша чипа, сбрасывающая кэш после стирания и
# записи (`Coherent` в src/cache.rs){% endif %}{% if external_flash == "true" %},
# `NorFlash` у состояния драйвера внешней флеши (src/external.rs){% endif %}.
embedded-storage = { workspace = true }
{%- endif %}
{%- if net_services contains "ssh" %}
# Бэкенд `getrandom` над RNG (src/rng.rs): случайность для криптографии проекта —
# и крейтов, что зовут `getrandom` сами, и тех, что берут генератор параметром
# (`getrandom::SysRng`).
getrandom = { workspace = true }
{%- endif %}
{%- if ota == "true" and erase_zero == "true" and ota_store != "external" %}
# Прямая зависимость только ради фичи — свойства этого чипа: стёртая страница
# читается нулями, и `embassy-boot` в адаптере обновления (`domain::ota::Updater`,
# его строит `app`) должен ждать 0x00 вместо 0xFF. Отсюда она достаётся всем,
# кто линкует `cpu`, — `app` и `target-tests`; bootloader просит её сам
# (crates-cross/boot).
embassy-boot = { workspace = true, features = ["flash-erase-zero"] }
{%- endif %}
{%- if graph == "true" %}
# Аппаратный сторож под трейт `HardwareWatchdog` (см. src/wdg.rs). Крейт
# объявлен здесь, а не у `app`, потому что реализация трейта — это железо:
# сам `watchdog` про HAL не знает и знать не должен.
watchdog = { workspace = true }
# `Duration` в сигнатуре сторожа (src/wdg.rs; `core::time::Duration` стоил бы
# вызова `__aeabi_uldivmod` на каждой конверсии — docs/modules/app-graph.md,
# раздел про supervisor).
embassy-time = { workspace = true }
{%- endif %}
# Безусловно, не за фичей: `log` в прошивке не используется вовсе, поэтому
# фичам `defmt`/`log` у cpu (и мосту `defmt-or-log`) выбирать не из
# чего — defmt включён в обоих профилях, как в `app` и `boot`.
defmt = { workspace = true }
