[template]
cargo_generate_version = ">=0.19.0"
# CLAUDE.md документирует плейсхолдеры вида `{{chip}}` как буквальный текст
# (не для подстановки) — Liquid-парсер cargo-generate иначе падает на них
# с "invalid syntax". `exclude` только отключает Liquid-подстановку, файл
# всё равно копируется в сгенерированный проект (так и задумано для
# CLAUDE.md).
#
# chip-data-gen — инструмент обслуживания шаблона (перегенерирует список
# чипов в chip-select.rhai) — в проекты пользователей шаблона попадать не
# должен, поэтому в `ignore` (не копируется вовсе), а не в `exclude` (тот
# лишь отключил бы подстановку, но файл всё равно скопировался бы — и упал
# бы с "invalid syntax" на буквальном `{{chip_feature}}` в своём исходнике).
# Без глоба `/**` — со звёздочками cargo-generate директорию не распознаёт,
# нужно имя каталога как есть (проверено эмпирически).
exclude = ["CLAUDE.md"]
ignore = ["chip-data-gen"]

[placeholders]
# chip/chip_feature/cpu/target/write_size здесь не объявлены: их выставляет
# pre-хук chip-select.rhai (каскадный выбор STM32; write_size — только когда
# для чипа посчитан memory.x, см. MEMORY_LAYOUT там же) — см. CLAUDE.md,
# раздел "Плейсхолдеры шаблона". `variable::set` в hook работает независимо
# от объявления в [placeholders], а `--define chip_feature=...`/
# `--define write_size=...` по-прежнему читаются внутри hook через
# `variable::is_set`/`variable::get`.
ci = { type = "string", prompt = "CI provider", choices = [
	"github",
	"gitlab",
	"none",
], default = "github" }

[conditional.'ci != "github"']
ignore = [".github/workflows/ci.yml", ".github/dependabot.yml"]

[conditional.'ci != "gitlab"']
ignore = [".gitlab-ci.yml", "renovate.json"]

[hooks]
pre = ["chip-select.rhai"]
post = ["post-script.rhai"]
