[template]
cargo_generate_version = ">=0.19.0"
# `exclude` — копируется без Liquid-подстановки (CLAUDE.md), `ignore` — не
# копируется вовсе (MAINTAINING.md, chip-data-gen); каталог — по имени, без
# глоба `/**`. Почему что куда — MAINTAINING.md, «Что здесь есть, чего нет в
# проектах пользователей» и «Плейсхолдеры шаблона».
exclude = ["CLAUDE.md"]
# "target"/"crates-cross/target" — сборочный кэш (см. .gitignore), не источник
# шаблона; без исключения `cargo generate` падает с "Substitution skipped,
# found invalid syntax", пытаясь Liquid-рендерить бинарные файлы внутри
# него, если он присутствует локально у того, кто генерирует (обычное
# состояние для мейнтейнера, собиравшего репозиторий перед тестом каскада).
# `.local`/`.remember` — рабочие каталоги инструментов мейнтейнера. В git их
# нет, но `cargo generate --path .` копирует рабочее дерево целиком, вместе с
# неотслеживаемыми файлами. `.claude` в этот список больше не входит целиком:
# `.claude/rules` — под git, это правила по путям для проекта, который
# получится (а не инструмент мейнтейнера), и обязан доехать. Рабочие файлы
# Claude Code внутри `.claude` (неотслеживаемые) перечислены ниже поимённо —
# ровно затем, чтобы не унести заодно и rules.
ignore = [
	"chip-data-gen",
	# Таблицы чипов, которые pre-хук подключает через `import`. Нужны только
	# хуку, и `import` находит их и под `ignore` (проверено эмпирически), а в
	# проекте они были бы 3.4 МБ мёртвого груза. `.tmp`/`.old` — следы
	# прерванного прогона chip-data-gen (см. `write_data_dir`).
	"chip-data",
	"chip-data.tmp",
	"chip-data.old",
	# Lock-файлы проект считает сам первой сборкой: их состав зависит от
	# ответов при генерации (протокол уносит или приносит целые крейты —
	# `crates-host/proto`, `crates-host/canopen`), и шаблонный lock подходил бы
	# одному сочетанию, а остальным ронял бы `cargo fetch --locked` в CI.
	"Cargo.lock",
	"crates-host/chip-info/Cargo.lock",
	"MAINTAINING.md",
	# CI самого репозитория шаблона. Лежит рядом с `ci.yml`, который в проекты
	# как раз копируется, поэтому исключается поимённо: `[conditional]` ниже
	# убирает `.github` целиком и только когда выбран не GitHub.
	".github/workflows/template.yml",
	"target",
	"crates-cross/target",
	"crates-host/chip-info/target",
	".local",
	".remember",
	# Рабочие файлы Claude Code — не источник шаблона, а состояние конкретной
	# машины мейнтейнера (расписания, реестр агентов, воркчаты, блокировки).
	# В git их нет, но `cargo generate --path .` копирует рабочее дерево
	# целиком, вместе с ними. Поимённо, а не каталогом `.claude` целиком —
	# иначе уехал бы и `.claude/rules` (см. комментарий выше). Список ориентирован
	# на `.git/info/exclude` (раздел `claude-code-runtime`), но не совпадает с ним
	# дословно: `settings.local.json` там не перечислен, а `.claude/routines` здесь
	# взят целиком — шире, чем `routines/.state/` там.
	".claude/settings.local.json",
	".claude/scheduled_tasks.lock",
	".claude/scheduled_tasks.json",
	".claude/routines",
	".claude/worktrees",
	".claude/checkpoints",
	".claude/mailbox",
	".claude/agent-registry.json",
	".claude/agent-memory-local",
	".claude/first-run",
	".claude/assistant-daemon-state.json",
	# Рабочие файлы agent-manager того же образца, что и `.claude` выше: воркчаты
	# клонов репозитория, планы и состояние сессии лежат в `.kilo` и под git их
	# нет. В воркчатах лежит целый checkout шаблона, поэтому Liquid из
	# MAINTAINING.md и chip-select.rhai в нём — уже отрендеренный, и cargo-generate
	# спотыкался бы о нём дважды: сначала на файлах воркчата, а после падения
	# `template-check` не проверял бы шаблон вообще. Перечислены поимённо (как
	# `.claude`), а не каталогом целиком — на месте возможных `.kilo/command` и
	# `.kilo/agent`, которым в сгенерированном проекте самое место.
	".kilo/worktrees",
	".kilo/plans",
	".kilo/agent-manager.json",
	# Рабочий каталог skill'ов superpowers (брифы задач, отчёты, леджер): в git
	# его нет, а в брифах лежат куски Liquid из плана — попади они в копию
	# шаблона, cargo-generate попытался бы их отрендерить.
	".superpowers",
	# Спеки и планы мейнтейнера (docs/superpowers/{specs,plans}): они под git,
	# но описывают сопровождение шаблона, а не проект, и цитируют Liquid из
	# файлов cross — та же причина, что у `.superpowers` строкой выше.
	"docs/superpowers",
	# Не наш файл: crashpad-лог, который роняет в корень репозитория редактор.
	# В git его нет, но `cargo generate --path .` копирует рабочее дерево
	# целиком, вместе с неотслеживаемым мусором, — и он уезжал в каждый
	# сгенерированный проект.
	"debug.log",
	# Отчёт о покрытии для Coverage Gutters (задача `coverage: lcov`) — та же
	# причина: неотслеживаемый файл в корне, а копирует его `--path .`.
	"lcov.info",
]

[placeholders]
# chip/chip_feature/cpu/target/write_size здесь не объявлены: их выставляет
# pre-хук chip-select.rhai — MAINTAINING.md, «Плейсхолдеры шаблона».
ci = { type = "string", prompt = "CI provider", choices = [
	"github",
	"gitlab",
	"none",
], default = "github" }

# Вопросы про OTA, настройки, граф, транспорт и протокол здесь НЕ объявлены:
# их задаёт хук `chip-select.rhai` после выбора чипа, а объявленный здесь
# `cargo-generate` задал бы сам и ДО него (MAINTAINING.md, «Вопросы в хуке»).
#
# `--define` — режим для скриптов и CI, и он строгий: `ext_flash` (`yes`, `no` —
# внешняя флеш W25Q на плате; есть — OTA и настройки целиком на ней), `ota`,
# `config`, `graph` (`yes`, `no`), `interface` (`none`, `uart`, `can`, `tcp`,
# `udp`, `usb`), `protocol` (`none`, `modbus`, `protobuf`, `canopen`) и
# `modbus_master` (`yes`, `no`) читаются хуком через `variable::is_set`. Ответ
# «да/нет» у всех один — `yes` или `no` (`true`/`false` не принимаются: это
# значения переменных уже после хука, `yes_no_define`); опечатка и
# невозможное для чипа значение — ошибка с объяснением (прежние `internal`/
# `external` у `ota` и `config` — тоже, с подсказкой про `ext_flash`). Не
# заданное и без терминала получает умолчание: `ext_flash` — `no`; `ota` —
# `yes`, если схема помещается, иначе `no`; `config`, `protocol`, `interface` —
# `no`/`none`; `graph` — `yes`, если влезает; `modbus_master` — `no`. Адреса
# зависимостей — `rust_lib` (всегда) и `hw_drivers` (только с внешней флешью):
# умолчания у них нет, и без терминала их задаёт только `--define`. Протокол без транспорта невозможен (транспорт
# выбирается первым), транспорт без протокола — рабочий проект: заглушка
# интерфейса и его фоновый узел есть, протокол пишете вы.
#
# Транспортов может быть несколько: хук показывает список видов с отметками
# (`[x] uart`, `[ ] can`, `ethernet`, `usb`; `done` закрывает список; у
# `ethernet` следом — TCP или UDP) и спрашивает протокол каждого отмеченного.
# Второй транспорт того же вида (в том числе TCP и UDP разом) — только через
# `--define`: там их задаёт `links` — список через запятую,
# элемент `вид[:протокол]`, без протокола — `none`:
# `--define links=uart:modbus,uart:modbus,tcp:modbus,can`. `links` задаётся
# вместо `interface` и `protocol`, а не вместе с ними. Заданный `interface` (с
# `protocol` или без) — по-старому один транспорт, без списка; `protocol=none`
# без `interface` показывает список, и протокол у отмеченных — `none`; другой
# `protocol` без `interface` — ошибка: транспорт тогда задаётся тоже. Блок чипа каждому транспорту
# назначает хук, по порядку; протокол в проекте пока один, CANopen — на одной
# шине. У каждого транспорта своё имя (блок строчными, у сети — `tcp`/`udp`) — под
# ним его поле `Board`, подмодуль `bsp` и узел графа.
#
# Сетевые службы — когда среди транспортов есть Ethernet, тем же списком с
# отметками (`ssh` — только у чипа с RNG и разделом приложения от 256 KiB,
# `rest`, `mqtt`), через `--define` — `net_services=ssh,rest,mqtt`; у SSH затем `ssh_auth`
# (`password` — умолчание и ответ без терминала, `key`) и при `key` — `ssh_key`
# (строка открытого ключа `ssh-ed25519 …`). Без Ethernet и `ssh_auth`/`ssh_key`
# без ssh — ошибка. Службы — узлы `domain::http`, `domain::ssh` и `domain::mqtt`
# (брокер — `mqtt.toml` в корне проекта, заготовку создаёт `cargo xtask`).
#
# Хук приводит ответы к строкам `"true"`/`"false"` через `variable::set`: тип
# строковый, а не `bool` (MAINTAINING.md, «Плейсхолдеры шаблона»).
#
# По умолчанию настройки выключены, и это осознанно: раздел стоит две страницы
# стирания. С OTA он обычно ложится в мелкие сектора перед ACTIVE и почти ничего
# не стоит, но без OTA это две последние страницы flash, а страница там —
# максимальный сектор чипа (на F4/F7/H7 128 KiB, то есть 256 KiB под настройки).
# Молча отдавать четверть flash нельзя, поэтому цена печатается в самом меню.

# Каталог целиком, а не перечисление файлов: иначе в проекте остаётся пустой
# `.github/workflows/` (в git он не попадёт — git не хранит пустые каталоги, —
# но на диске сбивает с толку). Имя каталога как есть, без глоба `/**` — см.
# `ignore` в [template] выше.
[conditional.'ci != "github"']
ignore = [".github"]

[conditional.'ci != "gitlab"']
ignore = [".gitlab-ci.yml", "renovate.json"]

# crates-cross/boot убирается НЕ здесь, а в chip-select.rhai (`file::delete`):
# `[conditional]` не видит переменных хука (MAINTAINING.md, «Почему
# `file::delete`, а не `[conditional]` в `cargo-generate.toml`»).

[hooks]
pre = ["chip-select.rhai"]
post = ["post-script.rhai"]
