[template]
cargo_generate_version = ">=0.19.0"
# CLAUDE.md документирует плейсхолдеры вида `{{chip}}` как буквальный текст
# (не для подстановки) — Liquid-парсер cargo-generate иначе падает на них
# с "invalid syntax". Файл всё равно копируется в сгенерированный проект.
exclude = ["CLAUDE.md"]

[placeholders]
chip = { type = "string", prompt = "Probe-rs chip identifier (e.g. STM32F407VETx)", default = "STM32F407VETx" }
chip_feature = { type = "string", prompt = "embassy-stm32 chip feature (e.g. stm32f407ve)", default = "stm32f407ve" }
target = { type = "string", prompt = "Rust target triple", choices = [
	"thumbv6m-none-eabi",
	"thumbv7m-none-eabi",
	"thumbv7em-none-eabi",
	"thumbv7em-none-eabihf",
	"thumbv8m.base-none-eabi",
	"thumbv8m.main-none-eabi",
	"thumbv8m.main-none-eabihf",
], default = "thumbv7em-none-eabihf" }
cpu = { type = "string", prompt = "Target CPU for rustflags", choices = [
	"cortex-m0",
	"cortex-m0plus",
	"cortex-m3",
	"cortex-m4",
	"cortex-m7",
	"cortex-m23",
	"cortex-m33",
], default = "cortex-m4" }
write_size = { type = "string", prompt = "Bootloader flash write/page size in bytes (STM32F1/F3/L4/G4 — обычно 2048; STM32F4/F7/H7 — сектора крупнее, см. reference manual вашего чипа)", default = "2048" }
ci = { type = "string", prompt = "CI provider", choices = [
	"github",
	"gitlab",
	"none",
], default = "github" }

[conditional.'ci != "github"']
ignore = [".github/workflows/ci.yml", ".github/dependabot.yml"]

[conditional.'ci != "gitlab"']
ignore = [".gitlab-ci.yml", "renovate.json"]

[hooks]
post = ["post-script.rhai"]
