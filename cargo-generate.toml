[template]
cargo_generate_version = ">=0.19.0"
# CLAUDE.md копируется в проект (это конвенции, по которым проект живёт), но
# без Liquid-подстановки: документ пишется людьми и ИИ, и любой пример с
# `{{...}}` в нём иначе роняет генерацию с "invalid syntax". `exclude` ровно
# это и делает — отключает подстановку, оставляя копирование.
#
# MAINTAINING.md, наоборот, в `ignore`: он про сопровождение самого шаблона
# (каскад, плейсхолдеры, template-check) и в проекте пользователя был бы
# инструкцией к тому, чего там нет.
#
# chip-data-gen — инструмент обслуживания шаблона (перегенерирует список
# чипов в chip-data/) — в проекты пользователей шаблона попадать не
# должен, поэтому в `ignore` (не копируется вовсе), а не в `exclude` (тот
# лишь отключил бы подстановку, но файл всё равно скопировался бы — и упал
# бы с "invalid syntax" на буквальном `{{chip_feature}}` в своём исходнике).
# Без глоба `/**` — со звёздочками cargo-generate директорию не распознаёт,
# нужно имя каталога как есть (проверено эмпирически).
exclude = ["CLAUDE.md"]
# "target"/"crates-cross/target" — сборочный кэш (см. .gitignore), не источник
# шаблона; без исключения `cargo generate` падает с "Substitution skipped,
# found invalid syntax", пытаясь Liquid-рендерить бинарные файлы внутри
# него, если он присутствует локально у того, кто генерирует (обычное
# состояние для мейнтейнера, собиравшего репозиторий перед тестом каскада).
# `.local`/`.remember` — рабочие каталоги инструментов мейнтейнера. В git их
# нет, но `cargo generate --path .` копирует рабочее дерево целиком, вместе с
# неотслеживаемыми файлами. `.claude` в этот список больше не входит целиком:
# `.claude/rules` — под git, это правила по путям для проекта, который
# получится (а не инструмент мейнтейнера), и обязан доехать. Рабочие файлы
# Claude Code внутри `.claude` (неотслеживаемые) перечислены ниже поимённо —
# ровно затем, чтобы не унести заодно и rules.
ignore = [
	"chip-data-gen",
	# Таблицы чипов, которые pre-хук подключает через `import`. Нужны только
	# хуку, и `import` находит их и под `ignore` (проверено эмпирически), а в
	# проекте они были бы 3.7 МБ мёртвого груза. `.tmp`/`.old` — следы
	# прерванного прогона chip-data-gen (см. `write_data_dir`).
	"chip-data",
	"chip-data.tmp",
	"chip-data.old",
	# Lock-файлы проект считает сам первой сборкой: их состав зависит от
	# ответов при генерации (протокол уносит или приносит целые крейты —
	# `crates-host/proto`, `crates-host/canopen`), и шаблонный lock подходил бы
	# одному сочетанию, а остальным ронял бы `cargo fetch --locked` в CI.
	"Cargo.lock",
	"crates-host/chip-info/Cargo.lock",
	"MAINTAINING.md",
	# CI самого репозитория шаблона. Лежит рядом с `ci.yml`, который в проекты
	# как раз копируется, поэтому исключается поимённо: `[conditional]` ниже
	# убирает `.github` целиком и только когда выбран не GitHub.
	".github/workflows/template.yml",
	"target",
	"crates-cross/target",
	"crates-host/chip-info/target",
	".local",
	".remember",
	# Рабочие файлы Claude Code — не источник шаблона, а состояние конкретной
	# машины мейнтейнера (расписания, реестр агентов, воркчаты, блокировки).
	# В git их нет, но `cargo generate --path .` копирует рабочее дерево
	# целиком, вместе с ними. Поимённо, а не каталогом `.claude` целиком —
	# иначе уехал бы и `.claude/rules` (см. комментарий выше). Список ориентирован
	# на `.git/info/exclude` (раздел `claude-code-runtime`), но не совпадает с ним
	# дословно: `settings.local.json` там не перечислен, а `.claude/routines` здесь
	# взят целиком — шире, чем `routines/.state/` там.
	".claude/settings.local.json",
	".claude/scheduled_tasks.lock",
	".claude/scheduled_tasks.json",
	".claude/routines",
	".claude/worktrees",
	".claude/checkpoints",
	".claude/mailbox",
	".claude/agent-registry.json",
	".claude/agent-memory-local",
	".claude/first-run",
	".claude/assistant-daemon-state.json",
	# Рабочие файлы agent-manager того же образца, что и `.claude` выше: воркчаты
	# клонов репозитория, планы и состояние сессии лежат в `.kilo` и под git их
	# нет. В воркчатах лежит целый checkout шаблона, поэтому Liquid из
	# MAINTAINING.md и chip-select.rhai в нём — уже отрендеренный, и cargo-generate
	# спотыкался бы о нём дважды: сначала на файлах воркчата, а после падения
	# `template-check` не проверял бы шаблон вообще. Перечислены поимённо (как
	# `.claude`), а не каталогом целиком — на месте возможных `.kilo/command` и
	# `.kilo/agent`, которым в сгенерированном проекте самое место.
	".kilo/worktrees",
	".kilo/plans",
	".kilo/agent-manager.json",
	# Рабочий каталог skill'ов superpowers (брифы задач, отчёты, леджер): в git
	# его нет, а в брифах лежат куски Liquid из плана — попади они в копию
	# шаблона, cargo-generate попытался бы их отрендерить.
	".superpowers",
	# Спеки и планы мейнтейнера (docs/superpowers/{specs,plans}): они под git,
	# но описывают сопровождение шаблона, а не проект, и цитируют Liquid из
	# файлов cross — та же причина, что у `.superpowers` строкой выше.
	"docs/superpowers",
	# Не наш файл: crashpad-лог, который роняет в корень репозитория редактор.
	# В git его нет, но `cargo generate --path .` копирует рабочее дерево
	# целиком, вместе с неотслеживаемым мусором, — и он уезжал в каждый
	# сгенерированный проект.
	"debug.log",
]

[placeholders]
# chip/chip_feature/cpu/target/write_size здесь не объявлены: их выставляет
# pre-хук chip-select.rhai (каскадный выбор STM32; write_size — только когда
# для чипа посчитан memory.x, см. MEMORY_LAYOUT в chip-data/layout) — см. CLAUDE.md,
# раздел "Плейсхолдеры шаблона". `variable::set` в hook работает независимо
# от объявления в [placeholders], а `--define chip_feature=...`/
# `--define write_size=...` по-прежнему читаются внутри hook через
# `variable::is_set`/`variable::get`.
ci = { type = "string", prompt = "CI provider", choices = [
	"github",
	"gitlab",
	"none",
], default = "github" }

# Спрашивается ДО каскада (placeholders резолвятся раньше pre-хука), поэтому
# формулировка не может ссылаться на выбранный чип. Ответ «нет» — один образ на
# весь flash: приложению достаётся не раздел `ACTIVE`, а весь чип, из проекта
# уходят `crates-cross/boot` и `bsp::ota`. `internal` — то, что было раньше
# безусловным поведением: bootloader и разделы, если схема помещается в flash
# (не помещается — хук скажет об этом и всё равно сгенерирует один образ).
# `external` — `DFU` и `STATE` на внешней флеши, внутри только bootloader и
# `ACTIVE` почти на весь чип; драйвер микросхемы подставляет проект. Меню от
# чипа не зависит (вопрос задаётся до каскада): если на этом чипе возможна
# только внешняя схема, хук скажет об этом при `internal`.
#
# Дальше это же имя перезаписывает `chip-select.rhai` через `variable::set`,
# приводя ответ к строке `"true"`/`"false"` — на неё смотрят Liquid-условия в
# шаблоне. Побочно это даёт и `--define ota=no` для скриптов.
#
# Тип строковый, а не `bool`, хотя вопрос двоичный: `variable::get` в
# rhai-хуках читает только строки и на булевом плейсхолдере падает с
# «Variable ota not a String» (проверено эмпирически).
ota = { type = "string", prompt = "OTA (bootloader + разделы ACTIVE/DFU): internal — DFU во flash чипа, external — DFU и STATE на внешней флеши", choices = [
	"internal",
	"external",
	"no",
], default = "internal" }

# Второй вопрос того же рода — и с той же механикой: строка, потому что
# `variable::get` в rhai читает только строки; ответ перезаписывается хуком в
# `"true"`/`"false"`, на которые смотрят Liquid-условия.
#
# По умолчанию «нет», в отличие от OTA, и это осознанно: раздел стоит две
# страницы стирания. С OTA он обычно ложится в мелкие сектора перед ACTIVE и
# почти ничего не стоит, но без OTA это две последние страницы flash, а
# страница там — максимальный сектор чипа (на F4/F7/H7 128 KiB, то есть
# 256 KiB под настройки). Молча отдавать четверть flash нельзя, поэтому
# включается он явно, а его цену хук печатает при генерации.
#
# `external` — настройки на внешней флеши: шаблон кладёт в слот хранилища
# заглушку (`adapters::flash::Unconnected`), драйвер своей микросхемы
# подставляете вы (bsp/src/config.rs). `internal` сам выбирает внутреннюю
# EEPROM, если она у чипа есть (L0/L1), иначе раздел во flash. Варианты те же,
# что у `ota`, — `internal`/`external`/`no`.
config = { type = "string", prompt = "Хранилище настроек (sequential-storage): internal — EEPROM или flash чипа, external — внешняя флеш", choices = [
	"no",
	"internal",
	"external",
], default = "no" }

# Третий вопрос той же формы. Смысл имеет только вместе с OTA: подписывается
# образ, который приезжает в раздел DFU. Ответ «да» без OTA хук приводит к
# «нет» и объясняет почему.
#
# По умолчанию «нет»: проверка стоит ~20 KiB flash (ed25519 из salty,
# портируемая реализация) и заметного времени на верификацию, а нужна она
# только там, где обновление приходит по каналу, которому нельзя доверять.
# Устройству, которое прошивают по проводу, подпись не даёт ничего.
signed = { type = "string", prompt = "Проверять подпись OTA-образа (ed25519, нужен OTA)", choices = [
	"yes",
	"no",
], default = "no" }

# Четвёртый вопрос той же формы (строка — потому что `variable::get` в rhai
# читает только строки). По умолчанию «да»: без графа `main` заканчивается
# сразу после инициализации, и первую же задачу приходится заводить с нуля —
# со `Spawner`, статиками и решением, что делать при её падении.
#
# Ответ приводится к «нет» там, где граф не помещается: код `supervisor`
# стоит порядка полутора килобайт на Cortex-M4 и до пяти на Cortex-M0+, и на
# 16-килобайтном чипе это разница между «собирается» и «не собирается».
# Порог — `GRAPH_MIN_PARTITION` в начале chip-select.rhai, рядом с остальными
# вспомогательными функциями.
graph = { type = "string", prompt = "Граф задач supervisor (порядок старта, рестарты, watchdog)", choices = [
	"yes",
	"no",
], default = "yes" }

# Протокол связи и интерфейс под ним — два вопроса, а не один список пар:
# недопустимое сочетание (и интерфейс, которого нет у выбранного чипа)
# отвергает chip-select.rhai — вопросы задаются до каскада, и чип здесь ещё
# неизвестен. Протокол встаёт в граф узлом (`domain::MODBUS_SLAVE_FRAG`,
# `domain::HOST_FRAG`), поэтому без графа он невозможен. Выводы интерфейса
# шаблон не выбирает: в `bsp` встаёт заглушка, которую проект меняет на
# драйвер своей платы (`cargo xtask pins USARTn --snippet`).
#
# modbus — Modbus slave (RTU поверх UART, RS-485 — тот же UART с DE);
# protobuf — сообщения protobuf от хоста, кадры COBS + CRC поверх UART.
protocol = { type = "string", prompt = "Протокол связи (узел в графе)", choices = [
	"none",
	"modbus",
	"protobuf",
], default = "none" }

interface = { type = "string", prompt = "Интерфейс под протоколом (uart — в том числе RS-485)", choices = [
	"none",
	"uart",
], default = "none" }

# Каталог целиком, а не перечисление файлов: иначе в проекте остаётся пустой
# `.github/workflows/` (в git он не попадёт — git не хранит пустые каталоги, —
# но на диске сбивает с толку). Имя каталога как есть, без глоба `/**` — см.
# `ignore` в [template] выше.
[conditional.'ci != "github"']
ignore = [".github"]

[conditional.'ci != "gitlab"']
ignore = [".gitlab-ci.yml", "renovate.json"]

# crates-cross/boot убирается НЕ здесь, а в самом chip-select.rhai (`file::delete`),
# когда OTA-схема не помещается во flash выбранного чипа. Причина: условия
# `[conditional]` вычисляются только по значениям `[placeholders]` и переменные,
# выставленные хуком через `variable::set`, не видят — проверено эмпирически
# (`[conditional.'ota != "true"']` каталог не убирал, то же условие по `ci`
# работало).

[hooks]
pre = ["chip-select.rhai"]
post = ["post-script.rhai"]
