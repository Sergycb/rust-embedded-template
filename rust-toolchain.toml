# Один компилятор у всех — у разработчика, в CI и в релизе: разные версии rustc
# дают разный машинный код, и релиз по тегу не повторить побайтно без той же
# версии. Поднимается руками{% if ci == "gitlab" %}, вместе с образами `rust:` в .gitlab-ci.yml{% endif %} —
# docs/conventions.md, «Тулчейн».
[toolchain]
channel    = "1.98.1"
components = ["rustfmt", "clippy"]
# Цель прошивки — ответ генерации; rustup ставит её вместе с тулчейном.
# {%- comment %}
# В репозитории шаблона цели нет: прошивка здесь не собирается, а
# плейсхолдер rustup принял бы за имя цели (MAINTAINING.md, «Значение в
# корневом workspace»).
# {%- endcomment %}
#{{newline}}targets    = ["{{target}}"]
