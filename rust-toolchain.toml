# Один компилятор у всех — у разработчика, в CI и в релизе. Поднимается
# руками{% if ci == "gitlab" %}, вместе с образами `rust:` в .gitlab-ci.yml{% endif %} — docs/conventions.md, «Тулчейн запинен».
[toolchain]
channel    = "1.99.1"
components = ["rustfmt", "clippy"]
# Цель прошивки — ответ генерации; rustup ставит её вместе с тулчейном.
# {%- comment %}
# В репозитории шаблона цели нет: прошивка здесь не собирается, а
# плейсхолдер rustup принял бы за имя цели (MAINTAINING.md, «Значение в
# корневом workspace»).
# {%- endcomment %}
#{{newline}}targets    = ["{{target}}"]
